name: A-track unit/integration diagnostic

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/a-track-unit-integration-diagnostic.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build test prerequisites
        run: npm run build

      - name: Prepare Playwright runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium

      - name: Browser inventory and partition fail-closed contract
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t all_standard < <(
            find tests -maxdepth 1 -type f -name '*.test.mjs' \
              ! -name 'lineage-52-route-browser-qa.test.mjs' \
              ! -name 'lineage-53-v2-route-browser-qa.test.mjs' \
              ! -name 'memory-anatomy-route-browser-qa.test.mjs' \
              -print | sort
          )
          if [ "${#all_standard[@]}" -eq 0 ]; then
            echo "FAIL-CLOSED: no standard tests discovered" >&2
            exit 1
          fi

          detect_pw() {
            grep -Eq "from ['\"]playwright['\"]|import\(['\"]playwright['\"]\)|@playwright/test|chromium\.launch|firefox\.launch|webkit\.launch" "$1"
          }

          browser_tests=()
          non_browser_tests=()
          for f in "${all_standard[@]}"; do
            if detect_pw "$f"; then
              browser_tests+=("$f")
            else
              non_browser_tests+=("$f")
            fi
          done

          for f in "${non_browser_tests[@]}"; do
            if detect_pw "$f"; then
              echo "FAIL-CLOSED: Playwright test mis-classified as non-browser: $f" >&2
              exit 1
            fi
          done
          for f in "${browser_tests[@]}"; do
            if ! detect_pw "$f"; then
              echo "FAIL-CLOSED: browser bucket entry without Playwright usage: $f" >&2
              exit 1
            fi
          done

          expected_browser_tests=(
            tests/v4-additional-source-baseline.test.mjs
            tests/v4-cinematic-v6.test.mjs
            tests/v4-cinematic.test.mjs
            tests/v4-existing-fidelity-remediation.test.mjs
            tests/v4-final-product-surfaces-browser.test.mjs
            tests/v4-first-journey-source-faithful.test.mjs
            tests/v4-first-journey-persistence-behavioral.test.mjs
            tests/v4-moments-100-source-faithful.test.mjs
            tests/lineage-59-browser-qa.test.mjs
            tests/track67-v242-browser-qa.test.mjs
            tests/track67-native-inspect-acceptance.test.mjs
          )
          expected_browser_count=11

          printf '%s\n' "${expected_browser_tests[@]}" | sort > /tmp/a-track-diagnostic-expected-browser.txt
          printf '%s\n' "${all_standard[@]}" | sort > /tmp/a-track-diagnostic-standard-corpus.txt
          printf '%s\n' "${browser_tests[@]}" | sort > /tmp/a-track-diagnostic-browser-tests.txt
          printf '%s\n' "${non_browser_tests[@]}" | sort > /tmp/a-track-diagnostic-non-browser-tests.txt

          if [ "${#expected_browser_tests[@]}" -ne "$expected_browser_count" ]; then
            echo "FAIL-CLOSED: expected browser inventory count mismatch" >&2
            exit 1
          fi
          if [ "$(sort -u /tmp/a-track-diagnostic-expected-browser.txt | wc -l)" -ne "$expected_browser_count" ]; then
            echo "FAIL-CLOSED: expected browser inventory contains duplicate entries" >&2
            exit 1
          fi
          if [ "${#browser_tests[@]}" -eq 0 ]; then
            echo "FAIL-CLOSED: browser bucket is empty" >&2
            exit 1
          fi

          missing_from_corpus="$(comm -23 /tmp/a-track-diagnostic-expected-browser.txt /tmp/a-track-diagnostic-standard-corpus.txt)"
          if [ -n "$missing_from_corpus" ]; then
            echo "FAIL-CLOSED: expected browser test(s) absent from standard corpus:" >&2
            printf '%s\n' "$missing_from_corpus" >&2
            exit 1
          fi

          if ! diff -u /tmp/a-track-diagnostic-expected-browser.txt /tmp/a-track-diagnostic-browser-tests.txt > /tmp/a-track-diagnostic-browser-setdiff.txt; then
            echo "FAIL-CLOSED: standard browser inventory drift" >&2
            cat /tmp/a-track-diagnostic-browser-setdiff.txt >&2
            exit 1
          fi

          : > /tmp/a-track-diagnostic-broad-browser.txt
          for f in "${all_standard[@]}"; do
            if grep -Eq "(import|require)[^;]*(playwright|puppeteer)|\.launch\(|\.newContext\(|\.newPage\(" "$f"; then
              printf '%s\n' "$f" >> /tmp/a-track-diagnostic-broad-browser.txt
            fi
          done
          sort -o /tmp/a-track-diagnostic-broad-browser.txt /tmp/a-track-diagnostic-broad-browser.txt
          if ! diff -u /tmp/a-track-diagnostic-expected-browser.txt /tmp/a-track-diagnostic-broad-browser.txt > /tmp/a-track-diagnostic-broad-setdiff.txt; then
            echo "FAIL-CLOSED: independent cross-detector disagrees with expected browser inventory" >&2
            cat /tmp/a-track-diagnostic-broad-setdiff.txt >&2
            exit 1
          fi

          if [ "$(( ${#browser_tests[@]} + ${#non_browser_tests[@]} ))" -ne "${#all_standard[@]}" ]; then
            echo "FAIL-CLOSED: partition size mismatch" >&2
            exit 1
          fi

          echo "standard tests: ${#all_standard[@]}"
          echo "standard non-browser tests: ${#non_browser_tests[@]}"
          echo "standard browser tests: ${#browser_tests[@]}"

      - name: Start exact-head application server
        shell: bash
        run: |
          set -euo pipefail
          npm start > /tmp/a-track-diagnostic-server.log 2>&1 &
          echo $! > /tmp/a-track-diagnostic-server.pid
          ready=0
          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/v4 > /dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$(cat /tmp/a-track-diagnostic-server.pid)" 2>/dev/null; then
              cat /tmp/a-track-diagnostic-server.log
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/a-track-diagnostic-server.log
            exit 1
          fi

      - name: Subgate — memory-anatomy-route
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx --test tests/memory-anatomy-route-browser-qa.test.mjs 2>&1 | tee /tmp/a-track-diagnostic-memory-anatomy-route.log

      - name: Subgate — standard-non-browser-tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t non_browser_tests < /tmp/a-track-diagnostic-non-browser-tests.txt
          node --import tsx --test "${non_browser_tests[@]}" 2>&1 | tee /tmp/a-track-diagnostic-standard-non-browser-tests.log

      - name: Subgate — standard-browser-tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t browser_tests < /tmp/a-track-diagnostic-browser-tests.txt
          LINEAGE59_BASE_URL=http://127.0.0.1:3000 \
          TRACK67_BASE_URL=http://127.0.0.1:3000 \
            node --import tsx --test --test-concurrency=1 "${browser_tests[@]}" 2>&1 | tee /tmp/a-track-diagnostic-standard-browser-tests.log

      - name: Subgate — lineage-52-route
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx --test tests/lineage-52-route-browser-qa.test.mjs 2>&1 | tee /tmp/a-track-diagnostic-lineage-52-route.log

      - name: Subgate — lineage-52-direct-navigation
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx --test tests/lineage-52-direct-navigation-browser-qa.mjs 2>&1 | tee /tmp/a-track-diagnostic-lineage-52-direct-navigation.log

      - name: Surface diagnostic tail
        if: failure()
        shell: bash
        run: |
          {
            echo '## A-track unit/integration diagnostic failure'
            echo
            for f in /tmp/a-track-diagnostic-*.log /tmp/a-track-diagnostic-*setdiff.txt; do
              [ -f "$f" ] || continue
              echo "### $f"
              echo '```text'
              tail -n 80 "$f"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: a-track-unit-integration-diagnostics
          if-no-files-found: warn
          retention-days: 3
          path: |
            /tmp/a-track-diagnostic-*.log
            /tmp/a-track-diagnostic-*.txt

      - name: Stop application server
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/a-track-diagnostic-server.pid ]; then
            kill "$(cat /tmp/a-track-diagnostic-server.pid)" 2>/dev/null || true
            wait "$(cat /tmp/a-track-diagnostic-server.pid)" 2>/dev/null || true
          fi
