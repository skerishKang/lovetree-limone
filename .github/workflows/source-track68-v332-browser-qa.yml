name: Track68 V3.3.2 browser QA evidence

# Evidence-only workflow for Source Track 68 V3.3.2 compare runner
# (Issue #244). It runs the dedicated browser QA helper
# `tests/source-track68-v332-browser-qa.mjs` (intentionally OUTSIDE the
# standard `tests/*.test.mjs` corpus so the shared A-track fail-closed
# browser inventory is NOT affected) and uploads the bounded screenshots as
# a GitHub artifact so the Web CTO can review them directly.
#
# This workflow does NOT modify backend/API/DB/Auth, the shared Design
# Fidelity registry, nor issues #191 / #262. Pure additive QA evidence gate.

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - AGENTS.md
      - docs/operations/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  track68-browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Restore Playwright Chromium cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.55.0-chromium

      - name: Prepare Playwright runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium

      - name: Verify exact Track68 V3.3.2 assets
        run: node scripts/verify-source-track68-v332-assets.mjs

      - name: Run Track68 V3.3.2 browser QA
        shell: bash
        run: |
          set -euo pipefail
          npm start > /tmp/track68-browser-qa-server.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in {1..90}; do
            if curl --fail --silent --show-error "http://127.0.0.1:3000/design-lab/source-tracks/68/v3-3-2/compare" > /dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/track68-browser-qa-server.log
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/track68-browser-qa-server.log
            exit 1
          fi

          mkdir -p /tmp/track68-browser-qa
          V4_BASE_URL="http://127.0.0.1:3000" \
            TRACK68_SCREENSHOT_DIR="/tmp/track68-browser-qa" \
            node --import tsx tests/source-track68-v332-browser-qa.mjs

      - name: Upload Track68 V3.3.2 browser QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: track68-v332-browser-qa-evidence
          path: |
            /tmp/track68-browser-qa/*.png
          if-no-files-found: warn
