name: One-shot CORE runtime tail path fix

on:
  push:
    branches:
      - refactor/core-runtime-boundary-v1

permissions:
  contents: write

jobs:
  fix-tail-path-consumers:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rewrite exact remaining stale CORE paths
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'tests/pr39-backend-targeted.test.mjs': [
                  ('./drizzle/0002_fixed_scarlet_spider.sql', './core/runtime/drizzle/0002_fixed_scarlet_spider.sql'),
                  ('./drizzle/0003_sort_order_backfill.sql', './core/runtime/drizzle/0003_sort_order_backfill.sql'),
              ],
              'tests/v4-p2-memory-contracts.test.mjs': [
                  ('read("drizzle/0003_peaceful_radioactive_man.sql")', 'read("core/runtime/drizzle/0003_peaceful_radioactive_man.sql")'),
                  ('read("db/schema.ts")', 'read("core/runtime/db/schema.ts")'),
                  ('read("server/api/memories.ts")', 'read("core/runtime/server/api/memories.ts")'),
                  ('read("server/api/trees.ts")', 'read("core/runtime/server/api/trees.ts")'),
              ],
          }

          changed = []
          for rel, pairs in replacements.items():
              p = Path(rel)
              text = p.read_text(encoding='utf-8')
              before = text
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'missing expected stale path in {rel}: {old}')
                  text = text.replace(old, new)
              p.write_text(text, encoding='utf-8')
              changed.append(rel)

          residuals = {
              'tests/pr39-backend-targeted.test.mjs': ['./drizzle/0002_fixed_scarlet_spider.sql', './drizzle/0003_sort_order_backfill.sql'],
              'tests/v4-p2-memory-contracts.test.mjs': ['read("drizzle/', 'read("db/', 'read("server/'],
          }
          for rel, needles in residuals.items():
              text = Path(rel).read_text(encoding='utf-8')
              for needle in needles:
                  if needle in text:
                      raise SystemExit(f'residual stale CORE path in {rel}: {needle}')

          print('changed files:')
          for rel in changed:
              print(rel)
          PY

          git diff --check
          git diff -- tests/pr39-backend-targeted.test.mjs tests/v4-p2-memory-contracts.test.mjs

      - name: Commit exact path-only updates
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/pr39-backend-targeted.test.mjs tests/v4-p2-memory-contracts.test.mjs
          git commit -m "test(core): close final relocated runtime path consumers"
          git push origin HEAD:refactor/core-runtime-boundary-v1
