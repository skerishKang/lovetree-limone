name: Track01 Community visual fidelity browser QA

on:
  pull_request:
    branches:
      - main
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.ts'
      - 'vite.config.ts'
      - 'postcss.config.mjs'
      - 'tsconfig.json'
      - 'app/layout.tsx'
      - 'app/globals.css'
      - 'app/v4/community/**'
      - 'app/components/v4/product/V4GlobalDiscoveryHome.tsx'
      - 'app/styles/v4/global-discovery-home.css'
      - 'lib/api*'
      - 'lib/tree-types.ts'
      - 'reference/source-tracks-snapshot/01_0730작업물/**'
      - 'qa/track01-community-visual-fidelity-browser-qa.mjs'
      - 'tests/track01-community-visual-fidelity-contract.test.mjs'
      - '.github/workflows/track01-community-visual-fidelity-browser-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  track01-community-visual-fidelity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Track01 focused contract if present
        shell: bash
        run: |
          set -euo pipefail
          if [ -f tests/track01-community-visual-fidelity-contract.test.mjs ]; then
            node --import tsx --test tests/track01-community-visual-fidelity-contract.test.mjs
          fi

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Prepare Playwright runtime
        run: npx playwright install --with-deps chromium

      - name: Run Track01 source-native browser QA
        shell: bash
        run: |
          set -euo pipefail
          npm start > /tmp/track01-community-server.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in {1..90}; do
            if curl --fail --silent --show-error "http://127.0.0.1:3000/v4/community" > /dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/track01-community-server.log
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/track01-community-server.log
            exit 1
          fi

          TRACK01_QA_URL="http://127.0.0.1:3000" \
            node qa/track01-community-visual-fidelity-browser-qa.mjs

      - name: Upload Track01 visual fidelity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: track01-community-visual-fidelity-evidence
          path: |
            qa-artifacts/track01-community-visual-fidelity/*.png
            qa-artifacts/track01-community-visual-fidelity/visual-fidelity.json
          if-no-files-found: warn
