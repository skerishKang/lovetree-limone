name: Track26 Memory Film Studio donor browser QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/design-lab/source-tracks/26/v1/donor/**'
      - 'lib/source-track-26/**'
      - 'design-intake/source-track-26-memory-film-studio-v1-donor.json'
      - 'reference/source-tracks-snapshot/26_메모리필름스튜디오/**'
      - 'tests/source-track-26-memory-film-studio-v1-donor-contract.test.mjs'
      - 'qa/source-track-26-memory-film-studio-v1-donor-browser-qa.mjs'
      - '.github/workflows/source-track26-memory-film-studio-donor-browser-qa.yml'
      - 'lib/use-tree-moments.ts'
      - 'lib/moment-model.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  track26-film-studio-donor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Track26 focused contract
        run: node --test tests/source-track-26-memory-film-studio-v1-donor-contract.test.mjs
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Prepare Playwright runtime
        run: npx playwright install --with-deps chromium
      - name: Run Track26 browser QA
        shell: bash
        run: |
          set -euo pipefail
          npm start > /tmp/track26-server.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=0
          for attempt in {1..90}; do
            if curl --fail --silent --show-error 'http://127.0.0.1:3000/design-lab/source-tracks/26/v1/donor' > /dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/track26-server.log
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/track26-server.log
            exit 1
          fi
          V4_BASE_URL='http://127.0.0.1:3000' node qa/source-track-26-memory-film-studio-v1-donor-browser-qa.mjs
      - name: Upload Track26 visual fidelity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: track26-memory-film-studio-visual-qa
          path: qa/artifacts/track26-memory-film-studio/
          if-no-files-found: warn
