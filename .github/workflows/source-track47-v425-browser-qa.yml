name: Track47 V4.2.5 hold browser QA evidence

# Evidence-only workflow for PR #238 (Source Track 47 V4.2.5 cinematic front
# door). It runs the dedicated browser QA helper
# `tests/source-track-47-browser-qa.mjs` in its `hold` phase (intentionally
# OUTSIDE the standard `tests/*.test.mjs` corpus so the shared A-track
# fail-closed browser inventory is NOT affected) and uploads the bounded
# screenshots as a GitHub artifact so the Web CTO can review them directly.
#
# The exact 28,650,099 B cinematic video is NOT provisioned here (it must never
# be committed; see VIDEO_EXACT_ASSET_HOLD). The `hold` phase therefore runs the
# source-faithful poster/video-failed path only. This workflow does NOT modify
# backend/API/DB/Auth, the shared Design Fidelity registry, nor issues
# #191 / #232 / #233 / #237. Pure additive QA evidence gate.

on:
  pull_request:
    branches:
      - main
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.ts'
      - 'vite.config.ts'
      - 'postcss.config.mjs'
      - 'tsconfig.json'
      - 'scripts/apply-vinext-static-cache-posix-keys.mjs'
      - 'scripts/prune-rsc-assets.mjs'
      - 'app/layout.tsx'
      - 'app/globals.css'
      - 'app/flow.css'
      - 'app/tree-pages.css'
      - 'lib/auth.tsx'
      - 'lib/auth-errors.ts'
      - 'lib/firebase.ts'
      - 'public/**'
      - 'assets/**'
      - '.github/workflows/source-track47-v425-browser-qa.yml'
      - 'app/design-lab/source-tracks/47/v4-2-5/native/**'
      - 'tests/source-track-47-browser-qa.mjs'
      - 'lib/source-track-47/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  track47-hold-browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare Playwright runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium

      - name: Run Track47 V4.2.5 hold browser QA
        shell: bash
        run: |
          set -euo pipefail
          npm start > /tmp/track47-hold-browser-qa-server.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in {1..90}; do
            if curl --fail --silent --show-error "http://127.0.0.1:3000/design-lab/source-tracks/47/v4-2-5/native" > /dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/track47-hold-browser-qa-server.log
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/track47-hold-browser-qa-server.log
            exit 1
          fi

          mkdir -p /tmp/track47-browser-qa
          V4_BASE_URL="http://127.0.0.1:3000" \
            TRACK47_SCREENSHOT_DIR="/tmp/track47-browser-qa" \
            node --import tsx tests/source-track-47-browser-qa.mjs hold

      - name: Upload Track47 V4.2.5 hold browser QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: track47-v425-hold-browser-qa-evidence
          path: |
            /tmp/track47-browser-qa/*.png
          if-no-files-found: warn
