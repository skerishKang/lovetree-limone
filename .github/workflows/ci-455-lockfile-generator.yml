name: CI 455 lockfile generator

on:
  push:
    branches:
      - ci/455-root-playwright-pin
    paths:
      - .github/workflows/ci-455-lockfile-generator.yml

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ci/455-root-playwright-pin

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Generate canonical Playwright lockfile delta
        run: npm install --package-lock-only --ignore-scripts --save-dev --save-exact playwright@1.55.1

      - name: Verify exact root pin
        shell: bash
        run: |
          node -e "const p=require('./package.json'); if (p.devDependencies?.playwright !== '1.55.1') process.exit(1)"
          node -e "const p=require('./package-lock.json'); if (p.packages?.['']?.devDependencies?.playwright !== '1.55.1') process.exit(1); if (p.packages?.['node_modules/playwright']?.version !== '1.55.1') process.exit(1); if (p.packages?.['node_modules/playwright-core']?.version !== '1.55.1') process.exit(1)"

      - name: Commit generated manifest and lockfile
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "build(455): lock Playwright 1.55.1"
          git push origin HEAD:ci/455-root-playwright-pin
