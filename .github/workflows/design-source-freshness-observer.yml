# Design Source Freshness Observer (Issue #173)
#
# SECURITY TOPOLOGY — two strictly separated jobs:
#
# 1. `observer-contract` (UNPRIVILEGED, runs on every PR):
#    - executes repository + PR code with NO Drive credentials, NO repo
#      secrets and NO `id-token` permission — there is nothing sensitive to
#      steal from an untrusted PR;
#    - runs the offline fixture acceptance matrix + static security
#      contracts and proves LIVE mode fails closed (exit 3) when the
#      credential contract is absent.
#
# 2. `live-observation` (TRUSTED HOLD, manual dispatch only):
#    - can only run when the dispatch ref name exactly equals the repository
#      default branch, and checkout is explicitly pinned to that default branch;
#    - never trusts a workflow input, PR head, pull ref or tag as executable
#      live-observation code;
#    - intentionally FAILS (LIVE_WIF_CONFIGURATION_HOLD) until the Web CTO
#      provisions the Google Workload Identity Federation binding described
#      in docs/design-intake/drive-observer-wif-trust-topology.md;
#    - `id-token: write` stays COMMENTED OUT on purpose: enabling it before
#      the WIF policy exists would advertise a live path that cannot work.
#
# This workflow performs NO branch-protection/ruleset mutation and adds NO
# required check (BRANCH_PROTECTION_MUTATION_HOLD).
#
# pull_request_target is FORBIDDEN here: it would hand repository secrets and
# a privileged token to untrusted PR code.

name: Design Source Freshness Observer

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mode:
        description: "contract (offline fixtures) | live (fail-closed until WIF is provisioned)"
        required: true
        default: contract
        type: choice
        options:
          - contract
          - live

permissions:
  contents: read

jobs:
  observer-contract:
    name: Observer contract + security (unprivileged, credential-free)
    if: github.event_name == 'pull_request' || inputs.mode == 'contract'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Read-only for code. No id-token, no secrets — an untrusted PR must
      # never be able to reach privileged Drive credentials from this job.
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: "#171 pure resolver regression (reused unchanged by the observer)"
        run: node --import tsx --test tests/design-intake-source-freshness.test.mjs

      - name: Observer acceptance matrix + security contracts
        run: >-
          node --import tsx --test
          tests/design-intake-drive-observer.test.mjs
          tests/design-intake-drive-observer-security-closure.test.mjs

      - name: "FAIL-CLOSED proof: live mode without credentials must refuse (exit 3)"
        shell: bash
        env:
          DESIGN_INTAKE_DRIVE_ACCESS_TOKEN: ""
        run: |
          set -uo pipefail
          # The runner shell enables errexit; disable it around the probe so
          # the refusal exit code can be captured and verified.
          set +e
          node --import tsx scripts/design-intake-drive-observe.mjs \
            --config tests/fixtures/source-freshness/observer/observer-config.json \
            --mode live \
            --track track-observer-62-exact
          status=$?
          set -e
          if [ "$status" -ne 3 ]; then
            echo "::error::LIVE mode must fail closed without the credential contract (expected exit 3 LIVE_DISABLED, got $status)"
            exit 1
          fi
          echo "LIVE mode correctly refused (exit 3) — no credential is reachable from this unprivileged job."

  live-observation:
    name: Live observation (trusted hold — default-branch code only)
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'live' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # id-token: write  # HOLD — enable ONLY after the Web CTO provisions:
      #   - a Google Workload Identity Federation provider pinned to this
      #     repository_id (immutable numeric id, not just the repo name);
      #   - a WIF service-account mapping pinned to the exact trusted
      #     observer workflow (job_workflow_ref + SHA);
      #   - a dedicated read-only identity with Drive read-only scope.
      # See docs/design-intake/drive-observer-wif-trust-topology.md.
    steps:
      - name: Checkout trusted default-branch code ONLY
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: LIVE_WIF_CONFIGURATION_HOLD
        # Intentionally fails: live Drive observation is NOT authorized yet.
        # A red hold is the honest state — this job must never fabricate a
        # PASS and must never be silenced to green before the trust topology
        # below actually exists.
        run: |
          echo "LIVE_WIF_CONFIGURATION_HOLD — live Drive observation is not authorized yet."
          echo "Required before this job can pass (Web CTO decision, Issue #173):"
          echo "  1. Google WIF provider pinned to repository_id + trusted workflow identity"
          echo "  2. Dedicated read-only Google identity with Drive read-only scope"
          echo "  3. Short-lived token injection via DESIGN_INTAKE_DRIVE_ACCESS_TOKEN only"
          echo "     (no service-account JSON keys, no OAuth refresh tokens — refused by design)"
          echo "  4. design-intake/observer/drive-observer.config.json with real folder ids"
          echo "  5. Enabling id-token: write in THIS job only (never in observer-contract)"
          echo "Until every item above exists, live observation fails closed:"
          exit 1
