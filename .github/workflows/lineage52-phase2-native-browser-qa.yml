name: Lineage52 Phase2 native spatial primitive QA

on:
  pull_request:
    branches:
      - main
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.ts'
      - 'vite.config.ts'
      - 'postcss.config.mjs'
      - 'tsconfig.json'
      - 'scripts/apply-vinext-static-cache-posix-keys.mjs'
      - 'scripts/prune-rsc-assets.mjs'
      - 'app/layout.tsx'
      - 'app/globals.css'
      - 'app/flow.css'
      - 'app/tree-pages.css'
      - 'lib/auth.tsx'
      - 'lib/auth-errors.ts'
      - 'lib/firebase.ts'
      - 'public/**'
      - 'assets/**'
      - '.github/workflows/lineage52-phase2-native-browser-qa.yml'
      - 'app/design-lab/lineages/52/phase-2/**'
      - 'qa/lineage-52-phase2-native-browser-qa.mjs'
      - 'tests/lineage-52-phase2-spatial-core.test.mjs'
      - 'lib/lineage-52/**'
      - 'lib/design-runtime/transport*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lineage52-phase2-native-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Focused Lineage52 spatial core tests
        run: node --import tsx --test tests/lineage-52-phase2-spatial-core.test.mjs

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Prepare Playwright runtime
        run: |
          npx playwright install --with-deps chromium

      - name: Run Lineage52 Phase2 native browser QA
        shell: bash
        run: |
          set -euo pipefail
          npm start > /tmp/lineage52-phase2-native-qa-server.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in {1..90}; do
            if curl --fail --silent --show-error "http://127.0.0.1:3000/design-lab/lineages/52/phase-2" > /dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/lineage52-phase2-native-qa-server.log
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/lineage52-phase2-native-qa-server.log
            exit 1
          fi

          mkdir -p qa/evidence/lineage-52-phase2
          LINEAGE52_PHASE2_QA_URL="http://127.0.0.1:3000" \
            node qa/lineage-52-phase2-native-browser-qa.mjs

      - name: Upload Lineage52 Phase2 QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lineage52-phase2-native-qa-evidence
          path: |
            qa/evidence/lineage-52-phase2/*.png
            qa/evidence/lineage-52-phase2/qa-results.json
          if-no-files-found: warn
