name: One-shot CORE runtime path consumer fix

on:
  push:
    branches:
      - refactor/core-runtime-boundary-v1

permissions:
  contents: write

jobs:
  fix-path-consumers:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rewrite only stale CORE runtime test paths
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          targets = [
              'tests/cache-versioning-contract.test.mjs',
              'tests/community-query.test.mjs',
              'tests/email-auth.test.mjs',
              'tests/memories-api.test.mjs',
              'tests/migration.test.mjs',
              'tests/moment-data-spine.test.mjs',
              'tests/pr39-backend-targeted.test.mjs',
              'tests/rendered-html.test.mjs',
              'tests/rollback-compat.test.mjs',
              'tests/routing.test.mjs',
              'tests/schema-reconciliation.test.mjs',
              'tests/social-tree-likes.test.mjs',
              'tests/v2-parity.test.mjs',
              'tests/v4-p2-memory-contracts.test.mjs',
              'tests/v4-runtime-e2e-server-guard.test.mjs',
              'tests/validate.test.mjs',
          ]

          replacements = [
              ('"../server/', '"../core/runtime/server/'),
              ("'../server/", "'../core/runtime/server/"),
              ('"../db/', '"../core/runtime/db/'),
              ("'../db/", "'../core/runtime/db/"),
              ('"../drizzle/', '"../core/runtime/drizzle/'),
              ("'../drizzle/", "'../core/runtime/drizzle/"),
              ('"../worker/', '"../core/runtime/worker/'),
              ("'../worker/", "'../core/runtime/worker/"),
              ('readRoot("server/', 'readRoot("core/runtime/server/'),
              ("readRoot('server/", "readRoot('core/runtime/server/"),
              ('readRoot("db/', 'readRoot("core/runtime/db/'),
              ("readRoot('db/", "readRoot('core/runtime/db/"),
              ('readRoot("drizzle/', 'readRoot("core/runtime/drizzle/'),
              ("readRoot('drizzle/", "readRoot('core/runtime/drizzle/"),
              ('readRoot("worker/', 'readRoot("core/runtime/worker/'),
              ("readRoot('worker/", "readRoot('core/runtime/worker/"),
              ('new URL("server/', 'new URL("core/runtime/server/'),
              ("new URL('server/", "new URL('core/runtime/server/"),
              ('new URL("db/', 'new URL("core/runtime/db/'),
              ("new URL('db/", "new URL('core/runtime/db/"),
              ('new URL("drizzle/', 'new URL("core/runtime/drizzle/'),
              ("new URL('drizzle/", "new URL('core/runtime/drizzle/"),
              ('new URL("worker/', 'new URL("core/runtime/worker/'),
              ("new URL('worker/", "new URL('core/runtime/worker/"),
          ]

          changed = []
          for rel in targets:
              p = Path(rel)
              if not p.exists():
                  raise SystemExit(f'missing expected test file: {rel}')
              before = p.read_text(encoding='utf-8')
              after = before
              for old, new in replacements:
                  after = after.replace(old, new)
              if after != before:
                  p.write_text(after, encoding='utf-8')
                  changed.append(rel)

          if not changed:
              raise SystemExit('no stale CORE runtime paths were rewritten')

          residual = re.compile(r'''["']\.\./(?:server|db|drizzle|worker)/|(?:readRoot|new URL)\(["'](?:server|db|drizzle|worker)/''')
          bad = []
          for rel in targets:
              text = Path(rel).read_text(encoding='utf-8')
              if residual.search(text):
                  bad.append(rel)
          if bad:
              raise SystemExit('residual stale CORE runtime paths: ' + ', '.join(bad))

          print('changed files:')
          for rel in changed:
              print(rel)
          PY

          git diff --check
          test -n "$(git status --porcelain tests)"

      - name: Commit path-only test updates
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests
          git commit -m "test(core): update relocated runtime path consumers"
          git push origin HEAD:refactor/core-runtime-boundary-v1
