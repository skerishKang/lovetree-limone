name: Five-source isolated preview deploy

on:
  push:
    branches:
      - preview/five-source-rc-20260827

permissions:
  contents: read

concurrency:
  group: lovetree-five-source-isolated-preview
  cancel-in-progress: false

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: relovetree
      PREVIEW_WORKER: lovetree-limone-five-source-preview
      PREVIEW_BASE_URL: https://lovetree-limone-five-source-preview.charliekant.workers.dev
      PREVIEW_ENTRY_URL: https://lovetree-limone-five-source-preview.charliekant.workers.dev/trees/five-source-preview
      EXPECTED_APP_MAIN_SHA: 11e7a1b2b70601141452b45750a049f54841134c

    steps:
      - name: Checkout isolated preview branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify bounded preview-only delta
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "$EXPECTED_APP_MAIN_SHA" HEAD | sort > /tmp/preview-changed.txt
          printf '%s\n' \
            '.github/workflows/five-source-isolated-preview-deploy.yml' \
            'lib/api.ts' | sort > /tmp/preview-expected.txt
          if ! diff -u /tmp/preview-expected.txt /tmp/preview-changed.txt; then
            echo 'BLOCKED: preview branch contains files outside the isolated deployment/data seam.' >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fail closed on missing preview configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DATABASE_URL NEXT_PUBLIC_FIREBASE_API_KEY NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            printf 'BLOCKED: missing preview configuration name(s): %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Typecheck preview seam
        run: npm run typecheck

      - name: Build isolated preview artifact
        run: npm run build

      - name: Guarded isolated preview dry-run
        run: |
          npm run preview:deploy:safe -- \
            --worker "$PREVIEW_WORKER" \
            --confirm-worker "$PREVIEW_WORKER" \
            --source-sha "$(git rev-parse HEAD)"

      - name: Guarded isolated preview deploy
        run: |
          npm run preview:deploy:safe -- \
            --worker "$PREVIEW_WORKER" \
            --confirm-worker "$PREVIEW_WORKER" \
            --source-sha "$(git rev-parse HEAD)" \
            --execute

      - name: Generate deterministic safe preview config for read-only database secret
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .preview-safe-config
          node --input-type=module <<'NODE'
          import path from 'node:path';
          import { buildSafePreviewConfig } from './scripts/lib/isolated-preview-deploy-guard.mjs';
          await buildSafePreviewConfig({
            repoRoot: process.cwd(),
            workerName: process.env.PREVIEW_WORKER,
            outputDir: path.join(process.cwd(), '.preview-safe-config'),
          });
          NODE

      - name: Attach database secret to isolated read-only preview
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$DATABASE_URL" | npx wrangler secret put DATABASE_URL \
            --config .preview-safe-config/wrangler-isolated-preview.json

      - name: Preview HTTP smoke
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            code="$(curl --location --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 "$PREVIEW_ENTRY_URL")"
            case "$code" in
              200|301|302|307|308) break ;;
              *) if [ "$attempt" -eq 30 ]; then echo "BLOCKED: preview entry HTTP $code" >&2; exit 1; fi ;;
            esac
            sleep 2
          done
          for route in \
            /trees/five-source-preview \
            /trees/five-source-preview/board \
            /trees/five-source-preview/relationships \
            /trees/five-source-preview/explore \
            /trees/five-source-preview/portal; do
            code="$(curl --location --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 "${PREVIEW_BASE_URL}${route}")"
            printf '%s -> HTTP %s\n' "$route" "$code"
            [ "$code" = '200' ] || exit 1
          done

      - name: Prepare live Chromium
        run: npx playwright install --with-deps chromium

      - name: Live five-view click QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .preview-live-qa
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { chromium } from 'playwright';

          const base = process.env.PREVIEW_BASE_URL.replace(/\/$/, '');
          const treeId = 'five-source-preview';
          const screenshotDir = '.preview-live-qa';
          const browser = await chromium.launch({ headless: true });
          const proof = { treeId, entryUrl: `${base}/trees/${treeId}`, viewports: [] };

          async function waitForSource(page, source) {
            await page.locator(`[data-mvp-source="${source}"]`).first().waitFor({ state: 'visible', timeout: 20000 });
          }
          async function assertMomentQuery(page, momentId, label) {
            const current = new URL(page.url());
            assert.equal(current.searchParams.get('moment'), momentId, `${label}: Moment identity changed`);
            assert.match(current.pathname, new RegExp(`^/trees/${treeId}(?:/|$)`), `${label}: Tree identity changed`);
          }
          async function assertNoOverflow(page, label) {
            const metrics = await page.evaluate(() => ({
              viewport: window.innerWidth,
              body: document.body.scrollWidth,
              root: document.documentElement.scrollWidth,
            }));
            assert.ok(metrics.body <= metrics.viewport, `${label}: body overflow ${metrics.body} > ${metrics.viewport}`);
            assert.ok(metrics.root <= metrics.viewport, `${label}: root overflow ${metrics.root} > ${metrics.viewport}`);
          }
          async function clickView(page, name, source, momentId, prefix, records) {
            const nav = page.getByRole('navigation', { name: '보기 전환' });
            const link = nav.getByRole('link', { name, exact: true });
            const href = await link.getAttribute('href');
            assert.ok(href?.includes(`/trees/${treeId}`), `${prefix}: Tree identity missing from href`);
            assert.ok(href?.includes(`moment=${encodeURIComponent(momentId)}`), `${prefix}: Moment identity missing from href`);
            await link.click();
            await waitForSource(page, source);
            await assertMomentQuery(page, momentId, prefix);
            assert.equal(await page.getByRole('navigation', { name: '보기 전환' }).getByRole('link', { name, exact: true }).getAttribute('aria-current'), 'page');
            await assertNoOverflow(page, prefix);
            await page.screenshot({ path: `${screenshotDir}/${prefix}.png`, fullPage: false });
            records.push({ name, source, url: page.url() });
          }

          async function auditViewport({ name, width, height, reducedMotion = false }) {
            const context = await browser.newContext({
              viewport: { width, height },
              hasTouch: width <= 390,
              isMobile: width <= 390,
            });
            const page = await context.newPage();
            if (reducedMotion) await page.emulateMedia({ reducedMotion: 'reduce' });
            const records = [];

            const response = await page.goto(`${base}/trees/${treeId}`, { waitUntil: 'domcontentloaded' });
            assert.ok(response?.ok(), `${name}: entry route must return 2xx`);
            await waitForSource(page, '57');
            await page.getByText('LoveTree Five-View Preview').first().waitFor({ timeout: 15000 });
            await assertMomentQuery(page, null, `${name}-57`);
            await assertNoOverflow(page, `${name}-57`);
            await page.screenshot({ path: `${screenshotDir}/${name}-57.png`, fullPage: false });
            records.push({ name: '기억', source: '57', url: page.url() });

            const boardNav = page.getByRole('navigation', { name: '보기 전환' });
            const boardLink = boardNav.getByRole('link', { name: '보드', exact: true });
            assert.ok((await boardLink.getAttribute('href'))?.includes(`/trees/${treeId}/board`));
            await boardLink.click();
            await waitForSource(page, '58');
            await page.waitForURL((url) => url.searchParams.get('moment') === 'm-root', { timeout: 15000 });
            await assertMomentQuery(page, 'm-root', `${name}-58-default`);
            await assertNoOverflow(page, `${name}-58-default`);
            await page.screenshot({ path: `${screenshotDir}/${name}-58.png`, fullPage: false });
            records.push({ name: '보드', source: '58', url: page.url() });

            const childCard = page.getByRole('button', { name: 'Second path 선택' });
            await childCard.waitFor({ timeout: 15000 });
            await childCard.click();
            await page.waitForURL((url) => url.searchParams.get('moment') === 'm-child', { timeout: 15000 });

            await page.goBack({ waitUntil: 'domcontentloaded' });
            await waitForSource(page, '57');
            await assertMomentQuery(page, null, `${name}-57-back`);
            await page.goForward({ waitUntil: 'domcontentloaded' });
            await waitForSource(page, '58');
            await assertMomentQuery(page, 'm-child', `${name}-58-forward`);

            await clickView(page, '관계', '56', 'm-child', `${name}-56`, records);
            assert.equal(await page.locator('[data-network-moment-id="m-child"]').getAttribute('aria-pressed'), 'true');

            await clickView(page, '탐색', '60', 'm-child', `${name}-60`, records);
            assert.ok(await page.locator('canvas').count(), `${name}: Source60 canvas missing`);

            await clickView(page, '포털', '64', 'm-child', `${name}-64`, records);
            assert.ok(await page.locator('[data-rendering="css3d-dom"]').count(), `${name}: Source64 CSS3D rendering missing`);

            await page.goBack({ waitUntil: 'domcontentloaded' });
            await waitForSource(page, '60');
            await assertMomentQuery(page, 'm-child', `${name}-60-back-from-portal`);
            records.push({ name: '뒤로→탐색', source: '60', url: page.url() });

            proof.viewports.push({ name, width, height, reducedMotion, records });
            await context.close();
          }

          try {
            await auditViewport({ name: 'desktop-1280x800', width: 1280, height: 800 });
            await auditViewport({ name: 'phone-390x844', width: 390, height: 844 });
            await auditViewport({ name: 'narrow-320x720-reduced', width: 320, height: 720, reducedMotion: true });
            fs.writeFileSync(`${screenshotDir}/result.json`, JSON.stringify(proof, null, 2));
            console.log(JSON.stringify(proof, null, 2));
            console.log('LIVE_FIVE_SOURCE_PREVIEW_QA_PASS');
          } finally {
            await browser.close();
          }
          NODE

      - name: Upload live click evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: five-source-isolated-preview-live-qa
          path: .preview-live-qa
          if-no-files-found: warn
          retention-days: 14

      - name: Publish preview summary
        shell: bash
        run: |
          {
            echo '## LoveTree five-source isolated preview'
            echo
            echo "- production app baseline: \`$EXPECTED_APP_MAIN_SHA\`"
            echo "- preview wrapper head: \`$(git rev-parse HEAD)\`"
            echo "- Worker: \`$PREVIEW_WORKER\`"
            echo "- entry URL: $PREVIEW_ENTRY_URL"
            echo '- data: isolated read-only preview fixture; no DB writes'
            echo '- live Chromium: desktop + phone + narrow/reduced-motion five-view click QA PASS'
            echo '- Production Worker touched: no'
          } >> "$GITHUB_STEP_SUMMARY"
