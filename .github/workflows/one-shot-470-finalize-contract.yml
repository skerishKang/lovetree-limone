name: One-shot #470 finalize provenance contract

on:
  push:
    branches:
      - design/470-ledger-provenance-reconciliation

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/470-ledger-provenance-reconciliation
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Link #471 and fail-close snapshot paths
        run: |
          node <<'NODE'
          const fs = require('fs');
          const ledgerPath = 'design-intake/master-design-coverage.json';
          const testPath = 'tests/master-design-coverage-contract.test.mjs';
          const ledger = JSON.parse(fs.readFileSync(ledgerPath, 'utf8'));
          const byId = new Map(ledger.rows.map((row) => [row.master_id, row]));
          byId.get(13).github_issue = [471];
          byId.get(14).github_issue = [471];

          const { rows, ...meta } = ledger;
          let output = JSON.stringify({ ...meta, rows: [] }, null, 2);
          const marker = '  "rows": []\n}';
          if (!output.includes(marker)) throw new Error('rows marker not found');
          const compactRows = rows.map((row) => `    ${JSON.stringify(row)}`).join(',\n');
          output = output.replace(marker, `  "rows": [\n${compactRows}\n  ]\n}`) + '\n';
          fs.writeFileSync(ledgerPath, output);

          let test = fs.readFileSync(testPath, 'utf8');
          test = test.replace("import { readFileSync } from 'node:fs';", "import { existsSync, readFileSync } from 'node:fs';");
          test = test.replace(
            "    assert.match(row.reference_path, /^reference\\/source-tracks-snapshot\\//);\n    assert.equal(row.current_main_present, true);",
            "    assert.match(row.reference_path, /^reference\\/source-tracks-snapshot\\//);\n    assert.ok(existsSync(new URL('../' + row.reference_path, import.meta.url)), 'master_id=' + id + ' snapshot path must exist');\n    assert.equal(row.current_main_present, true);"
          );
          test = test.replace(
            "  assert.equal(byId(107).manifest_path, 'app/components/v4/v4-source-manifest.ts');",
            "  assert.equal(byId(107).manifest_path, 'app/components/v4/v4-source-manifest.ts');\n  assert.ok(existsSync(new URL('../' + byId(107).reference_path, import.meta.url)), 'master_id=107 snapshot path must exist');"
          );
          test = test.replace(
            "  assert.equal(byId(14).family_anchor_master_id, 13);",
            "  assert.equal(byId(14).family_anchor_master_id, 13);\n  assert.deepEqual(byId(13).github_issue, [471]);\n  assert.deepEqual(byId(14).github_issue, [471]);"
          );
          fs.writeFileSync(testPath, test);
          NODE

      - name: Validate focused contract
        run: node --test tests/master-design-coverage-contract.test.mjs

      - name: Commit final provenance contract
        run: |
          rm .github/workflows/one-shot-470-finalize-contract.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add design-intake/master-design-coverage.json tests/master-design-coverage-contract.test.mjs .github/workflows/one-shot-470-finalize-contract.yml
          git commit -m "test(470): fail-close snapshot provenance paths"
          git push origin HEAD:design/470-ledger-provenance-reconciliation
