name: CI 455 apply root Playwright pin

on:
  push:
    branches:
      - ci/455-root-playwright-pin
    paths:
      - .github/workflows/ci-455-apply-root-pin.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ci/455-root-playwright-pin

      - name: Remove exact redundant dynamic installs
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          workflows = [
              '.github/workflows/a-track-p0-validation.yml',
              '.github/workflows/design-fidelity-validation.yml',
              '.github/workflows/lineage52-phase2-native-browser-qa.yml',
              '.github/workflows/lineage60-v12-native-browser-qa.yml',
              '.github/workflows/living-media-sphere-v3-hold-browser-qa.yml',
              '.github/workflows/source-track18-v2-browser-qa.yml',
              '.github/workflows/source-track47-v425-browser-qa.yml',
              '.github/workflows/source-track68-v332-browser-qa.yml',
              '.github/workflows/track62-v11-continuous-exhibition-qa.yml',
              '.github/workflows/track66-native-browser-qa.yml',
              '.github/workflows/track67-native-browser-qa.yml',
          ]
          needle = '          npm install --no-save --package-lock=false playwright@1.55.1\n'

          for path in workflows:
              p = Path(path)
              source = p.read_text()
              count = source.count(needle)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one dynamic install, found {count}')
              p.write_text(source.replace(needle, ''))
          PY

      - name: Verify bounded invariant
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/playwright-patched-baseline-security-contract.test.mjs

      - name: Commit workflow-only delta
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            .github/workflows/a-track-p0-validation.yml \
            .github/workflows/design-fidelity-validation.yml \
            .github/workflows/lineage52-phase2-native-browser-qa.yml \
            .github/workflows/lineage60-v12-native-browser-qa.yml \
            .github/workflows/living-media-sphere-v3-hold-browser-qa.yml \
            .github/workflows/source-track18-v2-browser-qa.yml \
            .github/workflows/source-track47-v425-browser-qa.yml \
            .github/workflows/source-track68-v332-browser-qa.yml \
            .github/workflows/track62-v11-continuous-exhibition-qa.yml \
            .github/workflows/track66-native-browser-qa.yml \
            .github/workflows/track67-native-browser-qa.yml
          git diff --cached --quiet && exit 0
          git commit -m "ci(455): use root Playwright package in browser workflows"
          git push origin HEAD:ci/455-root-playwright-pin
