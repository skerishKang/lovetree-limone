name: Track68 V3 hold browser QA evidence

# Evidence-only workflow for PR #240 (Source Track 68 Living Media Sphere V3
# Phase 1 source runner). It runs the dedicated browser QA helper
# `tests/source-track-68-browser-qa.mjs` in its `hold` phase (intentionally
# OUTSIDE the standard `tests/*.test.mjs` corpus so the shared A-track
# fail-closed browser inventory is NOT affected) and uploads the bounded
# screenshots as a GitHub artifact for Web CTO review.
#
# The 178 exact media assets (89 videos + 89 posters, 1.95 GB) are NOT
# provisioned here (LOCAL_EXACT_OUT_OF_GIT_ONLY). The `hold` phase therefore
# runs the truthful missing-media state: source-side media requests 404 and
# are classified as EXPECTED transport evidence, never as exact-media
# fidelity. No backend/DB/Auth/Production mutation; no #191/#233 changes.

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  track68-hold-browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare Playwright runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run Track68 V3 hold browser QA
        shell: bash
        run: |
          set -euo pipefail
          npm start > /tmp/track68-hold-browser-qa-server.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in {1..90}; do
            if curl --fail --silent --show-error "http://127.0.0.1:3000/design-lab/source-tracks/68/v3/source" > /dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/track68-hold-browser-qa-server.log
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/track68-hold-browser-qa-server.log
            exit 1
          fi

          mkdir -p /tmp/track68-browser-qa
          TRACK68_BASE_URL="http://127.0.0.1:3000" \
            TRACK68_SCREENSHOT_DIR="/tmp/track68-browser-qa" \
            node --import tsx tests/source-track-68-browser-qa.mjs hold

      - name: Upload hold-phase screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: track68-v3-hold-browser-qa
          path: |
            /tmp/track68-browser-qa/*.png
          retention-days: 14

