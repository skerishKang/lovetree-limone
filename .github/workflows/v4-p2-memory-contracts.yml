name: V4 P2 memory contracts

on:
  push:
    branches:
      - feat/v4-p2-memory-contracts-20260809

permissions:
  contents: write

jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout P2 branch
        uses: actions/checkout@v4
        with:
          ref: feat/v4-p2-memory-contracts-20260809
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply guarded atomic-create patch
        run: node scripts/apply-v4-p2-memory-contracts.mjs

      - name: Install exact dependencies
        run: npm ci

      - name: Generate additive Drizzle migration
        run: npm run db:generate

      - name: Commit generated server and migration changes
        shell: bash
        run: |
          if git diff --quiet -- server/api/trees.ts drizzle; then
            echo "P2 server patch and migration already synchronized"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add server/api/trees.ts drizzle
            git commit -m "feat(v4): generate P2 memory contract migration"
            git push origin HEAD:feat/v4-p2-memory-contracts-20260809
          fi

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Database schema check
        run: npm run db:check
