name: Source Track14 Auto-expanding Mindmap PATH donor browser QA

on:
  pull_request:
    branches:
      - main
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.ts'
      - 'vite.config.ts'
      - 'postcss.config.mjs'
      - 'tsconfig.json'
      - 'app/layout.tsx'
      - 'app/globals.css'
      - 'app/trees/**/graph/mindmap/**'
      - 'lib/source-track-14/**'
      - 'lib/moment-model.ts'
      - 'lib/use-tree-moments.ts'
      - 'lib/tree-types.ts'
      - 'reference/source-tracks-snapshot/14_자동전개마인드맵_템플릿컴포저/**'
      - 'design-intake/source-track-14-auto-expanding-mindmap-v2-4-donor.json'
      - 'tests/source-track-14-auto-expanding-mindmap-contract.test.mjs'
      - 'qa/source-track-14-auto-expanding-mindmap-browser-qa.mjs'
      - '.github/workflows/source-track14-auto-expanding-mindmap-browser-qa.yml'
      - 'drizzle.config.ts'
      - 'db/**'
      - 'drizzle/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-track14-auto-expanding-mindmap-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Track14 focused source and canonical PATH contract
        run: node --import tsx --test tests/source-track-14-auto-expanding-mindmap-contract.test.mjs

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Database schema check
        run: npm run db:check

      - name: Build
        run: npm run build

      - name: Prepare Playwright runtime
        run: npx playwright install --with-deps chromium

      - name: Run Track14 source-native browser and visual fidelity QA
        shell: bash
        run: |
          set -euo pipefail
          npm start > /tmp/track14-browser-qa-server.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in {1..90}; do
            if curl --fail --silent --show-error "http://127.0.0.1:3000/v4" > /dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/track14-browser-qa-server.log
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/track14-browser-qa-server.log
            exit 1
          fi

          mkdir -p /tmp/track14-visual-qa
          V4_BASE_URL="http://127.0.0.1:3000" \
            TRACK14_EVIDENCE_DIR="/tmp/track14-visual-qa" \
            node qa/source-track-14-auto-expanding-mindmap-browser-qa.mjs

      - name: Upload Track14 source-native visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-track14-auto-expanding-mindmap-visual-evidence
          path: /tmp/track14-visual-qa/*
          if-no-files-found: warn
