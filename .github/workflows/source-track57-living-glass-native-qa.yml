name: Source57 Living Glass native QA

on:
  pull_request:
    paths:
      - 'app/design-lab/source-tracks/57/v1-3-native/**'
      - 'app/components/moment-presentation/LivingGlassMoment*.tsx'
      - 'app/styles/source-track-57-living-glass.css'
      - 'lib/source-track-57-living-glass.ts'
      - 'public/reference/source-track-57-living-glass/**'
      - 'tests/source-track-57-living-glass-native.test.mjs'
      - 'qa/source-track-57-living-glass-browser-qa.mjs'
      - '.github/workflows/source-track57-living-glass-native-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source57-living-glass-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify exact checked-out head
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha }}"
          echo "SOURCE57_EXACT_HEAD=$actual"
          test "$actual" = "$expected"

      - name: Focused Source57 native contract
        run: node --test tests/source-track-57-living-glass-native.test.mjs

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Prepare Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start Native application server
        shell: bash
        run: |
          set -euo pipefail
          source scripts/ci/a-track-server-lifecycle.sh
          atrack_start_server_group \
            /tmp/source57-native-server.log \
            /tmp/source57-native-server.pid \
            http://127.0.0.1:3000/design-lab/source-tracks/57/v1-3-native

      - name: Run Source57 native Chromium smoke
        env:
          SOURCE57_NATIVE_QA_URL: http://127.0.0.1:3000
        run: node qa/source-track-57-living-glass-browser-qa.mjs

      - name: Stop Native application server
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          source scripts/ci/a-track-server-lifecycle.sh
          atrack_stop_server_group /tmp/source57-native-server.pid

      - name: Surface Native server diagnostics
        if: failure()
        shell: bash
        run: |
          if [ -f /tmp/source57-native-server.log ]; then
            tail -n 160 /tmp/source57-native-server.log
          fi

      - name: Upload Source57 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source57-living-glass-native-browser-qa
          path: qa-artifacts/source-track57-living-glass/
          if-no-files-found: warn
