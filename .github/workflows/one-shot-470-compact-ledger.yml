name: One-shot #470 compact reconciled ledger

on:
  push:
    branches:
      - design/470-ledger-provenance-reconciliation

permissions:
  contents: write

jobs:
  compact:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/470-ledger-provenance-reconciliation
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore compact master-row formatting
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'design-intake/master-design-coverage.json';
          const ledger = JSON.parse(fs.readFileSync(path, 'utf8'));
          const { rows, ...meta } = ledger;
          let output = JSON.stringify({ ...meta, rows: [] }, null, 2);
          const marker = '  "rows": []\n}';
          if (!output.includes(marker)) throw new Error('rows marker not found');
          const compactRows = rows.map((row) => `    ${JSON.stringify(row)}`).join(',\n');
          output = output.replace(marker, `  "rows": [\n${compactRows}\n  ]\n}`) + '\n';
          fs.writeFileSync(path, output);
          NODE

      - name: Validate focused contract
        run: node --test tests/master-design-coverage-contract.test.mjs

      - name: Commit compact formatting
        run: |
          rm .github/workflows/one-shot-470-compact-ledger.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add design-intake/master-design-coverage.json .github/workflows/one-shot-470-compact-ledger.yml
          git commit -m "style(470): keep master ledger rows reviewable"
          git push origin HEAD:design/470-ledger-provenance-reconciliation
