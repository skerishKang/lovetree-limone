name: SRC 108 Reimplementation Harness Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - '.github/workflows/src-108-harness-gate.yml'

permissions:
  contents: read

jobs:
  validate:
    name: SRC 108 Harness Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify exact-head binding
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha }}'
          actual="$(git rev-parse HEAD)"
          echo "EXPECTED_HEAD=$expected"
          echo "ACTUAL_HEAD=$actual"
          test "$actual" = "$expected"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate clean 108-corpus generation root
        run: node src/08_harness/validate-layout.mjs

      - name: Validate generation phase boundaries
        run: node src/08_harness/generation-phase-guard.mjs

      - name: Validate materialized mechanical split
        run: node src/08_harness/validate-mechanical-split.mjs

      - name: Generate mechanical split candidate from frozen original
        id: split_candidate
        shell: bash
        env:
          SRC_SPLIT_CANDIDATE_DIR: /tmp/src-mechanical-split-candidate
        run: |
          set -euo pipefail
          rm -rf "$SRC_SPLIT_CANDIDATE_DIR"
          node src/08_harness/materialize-mechanical-split.mjs | tee /tmp/src-mechanical-split-candidate.log
          if find "$SRC_SPLIT_CANDIDATE_DIR" -type f -name candidate-manifest.json -print -quit 2>/dev/null | grep -q .; then
            echo 'generated=true' >> "$GITHUB_OUTPUT"
          else
            echo 'generated=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Upload mechanical split candidate
        if: steps.split_candidate.outputs.generated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: src-mechanical-split-candidate-${{ github.event.pull_request.head.sha }}
          path: /tmp/src-mechanical-split-candidate/**
          if-no-files-found: error
          retention-days: 14

      - name: Read generation phase
        id: generation
        shell: bash
        run: |
          set -euo pipefail
          phase="$(node -p "JSON.parse(require('fs').readFileSync('src/01_registry/generation-state.json','utf8')).phase")"
          echo "phase=$phase" >> "$GITHUB_OUTPUT"
          echo "GENERATION_PHASE=$phase"

      - name: Install dependencies for Source browser evidence
        if: contains(fromJSON('["CALIBRATION", "ROLLOUT"]'), steps.generation.outputs.phase)
        run: npm ci

      - name: Install Korean font for visual evidence
        if: contains(fromJSON('["CALIBRATION", "ROLLOUT"]'), steps.generation.outputs.phase)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f
          fc-match 'Noto Sans CJK KR'

      - name: Cache Playwright Chromium
        if: contains(fromJSON('["CALIBRATION", "ROLLOUT"]'), steps.generation.outputs.phase)
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-src108-playwright-1.55.1-chromium

      - name: Prepare Chromium
        if: contains(fromJSON('["CALIBRATION", "ROLLOUT"]'), steps.generation.outputs.phase)
        run: npx playwright install chromium

      - name: Install and verify branded Google Chrome
        if: contains(fromJSON('["CALIBRATION", "ROLLOUT"]'), steps.generation.outputs.phase)
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v google-chrome >/dev/null 2>&1 && ! command -v google-chrome-stable >/dev/null 2>&1; then
            echo "Branded Google Chrome not found; installing..."
            wget -q -O /tmp/google-chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get update -qq
            sudo apt-get install -y -qq /tmp/google-chrome.deb
          fi
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable)"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          CHROME_VERSION="$("$CHROME_BIN" --version)"
          echo "GOOGLE_CHROME_VERSION=$CHROME_VERSION"
          test -n "$CHROME_VERSION"

      - name: Prove SRC056 approved-recipe matched replay
        if: contains(fromJSON('["CALIBRATION", "ROLLOUT"]'), steps.generation.outputs.phase)
        shell: bash
        env:
          SRC_EXACT_HEAD: ${{ github.event.pull_request.head.sha }}
          SRC_BROWSER_CHANNEL: chrome
        run: |
          set -euo pipefail
          rm -f /tmp/src056-approved-recipe-matched-replay.log
          node src/08_harness/prove-src056-approved-recipe-parity.mjs | tee /tmp/src056-approved-recipe-matched-replay.log
          grep -q "SRC056_APPROVED_RECIPE_MATCHED_REPLAY_PASS=${{ github.event.pull_request.head.sha }}" /tmp/src056-approved-recipe-matched-replay.log

      - name: Upload SRC056 approved-recipe matched replay proof
        if: always() && contains(fromJSON('["CALIBRATION", "ROLLOUT"]'), steps.generation.outputs.phase)
        uses: actions/upload-artifact@v4
        with:
          name: src056-approved-recipe-matched-replay-${{ github.event.pull_request.head.sha }}
          path: /tmp/src056-approved-recipe-matched-replay.log
          if-no-files-found: error
          retention-days: 14

      - name: Prove SRC060 COMPLEX approved-recipe matched replay
        if: contains(fromJSON('["CALIBRATION", "ROLLOUT"]'), steps.generation.outputs.phase)
        shell: bash
        env:
          SRC_EXACT_HEAD: ${{ github.event.pull_request.head.sha }}
          SRC_BROWSER_CHANNEL: chrome
        run: |
          set -euo pipefail
          rm -f /tmp/src060-approved-recipe-complex-replay.log
          node src/08_harness/prove-src060-approved-recipe-parity.mjs | tee /tmp/src060-approved-recipe-complex-replay.log
          grep -q "SRC060_APPROVED_RECIPE_COMPLEX_REPLAY_PASS=${{ github.event.pull_request.head.sha }}" /tmp/src060-approved-recipe-complex-replay.log

      - name: Upload SRC060 COMPLEX approved-recipe replay proof
        if: always() && contains(fromJSON('["CALIBRATION", "ROLLOUT"]'), steps.generation.outputs.phase)
        uses: actions/upload-artifact@v4
        with:
          name: src060-approved-recipe-complex-replay-${{ github.event.pull_request.head.sha }}
          path: /tmp/src060-approved-recipe-complex-replay.log
          if-no-files-found: error
          retention-days: 14

      - name: Capture frozen Source baseline
        if: contains(fromJSON('["CALIBRATION", "ROLLOUT"]'), steps.generation.outputs.phase)
        env:
          SRC_BASELINE_EVIDENCE_DIR: /tmp/src-baseline-evidence
          SRC_EXACT_HEAD: ${{ github.event.pull_request.head.sha }}
          SRC_BROWSER_CHANNEL: chrome
        run: node src/08_harness/capture-source-baseline.mjs

      - name: Upload Source baseline evidence
        if: always() && contains(fromJSON('["CALIBRATION", "ROLLOUT"]'), steps.generation.outputs.phase)
        uses: actions/upload-artifact@v4
        with:
          name: src-calibration-baseline-${{ github.event.pull_request.head.sha }}
          path: /tmp/src-baseline-evidence/**
          if-no-files-found: error
          retention-days: 14

      - name: Capture original-to-split parity evidence
        if: contains(fromJSON('["CALIBRATION", "ROLLOUT"]'), steps.generation.outputs.phase)
        id: parity_capture
        shell: bash
        env:
          SRC_PARITY_EVIDENCE_DIR: /tmp/src-split-parity-evidence
          SRC_EXACT_HEAD: ${{ github.event.pull_request.head.sha }}
          SRC_BROWSER_CHANNEL: chrome
        run: |
          set -euo pipefail
          rm -rf "$SRC_PARITY_EVIDENCE_DIR"
          node src/08_harness/capture-source-parity.mjs | tee /tmp/src-split-parity.log
          if find "$SRC_PARITY_EVIDENCE_DIR" -type f -name summary.json -print -quit 2>/dev/null | grep -q .; then
            echo 'generated=true' >> "$GITHUB_OUTPUT"
          else
            echo 'generated=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Upload original-to-split parity evidence
        if: always() && steps.parity_capture.outputs.generated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: src-split-parity-${{ github.event.pull_request.head.sha }}
          path: /tmp/src-split-parity-evidence/**
          if-no-files-found: error
          retention-days: 14
