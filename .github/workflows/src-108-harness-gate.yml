name: SRC 108 Reimplementation Harness Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - '.github/workflows/src-108-harness-gate.yml'

permissions:
  contents: write

jobs:
  validate:
    name: SRC 108 Harness Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify exact-head binding
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha }}'
          actual="$(git rev-parse HEAD)"
          echo "EXPECTED_HEAD=$expected"
          echo "ACTUAL_HEAD=$actual"
          test "$actual" = "$expected"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate clean 108-corpus generation root
        run: node src/08_harness/validate-layout.mjs

      - name: Generate mechanical split candidate from frozen original
        id: split_candidate
        shell: bash
        env:
          SRC_SPLIT_CANDIDATE_DIR: /tmp/src-mechanical-split-candidate
        run: |
          set -euo pipefail
          rm -rf "$SRC_SPLIT_CANDIDATE_DIR"
          node src/08_harness/materialize-mechanical-split.mjs | tee /tmp/src-mechanical-split-candidate.log
          if find "$SRC_SPLIT_CANDIDATE_DIR" -type f -name candidate-manifest.json -print -quit 2>/dev/null | grep -q .; then
            echo 'generated=true' >> "$GITHUB_OUTPUT"
          else
            echo 'generated=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Stage mechanical split candidate as unreferenced Git blobs
        if: steps.split_candidate.outputs.generated == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          SRC_EXACT_HEAD: ${{ github.event.pull_request.head.sha }}
          SRC_SPLIT_CANDIDATE_DIR: /tmp/src-mechanical-split-candidate
        run: |
          set -euo pipefail
          out="$SRC_SPLIT_CANDIDATE_DIR/remote-blobs.json"
          jq -n --arg head "$SRC_EXACT_HEAD" '{schema_version:"1.0", exact_head:$head, blobs:{}}' > "$out"
          while IFS= read -r candidate; do
            source_id="$(basename "$(dirname "$candidate")")"
            for name in index.html styles.css script.js; do
              file="$SRC_SPLIT_CANDIDATE_DIR/$source_id/split/$name"
              test -f "$file"
              encoded="$(base64 -w0 "$file")"
              payload="$(jq -n --arg content "$encoded" '{content:$content,encoding:"base64"}')"
              response="$(curl -fsS -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "https://api.github.com/repos/$GH_REPOSITORY/git/blobs" \
                -d "$payload")"
              sha="$(jq -r '.sha // empty' <<<"$response")"
              test -n "$sha"
              key="$source_id/split/$name"
              jq --arg key "$key" --arg sha "$sha" '.blobs[$key]=$sha' "$out" > "$out.tmp"
              mv "$out.tmp" "$out"
            done
          done < <(find "$SRC_SPLIT_CANDIDATE_DIR" -mindepth 2 -maxdepth 2 -type f -name candidate-manifest.json | sort)
          cat "$out"

      - name: Upload mechanical split candidate
        if: steps.split_candidate.outputs.generated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: src-mechanical-split-candidate-${{ github.event.pull_request.head.sha }}
          path: /tmp/src-mechanical-split-candidate/**
          if-no-files-found: error
          retention-days: 14

      - name: Read generation phase
        id: generation
        shell: bash
        run: |
          set -euo pipefail
          phase="$(node -p "JSON.parse(require('fs').readFileSync('src/01_registry/generation-state.json','utf8')).phase")"
          echo "phase=$phase" >> "$GITHUB_OUTPUT"
          echo "GENERATION_PHASE=$phase"

      - name: Install dependencies for calibration browser evidence
        if: steps.generation.outputs.phase == 'CALIBRATION'
        run: npm ci

      - name: Install Korean font for visual evidence
        if: steps.generation.outputs.phase == 'CALIBRATION'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f
          fc-match 'Noto Sans CJK KR'

      - name: Cache Playwright Chromium
        if: steps.generation.outputs.phase == 'CALIBRATION'
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-src108-playwright-1.55.1-chromium

      - name: Prepare Chromium
        if: steps.generation.outputs.phase == 'CALIBRATION'
        run: npx playwright install chromium

      - name: Capture frozen Source baseline
        if: steps.generation.outputs.phase == 'CALIBRATION'
        env:
          SRC_BASELINE_EVIDENCE_DIR: /tmp/src-baseline-evidence
          SRC_EXACT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node src/08_harness/capture-source-baseline.mjs

      - name: Upload Source baseline evidence
        if: always() && steps.generation.outputs.phase == 'CALIBRATION'
        uses: actions/upload-artifact@v4
        with:
          name: src-calibration-baseline-${{ github.event.pull_request.head.sha }}
          path: /tmp/src-baseline-evidence/**
          if-no-files-found: error
          retention-days: 14

      - name: Capture original-to-split parity evidence
        if: steps.generation.outputs.phase == 'CALIBRATION'
        id: parity_capture
        shell: bash
        env:
          SRC_PARITY_EVIDENCE_DIR: /tmp/src-split-parity-evidence
          SRC_EXACT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          rm -rf "$SRC_PARITY_EVIDENCE_DIR"
          node src/08_harness/capture-source-parity.mjs | tee /tmp/src-split-parity.log
          if find "$SRC_PARITY_EVIDENCE_DIR" -type f -name summary.json -print -quit 2>/dev/null | grep -q .; then
            echo 'generated=true' >> "$GITHUB_OUTPUT"
          else
            echo 'generated=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Upload original-to-split parity evidence
        if: always() && steps.parity_capture.outputs.generated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: src-split-parity-${{ github.event.pull_request.head.sha }}
          path: /tmp/src-split-parity-evidence/**
          if-no-files-found: error
          retention-days: 14
