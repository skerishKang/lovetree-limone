name: Track67 V2.4.2 native browser QA evidence

# Evidence-only workflow for PR #239 (Track67 V2.4.2 persistent-world +
# WORKS navigation native candidate). It runs the dedicated native QA helper
# `qa/track67-native-browser-qa.mjs` (intentionally OUTSIDE the standard
# `tests/*.test.mjs` corpus so the shared A-track fail-closed browser inventory
# is NOT affected) and uploads qa-results.json as a GitHub artifact so the Web
# CTO can review it directly. It does NOT modify backend/API/DB/Auth, nor PR
# #191 / #233 / canonical /v4. Pure additive QA evidence gate.

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  track67-native-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare Playwright runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium

      - name: Run Track67 V2.4.2 native browser QA
        shell: bash
        run: |
          set -euo pipefail
          npm start > /tmp/track67-native-qa-server.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in {1..90}; do
            if curl --fail --silent --show-error "http://127.0.0.1:3000/design-lab/lineages/67/v2-4/native" > /dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/track67-native-qa-server.log
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/track67-native-qa-server.log
            exit 1
          fi

          mkdir -p qa-artifacts/track67-native
          TRACK67_QA_URL="http://127.0.0.1:3000" \
            node qa/track67-native-browser-qa.mjs

      - name: Upload Track67 native QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: track67-v242-native-qa-evidence
          path: |
            qa-artifacts/track67-native/qa-results.json
          if-no-files-found: warn
