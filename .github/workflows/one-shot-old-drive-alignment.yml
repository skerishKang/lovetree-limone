name: One-shot OLD Drive alignment

on:
  push:
    branches:
      - refactor/old-drive-alignment-v1

permissions:
  contents: write

jobs:
  align-old-drive-layout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror already-approved Drive moves
        shell: bash
        run: |
          set -euo pipefail

          move_if_present() {
            src="$1"
            dst="$2"
            if [ -e "$src" ]; then
              mkdir -p "$(dirname "$dst")"
              if [ -e "$dst" ]; then
                echo "destination already exists: $dst" >&2
                exit 1
              fi
              git mv "$src" "$dst"
              echo "$src -> $dst"
            fi
          }

          move_if_present "components" "old/components"
          move_if_present "ops" "old/ops"
          move_if_present "reference" "old/reference"
          move_if_present "assets" "old/assets"

          for p in \
            "evidence-l61-visual" \
            "evidence-pr139" \
            "evidence-l57-visual" \
            "evidence-l58-visual" \
            "screenshots"
          do
            move_if_present "$p" "old/workspace-archive/legacy-audit-bundles/$p"
          done

          for p in \
            "GENRESET_PREFLIGHT_REPORT.md" \
            "TRACK47_V425_ADOPTION_REPORT.md" \
            "LOCAL2_246_FOUR_BLOCKER_CORRECTION_REPORT.md"
          do
            move_if_present "$p" "old/workspace-archive/reports-and-outputs/$p"
          done

          move_if_present "[샘플]" "old/workspace-archive/preserved-local-history/[샘플]"
          move_if_present "examples" "old/workspace-archive/preserved-local-history/examples"
          move_if_present "video-frames" "old/workspace-archive/preserved-local-history/video-frames"

          for p in \
            "tree-visual-v2.html" \
            "tree-import.html" \
            "step3.html" \
            "step2.html" \
            "relovetree-record.html" \
            "relovetree-canvas.html" \
            "preview.html" \
            "mindmap.html" \
            "mindmap-v2.html" \
            "mindmap-final.html" \
            "lovetree-diary-flow-v1.html" \
            "lovetree-community-discovery-v1.html" \
            "dashboard.html"
          do
            move_if_present "$p" "old/workspace-archive/preserved-local-history/legacy-root-prototypes/$p"
          done

          git diff --check
          test -n "$(git status --porcelain)"

      - name: Commit mechanical OLD layout alignment
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(old): align archived legacy paths with Drive layout"
          git push origin HEAD:refactor/old-drive-alignment-v1
