name: Five-source visual repair preview

on:
  push:
    branches:
      - preview/five-source-rc-20260827
    paths:
      - '.github/workflows/five-source-visual-repair-preview.yml'
      - 'app/trees/**'
      - 'app/components/moment-presentation/**'
      - 'components/source-track-58/**'
      - 'lib/api.ts'
      - 'lib/source-track-57-living-glass.ts'

permissions:
  contents: read

concurrency:
  group: lovetree-five-source-visual-repair-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: relovetree
      PREVIEW_WORKER: lovetree-limone-five-source-preview
      PREVIEW_BASE_URL: https://lovetree-limone-five-source-preview.charliekant.workers.dev
      PREVIEW_ENTRY_URL: https://lovetree-limone-five-source-preview.charliekant.workers.dev/trees/five-source-preview
    steps:
      - name: Checkout visual repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify isolated branch and worker
        shell: bash
        run: |
          set -euo pipefail
          [ "$GITHUB_REF_NAME" = 'preview/five-source-rc-20260827' ]
          [ "$PREVIEW_WORKER" = 'lovetree-limone-five-source-preview' ]

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fail closed on missing preview configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DATABASE_URL NEXT_PUBLIC_FIREBASE_API_KEY NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN; do
            [ -n "${!name:-}" ] || { echo "BLOCKED: missing $name" >&2; exit 1; }
          done

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Guarded isolated preview deploy
        run: |
          npm run preview:deploy:safe -- \
            --worker "$PREVIEW_WORKER" \
            --confirm-worker "$PREVIEW_WORKER" \
            --source-sha "$(git rev-parse HEAD)" \
            --execute

      - name: Generate safe preview config
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .preview-safe-config
          node --input-type=module <<'NODE'
          import path from 'node:path';
          import { buildSafePreviewConfig } from './scripts/lib/isolated-preview-deploy-guard.mjs';
          await buildSafePreviewConfig({ repoRoot: process.cwd(), workerName: process.env.PREVIEW_WORKER, outputDir: path.join(process.cwd(), '.preview-safe-config') });
          NODE

      - name: Attach read-only preview database secret
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$DATABASE_URL" | npx wrangler secret put DATABASE_URL --config .preview-safe-config/wrangler-isolated-preview.json

      - name: Smoke repaired preview
        shell: bash
        run: |
          set -euo pipefail
          for route in \
            /trees/five-source-preview \
            /trees/five-source-preview/board \
            /trees/five-source-preview/relationships \
            /trees/five-source-preview/explore \
            /trees/five-source-preview/portal; do
            code='000'
            for attempt in {1..30}; do
              code="$(curl --location --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 "${PREVIEW_BASE_URL}${route}")"
              [ "$code" = '200' ] && break
              sleep 2
            done
            printf '%s -> HTTP %s\n' "$route" "$code"
            [ "$code" = '200' ] || exit 1
          done

      - name: Prepare live Chromium
        run: npx playwright install --with-deps chromium

      - name: Live dense-fixture five-view click QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preview-live-qa
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { chromium } from 'playwright';

          const base = process.env.PREVIEW_BASE_URL.replace(/\/$/, '');
          const treeId = 'five-source-preview';
          const selectedId = 'm-f1';
          const selectedTitle = '처음 빠져든 순간';
          const out = 'preview-live-qa';
          const browser = await chromium.launch({ headless: true });
          const proof = { head: process.env.GITHUB_SHA, treeId, selectedId, viewports: [] };

          async function waitForSource(page, source) {
            await page.locator(`[data-mvp-source="${source}"]`).first().waitFor({ state: 'visible', timeout: 20000 });
          }

          async function assertMoment(page, expected, label) {
            const current = new URL(page.url());
            assert.equal(current.searchParams.get('moment'), expected, `${label}: moment query mismatch`);
            assert.match(current.pathname, new RegExp(`^/trees/${treeId}(?:/|$)`), `${label}: tree identity changed`);
          }

          async function assertNoHorizontalOverflow(page, label) {
            const metrics = await page.evaluate(() => ({
              viewport: window.innerWidth,
              body: document.body.scrollWidth,
              root: document.documentElement.scrollWidth,
            }));
            assert.ok(metrics.body <= metrics.viewport, `${label}: body overflow ${metrics.body} > ${metrics.viewport}`);
            assert.ok(metrics.root <= metrics.viewport, `${label}: root overflow ${metrics.root} > ${metrics.viewport}`);
          }

          async function clickView(page, name, source, momentId, prefix, records) {
            const nav = page.getByRole('navigation', { name: '보기 전환' });
            const link = nav.getByRole('link', { name, exact: true });
            const href = await link.getAttribute('href');
            assert.ok(href?.includes(`/trees/${treeId}`), `${prefix}: tree missing from href`);
            assert.ok(href?.includes(`moment=${encodeURIComponent(momentId)}`), `${prefix}: moment missing from href`);
            await link.click();
            await waitForSource(page, source);
            await assertMoment(page, momentId, prefix);
            await assertNoHorizontalOverflow(page, prefix);
            await page.screenshot({ path: `${out}/${prefix}.png`, fullPage: false });
            records.push({ name, source, url: page.url() });
          }

          async function auditViewport({ name, width, height, reducedMotion = false }) {
            const context = await browser.newContext({
              viewport: { width, height },
              hasTouch: width <= 390,
              isMobile: width <= 390,
            });
            const page = await context.newPage();
            if (reducedMotion) await page.emulateMedia({ reducedMotion: 'reduce' });
            const records = [];

            const response = await page.goto(`${base}/trees/${treeId}`, { waitUntil: 'domcontentloaded', timeout: 30000 });
            assert.ok(response?.ok(), `${name}: entry route must be 2xx`);
            await waitForSource(page, '57');
            await assertMoment(page, null, `${name}-57`);
            await assertNoHorizontalOverflow(page, `${name}-57`);
            records.push({ name: '기억', source: '57', url: page.url() });

            await page.getByRole('navigation', { name: '보기 전환' }).getByRole('link', { name: '보드', exact: true }).click();
            await waitForSource(page, '58');
            await page.waitForURL((url) => url.searchParams.get('moment') === 'm-root', { timeout: 15000 });
            await assertMoment(page, 'm-root', `${name}-58-default`);

            const childCard = page.getByRole('button', { name: `${selectedTitle} 선택`, exact: true });
            await childCard.waitFor({ state: 'visible', timeout: 15000 });
            await childCard.click();
            await page.waitForURL((url) => url.searchParams.get('moment') === selectedId, { timeout: 15000 });
            await assertMoment(page, selectedId, `${name}-58-selected`);
            await assertNoHorizontalOverflow(page, `${name}-58-selected`);
            await page.screenshot({ path: `${out}/${name}-58-selected.png`, fullPage: false });
            records.push({ name: '보드', source: '58', url: page.url() });

            await page.goBack({ waitUntil: 'domcontentloaded' });
            await waitForSource(page, '57');
            await assertMoment(page, null, `${name}-57-back`);
            await page.goForward({ waitUntil: 'domcontentloaded' });
            await waitForSource(page, '58');
            await assertMoment(page, selectedId, `${name}-58-forward`);

            await clickView(page, '관계', '56', selectedId, `${name}-56`, records);
            assert.equal(await page.locator(`[data-network-moment-id="${selectedId}"]`).getAttribute('aria-pressed'), 'true', `${name}: Source56 selected node mismatch`);

            await clickView(page, '탐색', '60', selectedId, `${name}-60`, records);
            assert.ok(await page.locator('canvas').count(), `${name}: Source60 canvas missing`);
            assert.ok(await page.locator('[data-testid="source60-native-product-explorer"]').count(), `${name}: Source60 native explorer missing`);

            await clickView(page, '포털', '64', selectedId, `${name}-64`, records);
            assert.ok(await page.locator('[data-rendering="css3d-dom"]').count(), `${name}: Source64 CSS3D rendering missing`);

            await page.goBack({ waitUntil: 'domcontentloaded' });
            await waitForSource(page, '60');
            await assertMoment(page, selectedId, `${name}-60-back-from-portal`);
            records.push({ name: '뒤로→탐색', source: '60', url: page.url() });

            proof.viewports.push({ name, width, height, reducedMotion, records });
            await context.close();
          }

          try {
            await auditViewport({ name: 'desktop-1280x800', width: 1280, height: 800 });
            await auditViewport({ name: 'phone-390x844', width: 390, height: 844 });
            await auditViewport({ name: 'narrow-320x720-reduced', width: 320, height: 720, reducedMotion: true });
            fs.writeFileSync(`${out}/result.json`, JSON.stringify(proof, null, 2));
            console.log(JSON.stringify(proof, null, 2));
            console.log('LIVE_DENSE_FIVE_SOURCE_PREVIEW_QA_PASS');
          } finally {
            await browser.close();
          }
          NODE

      - name: Upload live click evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: five-source-dense-live-qa
          path: preview-live-qa
          if-no-files-found: error
          retention-days: 14
