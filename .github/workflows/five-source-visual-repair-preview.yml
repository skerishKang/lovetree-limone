name: Five-source visual repair preview

on:
  push:
    branches:
      - preview/five-source-rc-20260827
    paths:
      - '.github/workflows/five-source-visual-repair-preview.yml'
      - 'app/trees/**'
      - 'app/components/moment-presentation/**'
      - 'components/source-track-58/**'
      - 'lib/api.ts'
      - 'lib/source-track-57-living-glass.ts'

permissions:
  contents: read

concurrency:
  group: lovetree-five-source-visual-repair-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: relovetree
      PREVIEW_WORKER: lovetree-limone-five-source-preview
      PREVIEW_ENTRY_URL: https://lovetree-limone-five-source-preview.charliekant.workers.dev/trees/five-source-preview
    steps:
      - name: Checkout visual repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify isolated branch and worker
        shell: bash
        run: |
          set -euo pipefail
          [ "$GITHUB_REF_NAME" = 'preview/five-source-rc-20260827' ]
          [ "$PREVIEW_WORKER" = 'lovetree-limone-five-source-preview' ]

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fail closed on missing preview configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DATABASE_URL NEXT_PUBLIC_FIREBASE_API_KEY NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN; do
            [ -n "${!name:-}" ] || { echo "BLOCKED: missing $name" >&2; exit 1; }
          done

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Guarded isolated preview deploy
        run: |
          npm run preview:deploy:safe -- \
            --worker "$PREVIEW_WORKER" \
            --confirm-worker "$PREVIEW_WORKER" \
            --source-sha "$(git rev-parse HEAD)" \
            --execute

      - name: Generate safe preview config
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .preview-safe-config
          node --input-type=module <<'NODE'
          import path from 'node:path';
          import { buildSafePreviewConfig } from './scripts/lib/isolated-preview-deploy-guard.mjs';
          await buildSafePreviewConfig({ repoRoot: process.cwd(), workerName: process.env.PREVIEW_WORKER, outputDir: path.join(process.cwd(), '.preview-safe-config') });
          NODE

      - name: Attach read-only preview database secret
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$DATABASE_URL" | npx wrangler secret put DATABASE_URL --config .preview-safe-config/wrangler-isolated-preview.json

      - name: Smoke repaired preview
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            code="$(curl --location --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 "$PREVIEW_ENTRY_URL")"
            [ "$code" = '200' ] && exit 0
            sleep 2
          done
          echo 'BLOCKED: repaired preview did not reach HTTP 200' >&2
          exit 1
