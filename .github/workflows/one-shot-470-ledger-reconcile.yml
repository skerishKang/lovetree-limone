name: One-shot #470 ledger reconciliation

on:
  push:
    branches:
      - design/470-ledger-provenance-reconciliation

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/470-ledger-provenance-reconciliation
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reconcile audited ledger rows and contract
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const ledgerPath = 'design-intake/master-design-coverage.json';
          const testPath = 'tests/master-design-coverage-contract.test.mjs';
          const ledger = JSON.parse(fs.readFileSync(ledgerPath, 'utf8'));

          ledger.schema_version = 2;
          ledger.repository_baseline = '3158f42fc7f6b4571454fdfc1e8b5ae95c92ee6c';
          ledger.reconciliation_issue = 470;
          ledger.reconciliation_audit_issue = 468;
          ledger.policy.reconciliation_axis = 'Identity/provenance disposition is independent from repository coverage maturity.';
          ledger.policy.reconciliation_vocabulary = ['PARTIAL_PROVENANCE','ALIAS_FOUND','DUPLICATE_FAMILY','SUPERSEDED','TRUE_MISSING'];
          ledger.summary.covered = 74;
          ledger.summary.partial = 32;
          ledger.summary.missing = 2;
          ledger.summary.audited_missing_rows = 24;
          ledger.summary.audited_missing_normalized_unique_families = 20;
          ledger.summary.true_missing_unique_families = 1;

          const addGuard = (value) => {
            if (!ledger.namespace_guards.includes(value)) ledger.namespace_guards.push(value);
          };
          addGuard('Drive Track17 Living Memory Terrain != historical GitHub Track17 Global Shell');
          addGuard('Drive Track18 Memory Core Electric Aurora != current Source Track18 Fragment Loader');

          for (const row of ledger.rows) {
            row.reconciliation_disposition = row.reconciliation_disposition ?? null;
            row.family_anchor_master_id = row.family_anchor_master_id ?? null;
          }

          const byId = new Map(ledger.rows.map((row) => [row.master_id, row]));
          const patch = (id, fields) => Object.assign(byId.get(id), fields);
          const snapshot = (id, path, version, semanticIdentity, extra = {}) => patch(id, {
            semantic_identity: semanticIdentity,
            github_issue: [284],
            github_pr: [287],
            reference_path: `reference/source-tracks-snapshot/${path}/`,
            manifest_path: null,
            source_runner_route: null,
            native_route: null,
            canonical_route: null,
            namespace_type: 'drive-source-snapshot',
            source_authority_version: version,
            current_main_present: true,
            coverage_state: 'PARTIAL',
            source_freshness: 'medium',
            reconciliation_disposition: 'PARTIAL_PROVENANCE',
            ...extra,
          });

          snapshot(1, '36_시네마틱메모리포털_버전통합', 'v3', 'Drive Track36 Cinematic Memory Portal');
          snapshot(2, '36_시네마틱메모리포털_버전통합', 'v3', 'Drive Track36 Cinematic Memory Portal', { reconciliation_disposition: 'DUPLICATE_FAMILY', family_anchor_master_id: 1 });
          snapshot(3, '36_시네마틱메모리포털_버전통합', 'v3', 'Drive Track36 Cinematic Memory Portal', { reconciliation_disposition: 'DUPLICATE_FAMILY', family_anchor_master_id: 1 });
          snapshot(10, '38_보이저_우주기억지도', 'current/unversioned', 'Drive Track38 Voyager Space Memory Map');

          patch(13, {
            semantic_identity: 'Codex-work-13 LoveTree Cinematic Watercolor V2',
            github_issue: null,
            github_pr: null,
            reference_path: null,
            manifest_path: null,
            source_runner_route: null,
            native_route: null,
            canonical_route: null,
            namespace_type: 'codex-drive-source',
            source_authority_version: 'V2',
            current_main_present: false,
            coverage_state: 'MISSING',
            source_freshness: 'unresolved',
            reconciliation_disposition: 'TRUE_MISSING',
            family_anchor_master_id: null,
          });
          patch(14, {
            semantic_identity: 'Codex-work-13 LoveTree Cinematic Watercolor V2',
            github_issue: null,
            github_pr: null,
            reference_path: null,
            manifest_path: null,
            source_runner_route: null,
            native_route: null,
            canonical_route: null,
            namespace_type: 'codex-drive-source',
            source_authority_version: 'V2',
            current_main_present: false,
            coverage_state: 'MISSING',
            source_freshness: 'unresolved',
            reconciliation_disposition: 'DUPLICATE_FAMILY',
            family_anchor_master_id: 13,
          });

          snapshot(30, '14_자동전개마인드맵_템플릿컴포저', 'v2.4', 'Drive Track14 Auto-expanding Mindmap');
          snapshot(32, '16_메모리토폴로지_관계망분석실', 'v1', 'Drive Track16 Memory Topology');
          snapshot(33, '22_영상기억_별자리보기', 'v3.1', 'Drive Track22 Video Memory Constellation');
          snapshot(34, '23_리빙영상기억그래프', 'v1', 'Drive Track23 Living Video Memory Graph');
          snapshot(35, '25_영상기억_로어맵', 'v1', 'Drive Track25 Video Memory Lore Map');
          snapshot(47, '09_전체기억_요약대시보드', 'current/unversioned', 'Drive Track09 Full Memory Summary Dashboard');
          snapshot(48, '10_메모리펄스_로그인홈', 'current/unversioned', 'Drive Track10 Memory Pulse Desktop', { github_issue: [284, 344] });
          snapshot(49, '17_리빙메모리지형', 'v1.2', 'Drive Track17 Living Memory Terrain');
          snapshot(50, '18_메모리코어_전기오로라', 'v1', 'Drive Track18 Memory Core Electric Aurora');
          snapshot(51, '19_메모리코어_네온', 'v2', 'Drive Track19 Memory Core Furnace Neon');
          snapshot(52, '20_리빙메모리엔진_버전통합', 'v1.1 family / older master state', 'Drive Track20 Living Memory Engine', { reconciliation_disposition: 'SUPERSEDED', superseded_by: [53] });
          snapshot(53, '20_리빙메모리엔진_버전통합', 'v1.1', 'Drive Track20 Living Memory Engine', { supersedes: [52] });
          snapshot(68, '35_LP플레이어', 'current/unversioned', 'Drive Track35 LP Player');
          snapshot(69, '37_기억달력_메모리패드', 'current/unversioned', 'Drive Track37 Memory Calendar');
          snapshot(70, '39_LP커버플로우_미디어갤러리', 'current/unversioned', 'Drive Track39 LP Cover Flow');
          snapshot(81, '24_영상기억_워크플로우', 'v1', 'Drive Track24 Video Memory Workflow');
          snapshot(82, '26_메모리필름스튜디오', 'v1', 'Drive Track26 Memory Film Studio');

          patch(107, {
            semantic_identity: 'V4 23-source integration bundle / 01_0730 source alias',
            github_issue: [30, 284],
            github_pr: [287],
            reference_path: 'reference/source-tracks-snapshot/01_0730작업물/',
            manifest_path: 'app/components/v4/v4-source-manifest.ts',
            source_runner_route: 'multiple V4 source mappings via Issue #30',
            native_route: 'multiple /v4 routes via V4 source bundle',
            canonical_route: 'multiple /v4 routes via V4 source bundle',
            namespace_type: 'v4-source-bundle',
            source_authority_version: 'mixed historical bundle / canonical V4 aliases',
            current_main_present: true,
            coverage_state: 'COVERED',
            source_freshness: 'low',
            reconciliation_disposition: 'ALIAS_FOUND',
            family_anchor_master_id: null,
          });

          const counts = ledger.rows.reduce((acc, row) => {
            acc[row.coverage_state] = (acc[row.coverage_state] || 0) + 1;
            return acc;
          }, {});
          if (counts.COVERED !== 74 || counts.PARTIAL !== 32 || counts.MISSING !== 2) {
            throw new Error(`coverage mismatch ${JSON.stringify(counts)}`);
          }

          const audited = [1,2,3,10,13,14,30,32,33,34,35,47,48,49,50,51,52,53,68,69,70,81,82,107];
          const dispositionCounts = audited.reduce((acc, id) => {
            const value = byId.get(id).reconciliation_disposition;
            acc[value] = (acc[value] || 0) + 1;
            return acc;
          }, {});
          const expected = { PARTIAL_PROVENANCE:18, ALIAS_FOUND:1, DUPLICATE_FAMILY:3, SUPERSEDED:1, TRUE_MISSING:1 };
          if (JSON.stringify(dispositionCounts) !== JSON.stringify(expected)) {
            throw new Error(`disposition mismatch ${JSON.stringify(dispositionCounts)}`);
          }

          fs.writeFileSync(ledgerPath, JSON.stringify(ledger, null, 2) + '\n');

          let test = fs.readFileSync(testPath, 'utf8');
          test = test.replace("COVERED: 73,\n  PARTIAL: 11,\n  MISSING: 24,", "COVERED: 74,\n  PARTIAL: 32,\n  MISSING: 2,");
          test = test.replace("assert.equal(ledger.schema_version, 1);", "assert.equal(ledger.schema_version, 2);");
          test = test.replace("test('coverage counts remain 73 covered / 11 partial / 24 missing'", "test('coverage counts reflect the #468 reconciliation: 74 covered / 32 partial / 2 missing'");
          test = test.replace("assert.equal(ledger.summary.covered, 73);\n  assert.equal(ledger.summary.partial, 11);\n  assert.equal(ledger.summary.missing, 24);", "assert.equal(ledger.summary.covered, 74);\n  assert.equal(ledger.summary.partial, 32);\n  assert.equal(ledger.summary.missing, 2);\n  assert.equal(ledger.summary.audited_missing_rows, 24);\n  assert.equal(ledger.summary.audited_missing_normalized_unique_families, 20);\n  assert.equal(ledger.summary.true_missing_unique_families, 1);");
          test = test.replace("  'source_freshness',\n];", "  'source_freshness',\n  'reconciliation_disposition',\n  'family_anchor_master_id',\n];");

          test += `\n\ntest('the #468 audited missing set is reconciled without conflating coverage and identity disposition', () => {\n  const auditedIds = [1,2,3,10,13,14,30,32,33,34,35,47,48,49,50,51,52,53,68,69,70,81,82,107];\n  const expectedDisposition = { PARTIAL_PROVENANCE: 18, ALIAS_FOUND: 1, DUPLICATE_FAMILY: 3, SUPERSEDED: 1, TRUE_MISSING: 1 };\n  const actual = {};\n  for (const id of auditedIds) {\n    const value = byId(id).reconciliation_disposition;\n    actual[value] = (actual[value] ?? 0) + 1;\n  }\n  assert.deepEqual(actual, expectedDisposition);\n  assert.equal(byId(13).coverage_state, 'MISSING');\n  assert.equal(byId(13).reconciliation_disposition, 'TRUE_MISSING');\n  assert.equal(byId(14).coverage_state, 'MISSING');\n  assert.equal(byId(14).reconciliation_disposition, 'DUPLICATE_FAMILY');\n  assert.equal(byId(14).family_anchor_master_id, 13);\n  assert.equal(byId(2).family_anchor_master_id, 1);\n  assert.equal(byId(3).family_anchor_master_id, 1);\n  assert.deepEqual(byId(52).superseded_by, [53]);\n  assert.deepEqual(byId(53).supersedes, [52]);\n});\n\ntest('snapshot-backed audited rows pin real repository provenance from #284/#287', () => {\n  const partialSnapshotIds = [1,2,3,10,30,32,33,34,35,47,48,49,50,51,52,53,68,69,70,81,82];\n  for (const id of partialSnapshotIds) {\n    const row = byId(id);\n    assert.ok(row.github_issue.includes(284), \\`master_id=\\${id} must reference #284\\`);\n    assert.ok(row.github_pr.includes(287), \\`master_id=\\${id} must reference PR #287\\`);\n    assert.match(row.reference_path, /^reference\\/source-tracks-snapshot\\//);\n    assert.equal(row.current_main_present, true);\n    assert.equal(row.coverage_state, 'PARTIAL');\n  }\n  assert.deepEqual(byId(107).github_issue, [30, 284]);\n  assert.ok(byId(107).github_pr.includes(287));\n  assert.equal(byId(107).coverage_state, 'COVERED');\n  assert.equal(byId(107).reconciliation_disposition, 'ALIAS_FOUND');\n  assert.equal(byId(107).manifest_path, 'app/components/v4/v4-source-manifest.ts');\n});\n\ntest('Track17 and Track18 Drive snapshot identities remain isolated from colliding GitHub namespaces', () => {\n  assert.equal(byId(49).semantic_identity, 'Drive Track17 Living Memory Terrain');\n  assert.equal(byId(49).namespace_type, 'drive-source-snapshot');\n  assert.equal(byId(50).semantic_identity, 'Drive Track18 Memory Core Electric Aurora');\n  assert.equal(byId(50).namespace_type, 'drive-source-snapshot');\n  assert.notEqual(byId(50).semantic_identity, 'Source Track18 Fragment Loader');\n  assert.ok(ledger.namespace_guards.includes('Drive Track17 Living Memory Terrain != historical GitHub Track17 Global Shell'));\n  assert.ok(ledger.namespace_guards.includes('Drive Track18 Memory Core Electric Aurora != current Source Track18 Fragment Loader'));\n});\n`;
          fs.writeFileSync(testPath, test);
          NODE

      - name: Validate focused contract
        run: node --test tests/master-design-coverage-contract.test.mjs

      - name: Commit reconciled ledger
        shell: bash
        run: |
          rm .github/workflows/one-shot-470-ledger-reconcile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add design-intake/master-design-coverage.json tests/master-design-coverage-contract.test.mjs .github/workflows/one-shot-470-ledger-reconcile.yml
          git commit -m "design-intake(470): reconcile snapshot provenance ledger"
          git push origin HEAD:design/470-ledger-provenance-reconciliation
