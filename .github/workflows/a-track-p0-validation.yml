name: A-track P0 validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        shell: bash
        run: |
          set -o pipefail
          node --import tsx --test 'tests/*.test.mjs' 2>&1 | tee /tmp/a-track-p0-test.log

      - name: Upload unit test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a-track-p0-test-log
          path: /tmp/a-track-p0-test.log
          if-no-files-found: error

      - name: Build
        run: npm run build

      - name: Database schema check
        run: npm run db:check
