name: A-track P0 validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Disposable PostgreSQL for the explicit backend integration gate.
      # tests/integration/** is not auto-discovered by the A-track standard
      # corpus, so the real-database with-first-memory atomicity contract is
      # exercised here against a fresh service container instead.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          # Trust auth: the disposable service container needs no password, so
          # no credential value ever appears in this workflow (GitGuardian).
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: lovetree_wfm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build test prerequisites
        run: npm run build

      - name: Targeted A-track contract tests
        run: node --import tsx --test tests/v4-source-faithful-contract.test.mjs tests/v4-complete-integration-contract.test.mjs tests/v4-product-spine-integration.test.mjs tests/v4-p1-product-contracts.test.mjs

      - name: Real PostgreSQL with-first-memory atomicity gate
        shell: bash
        run: |
          set -euo pipefail
          DATABASE_URL="postgres://postgres@127.0.0.1:5432/lovetree_wfm" \
            node --import tsx tests/integration/with-first-memory-atomicity.mjs

      - name: Prepare Playwright runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Lineage 53 V2 actual-route browser QA
        shell: bash
        run: |
          set -euo pipefail
          npm start > /tmp/lineage-53-v2-server.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/design-lab/lineages/53/v2 > /dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/lineage-53-v2-server.log
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/lineage-53-v2-server.log
            exit 1
          fi

          node --import tsx --test tests/lineage-53-v2-route-browser-qa.test.mjs

      - name: Unit and integration tests
        shell: bash
        run: |
          set -euo pipefail
          npm start > /tmp/a-track-p0-server.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          run_gate() {
            local label="$1"
            shift
            local log="/tmp/a-track-${label}.log"
            local status
            set +e
            "$@" 2>&1 | tee "$log"
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -ne 0 ]; then
              local details
              details="$(tail -n 40 "$log" | tr '\n' ' ' | cut -c1-4000)"
              details="${details//'%'/'%25'}"
              details="${details//$'\r'/'%0D'}"
              details="${details//$'\n'/'%0A'}"
              echo "::error title=A-track subgate failed::A_TRACK_SUBGATE_FAIL=${label} | ${details}"
              return "$status"
            fi
          }

          ready=0
          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/v4 > /dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/a-track-p0-server.log
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/a-track-p0-server.log
            exit 1
          fi

          run_gate memory-anatomy-route \
            node --import tsx --test tests/memory-anatomy-route-browser-qa.test.mjs

          # --- standard_tests partitioning: isolate Playwright browser tests ---
          mapfile -t all_standard < <(
            find tests -maxdepth 1 -type f -name '*.test.mjs' \
              ! -name 'lineage-52-route-browser-qa.test.mjs' \
              ! -name 'lineage-53-v2-route-browser-qa.test.mjs' \
              ! -name 'memory-anatomy-route-browser-qa.test.mjs' \
              -print | sort
          )
          if [ "${#all_standard[@]}" -eq 0 ]; then
            echo "No standard tests discovered" >&2
            exit 1
          fi

          detect_pw() {
            grep -Eq "from ['\"]playwright['\"]|import\(['\"]playwright['\"]\)|@playwright/test|chromium\.launch|firefox\.launch|webkit\.launch" "$1"
          }

          browser_tests=()
          non_browser_tests=()
          for f in "${all_standard[@]}"; do
            if detect_pw "$f"; then
              browser_tests+=("$f")
            else
              non_browser_tests+=("$f")
            fi
          done

          # Fail-closed guard: a Playwright-using test must never sit in the
          # parallel non-browser bucket, and every browser-bucket entry must
          # actually use Playwright. Prevents silent mis-classification that
          # would reintroduce shared-browser nondeterminism.
          for f in "${non_browser_tests[@]}"; do
            if detect_pw "$f"; then
              echo "FAIL-CLOSED: Playwright test mis-classified as non-browser: $f" >&2
              exit 1
            fi
          done
          for f in "${browser_tests[@]}"; do
            if ! detect_pw "$f"; then
              echo "FAIL-CLOSED: browser bucket entry without Playwright usage: $f" >&2
              exit 1
            fi
          done

          # --- Authoritative expected browser inventory (fail-closed proof) ---
          # The two loops above only re-run detect_pw(), so on their own they
          # cannot prove the partition is correct: a detector that stops
          # recognising a browser test would place it in the non-browser bucket
          # AND agree with itself that this is fine. The inventory below is the
          # independent expectation detect_pw() is validated against. It is
          # maintained by hand on purpose.
          #
          # Adding or renaming a browser-driving standard test MUST fail this
          # gate until this list is updated, so a new browser test can never
          # silently join the parallel bucket.
          expected_browser_tests=(
            tests/v4-additional-source-baseline.test.mjs
            tests/v4-cinematic-v6.test.mjs
            tests/v4-cinematic.test.mjs
            tests/v4-existing-fidelity-remediation.test.mjs
            tests/v4-final-product-surfaces-browser.test.mjs
            tests/v4-first-journey-source-faithful.test.mjs
            tests/v4-first-journey-persistence-behavioral.test.mjs
            tests/v4-moments-100-source-faithful.test.mjs
            tests/lineage-59-browser-qa.test.mjs
            tests/track67-v242-browser-qa.test.mjs
          )
          expected_browser_count=10

          printf '%s\n' "${expected_browser_tests[@]}" | sort > /tmp/atrack-expected-browser.txt
          printf '%s\n' "${all_standard[@]}" | sort > /tmp/atrack-standard-corpus.txt

          # Inventory self-consistency: declared count must match the declared
          # set, and the set must not contain duplicates. Guards against a
          # careless edit that weakens the expectation itself.
          if [ "${#expected_browser_tests[@]}" -ne "$expected_browser_count" ]; then
            echo "FAIL-CLOSED: expected browser inventory count mismatch (declared ${expected_browser_count}, listed ${#expected_browser_tests[@]})" >&2
            exit 1
          fi
          if [ "$(sort -u /tmp/atrack-expected-browser.txt | wc -l)" -ne "$expected_browser_count" ]; then
            echo "FAIL-CLOSED: expected browser inventory contains duplicate entries" >&2
            exit 1
          fi

          # This repository is known to contain standard browser tests, so an
          # empty browser bucket is always a detector regression and never a
          # legitimate state. Reject it explicitly.
          if [ "${#browser_tests[@]}" -eq 0 ]; then
            echo "FAIL-CLOSED: browser bucket is empty, but ${expected_browser_count} standard browser tests are expected" >&2
            exit 1
          fi

          # Every expected browser test must still be part of the standard
          # corpus, otherwise the expectation is silently vacuous.
          missing_from_corpus="$(comm -23 /tmp/atrack-expected-browser.txt /tmp/atrack-standard-corpus.txt)"
          if [ -n "$missing_from_corpus" ]; then
            echo "FAIL-CLOSED: expected browser test(s) absent from the standard corpus:" >&2
            printf '%s\n' "$missing_from_corpus" | sed 's/^/  /' >&2
            echo "Update expected_browser_tests in this workflow if the test was intentionally removed or renamed." >&2
            exit 1
          fi

          # Exact-set comparison, not a count comparison: this also catches a
          # same-count substitution where one browser test replaces another.
          printf '%s\n' "${browser_tests[@]}" | sort > /tmp/atrack-actual-browser.txt
          if ! diff -u /tmp/atrack-expected-browser.txt /tmp/atrack-actual-browser.txt > /tmp/atrack-browser-setdiff.txt; then
            echo "FAIL-CLOSED: standard browser inventory drift (expected set != detected set)" >&2
            echo "  '-' = expected by this workflow, '+' = detected by detect_pw()" >&2
            sed 's/^/  /' /tmp/atrack-browser-setdiff.txt >&2
            echo "Either detect_pw() regressed, or the browser corpus changed and expected_browser_tests must be updated." >&2
            exit 1
          fi

          # Independent cross-detector: a separately implemented, structural
          # browser-signal scan. It keys off import/require specifiers and
          # browser-launch call shapes instead of detect_pw()'s literal
          # patterns, so it also covers forms detect_pw() would miss (for
          # example `require('playwright')`). It is matched against the same
          # inventory in BOTH directions: an extra file means an unlisted
          # browser test, a missing file means this cross-check itself
          # regressed and can no longer be trusted. Because the two detectors
          # share no pattern, one of them breaking cannot disable both the
          # partition and this proof at the same time.
          : > /tmp/atrack-broad-browser.txt
          for f in "${all_standard[@]}"; do
            if grep -Eq "(import|require)[^;]*(playwright|puppeteer)|\.launch\(|\.newContext\(|\.newPage\(" "$f"; then
              printf '%s\n' "$f" >> /tmp/atrack-broad-browser.txt
            fi
          done
          sort -o /tmp/atrack-broad-browser.txt /tmp/atrack-broad-browser.txt
          if ! diff -u /tmp/atrack-expected-browser.txt /tmp/atrack-broad-browser.txt > /tmp/atrack-broad-setdiff.txt; then
            echo "FAIL-CLOSED: independent cross-detector disagrees with the expected browser inventory" >&2
            echo "  '-' = expected by this workflow, '+' = flagged by the cross-detector" >&2
            sed 's/^/  /' /tmp/atrack-broad-setdiff.txt >&2
            echo "A '+' line is a browser test missing from expected_browser_tests; add it so it runs serially with --test-concurrency=1." >&2
            echo "A '-' line means the cross-detector no longer recognises a known browser test and must be repaired." >&2
            exit 1
          fi

          # Partition integrity: every standard test landed in exactly one
          # bucket (nothing dropped, nothing double-counted).
          if [ "$(( ${#browser_tests[@]} + ${#non_browser_tests[@]} ))" -ne "${#all_standard[@]}" ]; then
            echo "FAIL-CLOSED: partition size mismatch (browser ${#browser_tests[@]} + non-browser ${#non_browser_tests[@]} != standard ${#all_standard[@]})" >&2
            exit 1
          fi

          echo "standard tests: ${#all_standard[@]}"
          echo "standard non-browser tests: ${#non_browser_tests[@]}"
          echo "standard browser tests: ${#browser_tests[@]} (matches expected inventory)"

          # Non-browser standard tests keep normal Node test concurrency.
          run_gate standard-non-browser-tests \
            node --import tsx --test "${non_browser_tests[@]}"

          # Browser standard tests run file-serial (--test-concurrency=1) to
          # remove shared-browser nondeterminism under concurrent execution.
          # No empty-bucket fallback: a zero-sized browser bucket already
          # failed closed above, so this gate always executes.
          # Lineage 59 V5 browser QA targets the same A-track `npm start`
          # server (port 3000); local runs use LINEAGE59_BASE_URL (default 3160).
          run_gate standard-browser-tests \
            env LINEAGE59_BASE_URL=http://127.0.0.1:3000 \
            env TRACK67_BASE_URL=http://127.0.0.1:3000 \
            node --import tsx --test --test-concurrency=1 "${browser_tests[@]}"

          echo "Running Lineage 52 actual-route browser QA in isolation"
          run_gate lineage-52-route \
            node --import tsx --test tests/lineage-52-route-browser-qa.test.mjs

          echo "Running Lineage 52 direct-navigation browser security QA"
          run_gate lineage-52-direct-navigation \
            node --import tsx --test tests/lineage-52-direct-navigation-browser-qa.mjs

      - name: V4 Orbit canonical actual-route browser QA
        shell: bash
        run: |
          set -euo pipefail
          npm start > /tmp/v4-orbit-route-server.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/v4/subjects/demo/orbit > /dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/v4-orbit-route-server.log
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/v4-orbit-route-server.log
            exit 1
          fi

          # PR #156 Orbit canonical browser QA across desktop 1280x800,
          # mobile 390x844 real touch, 320x720 and reduced motion.  A
          # failure here fails the A-track (no skip, no xfail).
          V4_ORBIT_SCREENSHOT_DIR=/tmp/v4-orbit-canonical-155-screenshots \
            node --import tsx --test tests/v4-orbit-canonical-browser-qa.mjs

      - name: Build
        run: npm run build

      - name: Database schema check
        run: npm run db:check

      - name: Upload V4 Orbit canonical screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-orbit-canonical-155-screenshots
          path: /tmp/v4-orbit-canonical-155-screenshots/*.png
          if-no-files-found: warn
