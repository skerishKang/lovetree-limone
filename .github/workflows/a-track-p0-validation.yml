name: A-track P0 validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build test prerequisites
        run: npm run build

      - name: Targeted A-track contract tests
        run: node --import tsx --test tests/v4-source-faithful-contract.test.mjs tests/v4-complete-integration-contract.test.mjs tests/v4-product-spine-integration.test.mjs tests/v4-p1-product-contracts.test.mjs

      - name: Prepare Playwright runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Lineage 53 V2 actual-route browser QA
        shell: bash
        run: |
          set -euo pipefail
          npm start > /tmp/lineage-53-v2-server.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/design-lab/lineages/53/v2 > /dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/lineage-53-v2-server.log
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/lineage-53-v2-server.log
            exit 1
          fi

          node --import tsx --test tests/lineage-53-v2-route-browser-qa.test.mjs

      - name: Unit and integration tests
        shell: bash
        run: |
          set -euo pipefail
          npm start > /tmp/a-track-p0-server.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          run_gate() {
            local label="$1"
            shift
            local log="/tmp/a-track-${label}.log"
            local status
            set +e
            "$@" 2>&1 | tee "$log"
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -ne 0 ]; then
              local details
              details="$(tail -n 40 "$log" | tr '\n' ' ' | cut -c1-4000)"
              details="${details//'%'/'%25'}"
              details="${details//$'\r'/'%0D'}"
              details="${details//$'\n'/'%0A'}"
              echo "::error title=A-track subgate failed::A_TRACK_SUBGATE_FAIL=${label} | ${details}"
              return "$status"
            fi
          }

          ready=0
          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/v4 > /dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/a-track-p0-server.log
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/a-track-p0-server.log
            exit 1
          fi

          run_gate memory-anatomy-route \
            node --import tsx --test tests/memory-anatomy-route-browser-qa.test.mjs

          # PR #156 V4 Orbit canonical actual-route browser QA (isolated
          # subgate).  Screenshots are written to a deterministic runner
          # path and uploaded as a GitHub Actions artifact so CTO can
          # review them from the remote run.
          if ! curl --fail --silent --show-error http://127.0.0.1:3000/v4/subjects/demo/orbit > /dev/null; then
            echo "V4 Orbit actual route not ready" >&2
            cat /tmp/a-track-p0-server.log
            exit 1
          fi
          run_gate v4-orbit-route \
            env V4_ORBIT_SCREENSHOT_DIR=/tmp/v4-orbit-canonical-155-screenshots \
            node --import tsx --test tests/v4-orbit-canonical-browser-qa.mjs

          mapfile -t standard_tests < <(
            find tests -maxdepth 1 -type f -name '*.test.mjs' \
              ! -name 'lineage-52-route-browser-qa.test.mjs' \
              ! -name 'lineage-53-v2-route-browser-qa.test.mjs' \
              ! -name 'memory-anatomy-route-browser-qa.test.mjs' \
              -print | sort
          )
          if [ "${#standard_tests[@]}" -eq 0 ]; then
            echo "No standard tests discovered" >&2
            exit 1
          fi

          run_gate standard-tests \
            node --import tsx --test "${standard_tests[@]}"

          echo "Running Lineage 52 actual-route browser QA in isolation"
          run_gate lineage-52-route \
            node --import tsx --test tests/lineage-52-route-browser-qa.test.mjs

          echo "Running Lineage 52 direct-navigation browser security QA"
          run_gate lineage-52-direct-navigation \
            node --import tsx --test tests/lineage-52-direct-navigation-browser-qa.mjs

      - name: Build
        run: npm run build

      - name: Database schema check
        run: npm run db:check

      - name: Upload V4 Orbit canonical screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-orbit-canonical-155-screenshots
          path: /tmp/v4-orbit-canonical-155-screenshots/*.png
          if-no-files-found: warn
