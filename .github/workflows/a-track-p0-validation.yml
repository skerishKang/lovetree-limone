name: A-track P0 validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: lovetree_wfm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Database schema check
        run: npm run db:check

      - name: Build test prerequisites
        run: npm run build

      - name: Targeted A-track contract tests
        run: node --import tsx --test tests/v4-source-faithful-contract.test.mjs tests/v4-complete-integration-contract.test.mjs tests/v4-product-spine-integration.test.mjs tests/v4-p1-product-contracts.test.mjs

      - name: Real PostgreSQL with-first-memory atomicity gate
        shell: bash
        run: |
          set -euo pipefail
          DATABASE_URL="postgres://postgres@127.0.0.1:5432/lovetree_wfm" \
            node --import tsx tests/integration/with-first-memory-atomicity.mjs

      # Cheap fail-closed source classification runs before downloading Chromium.
      - name: Browser inventory and partition fail-closed contract
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t all_standard < <(
            find tests -maxdepth 1 -type f -name '*.test.mjs' \
              ! -name 'lineage-52-route-browser-qa.test.mjs' \
              ! -name 'lineage-53-v2-route-browser-qa.test.mjs' \
              ! -name 'memory-anatomy-route-browser-qa.test.mjs' \
              -print | sort
          )
          if [ "${#all_standard[@]}" -eq 0 ]; then
            echo "FAIL-CLOSED: no standard tests discovered" >&2
            exit 1
          fi

          detect_pw() {
            grep -Eq "from ['\"]playwright['\"]|import\(['\"]playwright['\"]\)|@playwright/test|chromium\.launch|firefox\.launch|webkit\.launch" "$1"
          }

          browser_tests=()
          non_browser_tests=()
          for f in "${all_standard[@]}"; do
            if detect_pw "$f"; then
              browser_tests+=("$f")
            else
              non_browser_tests+=("$f")
            fi
          done

          for f in "${non_browser_tests[@]}"; do
            if detect_pw "$f"; then
              echo "FAIL-CLOSED: Playwright test mis-classified as non-browser: $f" >&2
              exit 1
            fi
          done
          for f in "${browser_tests[@]}"; do
            if ! detect_pw "$f"; then
              echo "FAIL-CLOSED: browser bucket entry without Playwright usage: $f" >&2
              exit 1
            fi
          done

          expected_browser_tests=(
            tests/v4-additional-source-baseline.test.mjs
            tests/v4-cinematic-v6.test.mjs
            tests/v4-cinematic.test.mjs
            tests/v4-existing-fidelity-remediation.test.mjs
            tests/v4-final-product-surfaces-browser.test.mjs
            tests/v4-first-journey-source-faithful.test.mjs
            tests/v4-first-journey-persistence-behavioral.test.mjs
            tests/v4-moments-100-source-faithful.test.mjs
            tests/lineage-59-browser-qa.test.mjs
            tests/track67-v242-browser-qa.test.mjs
            tests/track67-native-inspect-acceptance.test.mjs
          )
          expected_browser_count=11

          printf '%s\n' "${expected_browser_tests[@]}" | sort > /tmp/atrack-expected-browser.txt
          printf '%s\n' "${all_standard[@]}" | sort > /tmp/atrack-standard-corpus.txt
          printf '%s\n' "${browser_tests[@]}" | sort > /tmp/atrack-browser-tests.txt
          printf '%s\n' "${non_browser_tests[@]}" | sort > /tmp/atrack-non-browser-tests.txt

          if [ "${#expected_browser_tests[@]}" -ne "$expected_browser_count" ]; then
            echo "FAIL-CLOSED: expected browser inventory count mismatch (declared ${expected_browser_count}, listed ${#expected_browser_tests[@]})" >&2
            exit 1
          fi
          if [ "$(sort -u /tmp/atrack-expected-browser.txt | wc -l)" -ne "$expected_browser_count" ]; then
            echo "FAIL-CLOSED: expected browser inventory contains duplicate entries" >&2
            exit 1
          fi
          if [ "${#browser_tests[@]}" -eq 0 ]; then
            echo "FAIL-CLOSED: browser bucket is empty, but ${expected_browser_count} standard browser tests are expected" >&2
            exit 1
          fi

          missing_from_corpus="$(comm -23 /tmp/atrack-expected-browser.txt /tmp/atrack-standard-corpus.txt)"
          if [ -n "$missing_from_corpus" ]; then
            echo "FAIL-CLOSED: expected browser test(s) absent from the standard corpus:" >&2
            printf '%s\n' "$missing_from_corpus" | sed 's/^/  /' >&2
            exit 1
          fi

          if ! diff -u /tmp/atrack-expected-browser.txt /tmp/atrack-browser-tests.txt > /tmp/atrack-browser-setdiff.txt; then
            echo "FAIL-CLOSED: standard browser inventory drift (expected set != detected set)" >&2
            cat /tmp/atrack-browser-setdiff.txt >&2
            exit 1
          fi

          : > /tmp/atrack-broad-browser.txt
          for f in "${all_standard[@]}"; do
            if grep -Eq "(import|require)[^;]*(playwright|puppeteer)|\.launch\(|\.newContext\(|\.newPage\(" "$f"; then
              printf '%s\n' "$f" >> /tmp/atrack-broad-browser.txt
            fi
          done
          sort -o /tmp/atrack-broad-browser.txt /tmp/atrack-broad-browser.txt
          if ! diff -u /tmp/atrack-expected-browser.txt /tmp/atrack-broad-browser.txt > /tmp/atrack-broad-setdiff.txt; then
            echo "FAIL-CLOSED: independent cross-detector disagrees with expected browser inventory" >&2
            cat /tmp/atrack-broad-setdiff.txt >&2
            exit 1
          fi

          if [ "$(( ${#browser_tests[@]} + ${#non_browser_tests[@]} ))" -ne "${#all_standard[@]}" ]; then
            echo "FAIL-CLOSED: partition size mismatch" >&2
            exit 1
          fi

          echo "standard tests: ${#all_standard[@]}"
          echo "standard non-browser tests: ${#non_browser_tests[@]}"
          echo "standard browser tests: ${#browser_tests[@]} (matches expected inventory)"

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.55.1-chromium

      - name: Report Playwright Chromium cache outcome
        shell: bash
        run: |
          {
            echo '## Playwright Chromium cache'
            echo
            echo '- path: `~/.cache/ms-playwright`'
            echo '- key: `${{ runner.os }}-playwright-1.55.1-chromium`'
            echo '- cache-hit: `${{ steps.playwright-cache.outputs.cache-hit }}`'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare Playwright runtime
        run: |
          npx playwright install chromium

      - name: Lineage 53 V2 actual-route browser QA
        shell: bash
        run: |
          set -euo pipefail
          source scripts/ci/a-track-server-lifecycle.sh
          pid_file=/tmp/lineage-53-v2-server.pid
          trap 'atrack_stop_server_group "$pid_file"' EXIT

          atrack_start_server_group \
            /tmp/lineage-53-v2-server.log \
            "$pid_file" \
            http://127.0.0.1:3000/design-lab/lineages/53/v2
          node --import tsx --test tests/lineage-53-v2-route-browser-qa.test.mjs 2>&1 | tee /tmp/a-track-lineage-53-v2-route.log

          trap - EXIT
          atrack_stop_server_group "$pid_file"

      - name: Start A-track exact-head application server
        shell: bash
        run: |
          set -euo pipefail
          source scripts/ci/a-track-server-lifecycle.sh
          atrack_start_server_group \
            /tmp/a-track-p0-server.log \
            /tmp/a-track-p0-server.pid \
            http://127.0.0.1:3000/v4

      - name: Unit/integration — memory-anatomy-route
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx --test tests/memory-anatomy-route-browser-qa.test.mjs 2>&1 | tee /tmp/a-track-memory-anatomy-route.log

      - name: Unit/integration — standard-non-browser-tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t non_browser_tests < /tmp/atrack-non-browser-tests.txt
          node --import tsx --test "${non_browser_tests[@]}" 2>&1 | tee /tmp/a-track-standard-non-browser-tests.log

      - name: Unit/integration — standard-browser-tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t browser_tests < /tmp/atrack-browser-tests.txt
          LINEAGE59_BASE_URL=http://127.0.0.1:3000 \
          TRACK67_BASE_URL=http://127.0.0.1:3000 \
            node --import tsx --test --test-concurrency=1 "${browser_tests[@]}" 2>&1 | tee /tmp/a-track-standard-browser-tests.log

      - name: Five-source MVP continuity browser QA
        shell: bash
        run: |
          set -euo pipefail
          FIVE_SOURCE_MVP_QA_URL=http://127.0.0.1:3000 \
          FIVE_SOURCE_MVP_SCREENSHOT_DIR=/tmp/five-source-mvp-browser-qa \
            node qa/five-source-mvp-browser-qa.mjs 2>&1 | tee /tmp/a-track-five-source-mvp-browser-qa.log

      - name: Upload five-source MVP browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: five-source-mvp-browser-evidence
          path: /tmp/five-source-mvp-browser-qa/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Unit/integration — lineage-52-route
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx --test tests/lineage-52-route-browser-qa.test.mjs 2>&1 | tee /tmp/a-track-lineage-52-route.log

      - name: Unit/integration — lineage-52-direct-navigation
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx --test tests/lineage-52-direct-navigation-browser-qa.mjs 2>&1 | tee /tmp/a-track-lineage-52-direct-navigation.log

      - name: Stop A-track application server
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          source scripts/ci/a-track-server-lifecycle.sh
          atrack_stop_server_group /tmp/a-track-p0-server.pid

      - name: V4 Orbit canonical actual-route browser QA
        shell: bash
        run: |
          set -euo pipefail
          source scripts/ci/a-track-server-lifecycle.sh
          pid_file=/tmp/v4-orbit-route-server.pid
          trap 'atrack_stop_server_group "$pid_file"' EXIT

          atrack_start_server_group \
            /tmp/v4-orbit-route-server.log \
            "$pid_file" \
            http://127.0.0.1:3000/v4/subjects/demo/orbit
          V4_ORBIT_SCREENSHOT_DIR=/tmp/v4-orbit-canonical-155-screenshots \
            node --import tsx --test tests/v4-orbit-canonical-browser-qa.mjs 2>&1 | tee /tmp/a-track-v4-orbit-canonical.log

          trap - EXIT
          atrack_stop_server_group "$pid_file"

      - name: Upload V4 Orbit canonical screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-orbit-canonical-155-screenshots
          path: /tmp/v4-orbit-canonical-155-screenshots/*.png
          if-no-files-found: warn

      - name: Surface A-track failure diagnostics
        if: failure()
        shell: bash
        run: |
          {
            echo '## A-track failure diagnostics'
            echo
            for f in /tmp/a-track-*.log /tmp/lineage-53-v2-server.log /tmp/v4-orbit-route-server.log /tmp/atrack-*setdiff.txt; do
              [ -f "$f" ] || continue
              echo "### $f"
              echo '```text'
              tail -n 80 "$f"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload A-track failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: a-track-failure-diagnostics
          if-no-files-found: warn
          retention-days: 3
          path: |
            /tmp/a-track-*.log
            /tmp/lineage-53-v2-server.log
            /tmp/v4-orbit-route-server.log
            /tmp/atrack-*.txt
