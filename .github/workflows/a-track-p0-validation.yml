name: A-track P0 validation

on:
  push:
    branches:
      - ci/v4-global-discovery-live-validation3-20260809
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build test prerequisites
        run: npm run build

      - name: Targeted A+B contract tests
        run: node --import tsx --test tests/v4-source-faithful-contract.test.mjs tests/v4-complete-integration-contract.test.mjs tests/v4-product-spine-integration.test.mjs tests/v4-p1-product-contracts.test.mjs tests/v4-global-discovery-live.test.mjs

      - name: Prepare Playwright runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Unit and integration tests
        shell: bash
        run: |
          set -euo pipefail
          npm start > /tmp/a-track-p0-server.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/v4 > /dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/a-track-p0-server.log
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/a-track-p0-server.log
            exit 1
          fi

          node --import tsx --test 'tests/*.test.mjs'

      - name: Build
        run: npm run build

      - name: Database schema check
        run: npm run db:check