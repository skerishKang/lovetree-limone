name: MVP001 Isolated Static Browser QA

on:
  pull_request:
    paths:
      - 'public/mvp/**'
      - 'core/runtime/worker/**'
      - 'qa/mvp001-browser-qa.mjs'
      - 'scripts/materialize-mvp001.mjs'
      - 'tests/mvp*.test.mjs'
      - '.github/workflows/mvp001-isolated-static-browser-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mvp001-browser-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mvp001-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify exact checked-out head
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha }}"
          echo "MVP001_EXACT_HEAD=$actual"
          test "$actual" = "$expected"

      - name: Materialization parity check
        run: node scripts/materialize-mvp001.mjs

      - name: Generation phase guard
        run: node src/08_harness/generation-phase-guard.mjs

      - name: Route & isolation contract tests
        run: node --import tsx --test tests/mvp-public-static-route.test.mjs tests/mvp001-isolated-static.test.mjs

      - name: Prepare Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run MVP001 A/B Parity & Input QA
        run: node qa/mvp001-browser-qa.mjs

      - name: Upload MVP001 A/B Parity Screenshots Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mvp001-isolated-static-ab-parity
          path: evidence/mvp001/a-b-parity/*.png
          if-no-files-found: error
          retention-days: 14
