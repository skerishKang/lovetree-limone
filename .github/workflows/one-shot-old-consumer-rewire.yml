name: One-shot OLD moved-path consumer rewire

on:
  push:
    branches:
      - refactor/old-drive-alignment-v1

permissions:
  contents: write

jobs:
  rewire-moved-old-consumers:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rewrite only approved moved-path consumers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re, subprocess

          tracked = subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          changed = []
          counts = {
              'reference/ -> old/reference/': 0,
              'components/source-track-58/ -> old/components/source-track-58/': 0,
              'assets/home-hero.mp4 -> old/assets/home-hero.mp4': 0,
              'ops/releases/ -> old/ops/releases/': 0,
          }

          for rel in tracked:
              if not rel or rel.startswith('old/') or rel == '.github/workflows/one-shot-old-consumer-rewire.yml':
                  continue
              p = Path(rel)
              if not p.is_file():
                  continue
              try:
                  raw = p.read_bytes()
                  if b'\0' in raw:
                      continue
                  text = raw.decode('utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              before = text

              text, n = re.subn(r'(?<!old/)reference/', 'old/reference/', text)
              counts['reference/ -> old/reference/'] += n
              text, n = re.subn(r'(?<!old/)components/source-track-58/', 'old/components/source-track-58/', text)
              counts['components/source-track-58/ -> old/components/source-track-58/'] += n
              text, n = re.subn(r'(?<!old/)assets/home-hero\.mp4', 'old/assets/home-hero.mp4', text)
              counts['assets/home-hero.mp4 -> old/assets/home-hero.mp4'] += n
              text, n = re.subn(r'(?<!old/)ops/releases/', 'old/ops/releases/', text)
              counts['ops/releases/ -> old/ops/releases/'] += n

              if text != before:
                  p.write_text(text, encoding='utf-8')
                  changed.append(rel)

          eslint = Path('eslint.config.mjs')
          text = eslint.read_text(encoding='utf-8')
          marker = '    "old/reference/**",\n'
          if marker not in text:
              raise SystemExit('expected old/reference ignore missing after physical-path rewrite')
          if '    "old/workspace-archive/**",\n' not in text:
              text = text.replace(marker, marker + '    "old/workspace-archive/**",\n')
              eslint.write_text(text, encoding='utf-8')
              if 'eslint.config.mjs' not in changed:
                  changed.append('eslint.config.mjs')

          print('replacement counts:')
          for k,v in counts.items(): print(f'  {k}: {v}')
          print(f'changed files: {len(changed)}')
          for rel in changed: print(rel)

          # Fail closed if active files still point at the known moved prefixes.
          residuals = []
          patterns = [
              re.compile(r'(?<!old/)reference/'),
              re.compile(r'(?<!old/)components/source-track-58/'),
              re.compile(r'(?<!old/)assets/home-hero\.mp4'),
              re.compile(r'(?<!old/)ops/releases/'),
          ]
          for rel in tracked:
              if not rel or rel.startswith('old/') or rel == '.github/workflows/one-shot-old-consumer-rewire.yml':
                  continue
              p=Path(rel)
              if not p.is_file(): continue
              try: text=p.read_text(encoding='utf-8')
              except (UnicodeDecodeError,OSError): continue
              for pat in patterns:
                  if pat.search(text): residuals.append((rel,pat.pattern))
          if residuals:
              for item in residuals: print('RESIDUAL', item)
              raise SystemExit('residual approved moved-path consumer remains')
          PY

          git diff --check
          git diff --stat

      - name: Verify lint boundary after archive move
        shell: bash
        run: |
          npm ci
          npm run lint

      - name: Commit path-only consumer rewires
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(old): rewire consumers to archived Drive paths"
          git push origin HEAD:refactor/old-drive-alignment-v1
