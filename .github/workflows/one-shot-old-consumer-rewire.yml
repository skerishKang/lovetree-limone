name: One-shot OLD moved-path consumer rewire

on:
  push:
    branches:
      - refactor/old-drive-alignment-v1

permissions:
  contents: write

jobs:
  rewire-moved-old-consumers:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rewrite only root OLD moved-path consumers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re, subprocess

          tracked = subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          changed = []
          counts = {'reference': 0, 'components58': 0, 'ops': 0}

          for rel in tracked:
              if not rel or rel.startswith('old/') or rel.startswith('.github/workflows/'):
                  continue
              p = Path(rel)
              if not p.is_file():
                  continue
              try:
                  raw = p.read_bytes()
                  if b'\0' in raw:
                      continue
                  text = raw.decode('utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              before = text

              # Root repository reference/ moved to old/reference/. Preserve
              # public/reference/, URL subpaths, and any other X/reference/ tree.
              text, n = re.subn(r'((?:\.\./)+)reference/', r'\1old/reference/', text)
              counts['reference'] += n
              text, n = re.subn(r'(?<![A-Za-z0-9_./:@-])reference/', 'old/reference/', text)
              counts['reference'] += n
              text = text.replace('@/reference/', '@/old/reference/')

              # Only the standalone root components/source-track-58 tree moved.
              n0 = text.count('@/components/source-track-58/')
              text = text.replace('@/components/source-track-58/', '@/old/components/source-track-58/')
              counts['components58'] += n0
              text, n = re.subn(r'((?:\.\./)+)components/source-track-58/', r'\1old/components/source-track-58/', text)
              counts['components58'] += n
              text, n = re.subn(r'(?<![A-Za-z0-9_./:@-])components/source-track-58/', 'old/components/source-track-58/', text)
              counts['components58'] += n

              # Root ops/releases moved to old/ops/releases.
              text, n = re.subn(r'((?:\.\./)+)ops/releases/', r'\1old/ops/releases/', text)
              counts['ops'] += n
              text, n = re.subn(r'(?<![A-Za-z0-9_./:@-])ops/releases/', 'old/ops/releases/', text)
              counts['ops'] += n

              # Safety invariant: never rewrite the active public asset tree.
              if 'public/old/reference/' in text:
                  raise SystemExit(f'forbidden public/old/reference rewrite in {rel}')

              if text != before:
                  p.write_text(text, encoding='utf-8')
                  changed.append(rel)

          eslint = Path('eslint.config.mjs')
          etext = eslint.read_text(encoding='utf-8')
          marker = '    "old/reference/**",\n'
          if marker in etext and '    "old/workspace-archive/**",\n' not in etext:
              etext = etext.replace(marker, marker + '    "old/workspace-archive/**",\n')
              eslint.write_text(etext, encoding='utf-8')
              if 'eslint.config.mjs' not in changed:
                  changed.append('eslint.config.mjs')

          print('replacement counts:', counts)
          print('changed files:', len(changed))
          for rel in changed:
              print(rel)

          # Hard safety check: public/reference remains untouched everywhere.
          for rel in tracked:
              if not rel or rel.startswith('old/') or rel.startswith('.github/workflows/'):
                  continue
              p = Path(rel)
              if not p.is_file():
                  continue
              try:
                  text = p.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              if 'public/old/reference/' in text:
                  raise SystemExit(f'forbidden public path mutation in {rel}')
          PY

          git diff --check
          git diff --stat

      - name: Verify lint boundary after archive move
        run: |
          npm ci
          npm run lint

      - name: Commit non-workflow path-only rewires
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!.github/workflows'
          if git diff --cached --quiet; then
            echo "No non-workflow rewires required"
            exit 0
          fi
          git commit -m "test(old): rewire root consumers to archived Drive paths"
          git push origin HEAD:refactor/old-drive-alignment-v1
