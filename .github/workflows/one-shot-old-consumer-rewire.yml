name: One-shot OLD consumer rewrite rollback

on:
  push:
    branches:
      - refactor/old-drive-alignment-v1

permissions:
  contents: write

jobs:
  rollback-overbroad-rewrite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Revert only overbroad consumer rewrite commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git revert --no-edit 8b50216697b1c4603acdd9e8756f7ecb1989e7e4
          git diff HEAD^ --check
          git push origin HEAD:refactor/old-drive-alignment-v1
