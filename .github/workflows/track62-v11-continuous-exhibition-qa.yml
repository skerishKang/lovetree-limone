name: Track62 V1.1 continuous exhibition rail native browser QA

# Evidence-only workflow for the Track62 V1.1 continuous exhibition rail
# capability proof (Issue #159, refs #141 #201). It runs the dedicated QA
# helper `qa/track62-v11-continuous-exhibition-qa.mjs` (intentionally OUTSIDE
# the standard tests/*.test.mjs corpus so the shared A-track fail-closed
# 8-entry browser inventory is NOT affected) and uploads the screenshots +
# qa-results.json as a GitHub artifact for Web CTO review. It does NOT modify
# backend/API/DB/Auth and touches no other lane. Pure additive QA evidence.

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  track62-v11-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare Playwright runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run Track62 V1.1 continuous exhibition rail browser QA
        shell: bash
        run: |
          set -euo pipefail
          npm start > /tmp/track62-qa-server.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in {1..120}; do
            if curl --fail --silent --show-error "http://127.0.0.1:3000/design-lab/capabilities/continuous-exhibition-rail" > /dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/track62-qa-server.log
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/track62-qa-server.log
            exit 1
          fi

          mkdir -p qa-artifacts/track62-v11
          TRACK62_QA_URL="http://127.0.0.1:3000" \
            node qa/track62-v11-continuous-exhibition-qa.mjs

      - name: Upload Track62 V1.1 continuous exhibition rail QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: track62-v11-continuous-exhibition-qa-evidence
          path: |
            qa-artifacts/track62-v11/*.png
            qa-artifacts/track62-v11/qa-results.json
          if-no-files-found: warn
