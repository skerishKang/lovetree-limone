name: B2 cinematic v6 validation

on:
  push:
    branches:
      - ci/v4-b2-cinematic-v6-validation-20260808
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build test prerequisites
        run: npm run build

      - name: Prepare Playwright runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Diagnose cinematic browser render
        shell: bash
        run: |
          set -euo pipefail
          npm start > /tmp/b2-cinematic-v6-server.log 2>&1 &
          server_pid=$!
          cleanup() {
            pkill -TERM -P "$server_pid" 2>/dev/null || true
            kill -TERM "$server_pid" 2>/dev/null || true
            sleep 1
            pkill -KILL -P "$server_pid" 2>/dev/null || true
            kill -KILL "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/v4/cinematic > /dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/b2-cinematic-v6-server.log
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/b2-cinematic-v6-server.log
            exit 1
          fi

          set +e
          timeout --signal=KILL 45s node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1280, height: 800 } });
          const consoleErrors = [];
          const pageErrors = [];
          page.on('console', (msg) => {
            if (msg.type() === 'error') consoleErrors.push(msg.text());
          });
          page.on('pageerror', (err) => pageErrors.push(err.stack || err.message));
          let response = null;
          let snapshot = null;
          let fatal = null;
          try {
            response = await page.goto('http://127.0.0.1:3000/v4/cinematic', {
              waitUntil: 'domcontentloaded',
              timeout: 20000,
            });
            await page.waitForTimeout(4000);
            snapshot = await page.evaluate(() => ({
              title: document.title,
              url: location.href,
              root: Boolean(document.querySelector('[data-cinematic-root]')),
              menu: Boolean(document.querySelector('.cin-menu-btn')),
              shell: Boolean(document.querySelector('[data-cinematic-v6-shell]')),
              text: document.body?.innerText?.slice(0, 3000) || '',
              html: document.body?.innerHTML?.slice(0, 8000) || '',
              scripts: Array.from(document.scripts).map((s) => s.src || '[inline]'),
            }));
          } catch (error) {
            fatal = error?.stack || String(error);
          }
          console.log('HTTP_STATUS', response?.status?.() ?? null);
          console.log('SNAPSHOT', JSON.stringify(snapshot, null, 2));
          console.log('FATAL', fatal ?? 'NONE');
          console.log('PAGE_ERRORS', JSON.stringify(pageErrors, null, 2));
          console.log('CONSOLE_ERRORS', JSON.stringify(consoleErrors, null, 2));
          const ok = Boolean(response?.ok?.() && snapshot?.root && snapshot?.menu);
          await browser.close().catch(() => {});
          process.exit(ok ? 0 : 2);
          NODE
          status=$?
          set -e
          echo '--- SERVER LOG ---'
          cat /tmp/b2-cinematic-v6-server.log || true
          exit "$status"
