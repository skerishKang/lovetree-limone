name: V4 security lock refresh

on:
  push:
    branches:
      - fix/v4-security-deps-20260809

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: fix/v4-security-deps-20260809
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate lockfile from updated package manifest
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit regenerated lockfile if needed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix(security): refresh dependency lockfile"
          git push origin HEAD:fix/v4-security-deps-20260809

      - name: Install exact remediated lockfile
        run: npm ci

      - name: Production dependency audit gate
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Database schema check
        run: npm run db:check
