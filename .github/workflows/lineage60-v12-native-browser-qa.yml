name: Lineage60 V1.2 native browser QA evidence

# Evidence-only workflow for PR #232 (Track60 / Lineage 60 V1.2 native 3D Moment
# Cluster Explorer). It runs the dedicated native QA helper
# `qa/lineage-60-v12-native-browser-qa.mjs` (intentionally OUTSIDE the standard
# `tests/*.test.mjs` corpus so the shared A-track fail-closed browser inventory is
# NOT affected) and uploads the screenshots + nothing else as a GitHub artifact so
# the Web CTO can review them directly. It does NOT modify backend/API/DB/Auth, nor
# the shared Design Fidelity registry (Lineage60 matrix target stays
# SKIPPED_NOT_REGISTERED by design). Pure additive QA evidence gate.

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lineage60-native-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare Playwright runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run Lineage60 V1.2 native browser QA
        shell: bash
        run: |
          set -euo pipefail
          npm start > /tmp/lineage60-native-qa-server.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in {1..90}; do
            if curl --fail --silent --show-error "http://127.0.0.1:3000/design-lab/lineages/60/v1-2" > /dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/lineage60-native-qa-server.log
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/lineage60-native-qa-server.log
            exit 1
          fi

          mkdir -p qa/evidence/lineage-60
          LINEAGE60_QA_URL="http://127.0.0.1:3000" \
            node qa/lineage-60-v12-native-browser-qa.mjs

      - name: Upload Lineage60 native QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lineage60-v12-native-qa-evidence
          path: |
            qa/evidence/lineage-60/*.png
          if-no-files-found: warn
