name: B2 source-integrity generation diagnosis

on:
  push:
    branches:
      - ci/v4-b2-cinematic-v6-final-validation-20260808
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Inspect checkout
        shell: bash
        run: |
          set -euo pipefail
          echo '=== checkout status ==='
          git status --short
          for file in app/api/tree/import/route.ts tests/v4-source-integrity.test.mjs; do
            if [ -f "$file" ]; then echo "PRESENT $file"; else echo "MISSING $file"; fi
          done

      - name: Install dependencies
        run: npm ci

      - name: Inspect after npm ci
        shell: bash
        run: |
          set -euo pipefail
          echo '=== after npm ci ==='
          git status --short
          for file in app/api/tree/import/route.ts tests/v4-source-integrity.test.mjs; do
            if [ -f "$file" ]; then
              echo "PRESENT $file"
              nl -ba "$file" | sed -n '1,285p'
            else
              echo "MISSING $file"
            fi
          done

      - name: Build
        run: npm run build

      - name: Inspect after build
        shell: bash
        run: |
          set -euo pipefail
          echo '=== after build ==='
          git status --short
          for file in app/api/tree/import/route.ts tests/v4-source-integrity.test.mjs; do
            if [ -f "$file" ]; then
              echo "PRESENT $file"
              nl -ba "$file" | sed -n '1,285p'
            else
              echo "MISSING $file"
            fi
          done
          echo '=== new untracked files outside build output ==='
          git ls-files --others --exclude-standard | sed -n '1,240p'
