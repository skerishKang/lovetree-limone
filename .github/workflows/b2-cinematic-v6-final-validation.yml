name: B2 cinematic v6 final validation

on:
  push:
    branches:
      - ci/v4-b2-cinematic-v6-final-validation-20260808
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build test prerequisites
        run: npm run build

      - name: Prepare Playwright runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Cinematic v6 targeted browser tests
        shell: bash
        run: |
          set -euo pipefail
          npm start > /tmp/b2-targeted-server.log 2>&1 &
          server_pid=$!
          cleanup() {
            pkill -TERM -P "$server_pid" 2>/dev/null || true
            kill -TERM "$server_pid" 2>/dev/null || true
            sleep 1
            pkill -KILL -P "$server_pid" 2>/dev/null || true
            kill -KILL "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=0
          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/v4/cinematic > /dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/b2-targeted-server.log
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/b2-targeted-server.log
            exit 1
          fi
          timeout --signal=KILL 8m node --import tsx --test tests/v4-cinematic-v6.test.mjs

      - name: Full wildcard tests
        shell: bash
        run: |
          set -euo pipefail
          npm start > /tmp/b2-full-server.log 2>&1 &
          server_pid=$!
          cleanup() {
            pkill -TERM -P "$server_pid" 2>/dev/null || true
            kill -TERM "$server_pid" 2>/dev/null || true
            sleep 1
            pkill -KILL -P "$server_pid" 2>/dev/null || true
            kill -KILL "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=0
          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/v4/cinematic > /dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/b2-full-server.log
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/b2-full-server.log
            exit 1
          fi
          timeout --signal=KILL 20m node --import tsx --test 'tests/*.test.mjs'

      - name: Build
        run: npm run build

      - name: Database schema check
        run: npm run db:check
