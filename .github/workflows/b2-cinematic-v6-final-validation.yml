name: B2 cinematic v6 source-integrity diagnosis

on:
  push:
    branches:
      - ci/v4-b2-cinematic-v6-final-validation-20260808
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Print source integrity blocker
        shell: bash
        run: |
          set -euo pipefail
          echo '=== app/api/tree/import/route.ts ==='
          if [ -f app/api/tree/import/route.ts ]; then
            nl -ba app/api/tree/import/route.ts | sed -n '1,220p'
          else
            echo 'route.ts missing at checkout'
            find app -maxdepth 6 -type f -path '*tree*import*' -print || true
          fi
          echo '=== tests/v4-source-integrity.test.mjs relevant section ==='
          if [ -f tests/v4-source-integrity.test.mjs ]; then
            nl -ba tests/v4-source-integrity.test.mjs | sed -n '220,285p'
          else
            echo 'v4-source-integrity.test.mjs missing at checkout'
            find tests -maxdepth 2 -type f -iname '*integrity*' -print || true
          fi
