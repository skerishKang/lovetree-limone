name: PR150 Unit Failure Diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'ci/design-fidelity-validation-orchestration'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build test prerequisites
        run: npm run build

      - name: Prepare Playwright runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Reproduce A-track unit suite and expose failure annotation
        shell: bash
        run: |
          set -uo pipefail
          npm start > /tmp/pr150-diagnostic-server.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/v4 > /dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/pr150-diagnostic-server.log
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/pr150-diagnostic-server.log
            exit 1
          fi

          mapfile -t standard_tests < <(
            find tests -maxdepth 1 -type f -name '*.test.mjs' \
              ! -name 'lineage-53-v2-route-browser-qa.test.mjs' \
              -print | sort
          )
          if [ "${#standard_tests[@]}" -eq 0 ]; then
            echo "No standard tests discovered" >&2
            exit 1
          fi

          set +e
          node --import tsx --test "${standard_tests[@]}" > /tmp/pr150-unit.log 2>&1
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            echo "PR150_UNIT_DIAGNOSTIC_PASS"
            exit 0
          fi

          node <<'NODE'
          const fs = require('node:fs');
          const text = fs.readFileSync('/tmp/pr150-unit.log', 'utf8');
          const lines = text.split(/\r?\n/);
          const failIndexes = [];
          for (let i = 0; i < lines.length; i += 1) {
            if (/^\s*not ok\b/.test(lines[i]) || /ERR_ASSERTION|AssertionError|test failed/i.test(lines[i])) {
              failIndexes.push(i);
            }
          }
          const center = failIndexes.length ? failIndexes[0] : Math.max(0, lines.length - 120);
          const start = Math.max(0, center - 24);
          const end = Math.min(lines.length, center + 110);
          let snippet = lines.slice(start, end).join('\n').trim();
          if (!snippet) snippet = text.slice(-12000).trim();
          if (snippet.length > 12000) snippet = snippet.slice(0, 12000);

          const pathMatch = text.match(/(?:at\s+[^\n]*?|file:\s*)(tests\/[A-Za-z0-9._\/-]+\.test\.mjs)(?::(\d+))?(?::(\d+))?/);
          const notOk = lines.find((line) => /^\s*not ok\b/.test(line));
          const title = (notOk || 'PR150 unit failure').replace(/^\s*not ok\s*\d*\s*-?\s*/, '').slice(0, 200);
          const escape = (value) => value.replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A');

          const attrs = [`title=${escape(title)}`];
          if (pathMatch) {
            attrs.push(`file=${pathMatch[1]}`);
            if (pathMatch[2]) attrs.push(`line=${pathMatch[2]}`);
            if (pathMatch[3]) attrs.push(`col=${pathMatch[3]}`);
          }
          console.log(`::error ${attrs.join(',')}::${escape(snippet)}`);
          console.log('PR150_UNIT_DIAGNOSTIC_FAILURE');
          NODE

          exit "$status"
