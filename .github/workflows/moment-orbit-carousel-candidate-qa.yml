name: Moment Orbit Carousel candidate QA

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/design-lab/capabilities/moment-orbit-carousel/**"
      - "app/styles/moment-orbit-carousel-candidate.css"
      - "lib/moment-orbit-carousel-capability.ts"
      - "docs/product/capabilities/MOMENT_ORBIT_CAROUSEL_CAPABILITY_SOURCE.md"
      - "tests/moment-orbit-carousel-capability.test.mjs"
      - "tests/moment-orbit-carousel-browser-qa.mjs"
      - ".github/workflows/moment-orbit-carousel-candidate-qa.yml"

permissions:
  contents: write

jobs:
  candidate-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: One-time merge-forward latest main
        if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/moment-orbit-carousel-capability-candidate'
        shell: bash
        run: |
          set -euo pipefail
          branch="feat/moment-orbit-carousel-capability-candidate"
          git fetch --no-tags origin main "$branch"
          git checkout -B "$branch" "origin/$branch"
          latest_main="$(git rev-parse origin/main)"
          current_head="$(git rev-parse HEAD)"
          echo "RECONCILE_PRE_HEAD=$current_head"
          echo "RECONCILE_MAIN=$latest_main"
          if git merge-base --is-ancestor "$latest_main" "$current_head"; then
            echo "RECONCILE_ALREADY_CURRENT=true"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-ff --no-edit origin/main
          merged_head="$(git rev-parse HEAD)"
          echo "RECONCILE_POST_HEAD=$merged_head"
          git push origin "HEAD:$branch"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Static capability contracts
        run: node --import tsx --test tests/moment-orbit-carousel-capability.test.mjs

      - name: Prepare Playwright runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Actual-route browser QA
        shell: bash
        run: |
          set -euo pipefail
          npm start > /tmp/moment-orbit-carousel-server.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/design-lab/capabilities/moment-orbit-carousel > /dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/moment-orbit-carousel-server.log
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/moment-orbit-carousel-server.log
            exit 1
          fi

          node --import tsx --test tests/moment-orbit-carousel-browser-qa.mjs

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moment-orbit-carousel-browser-evidence
          path: |
            test-results/moment-orbit-carousel/*.png
            /tmp/moment-orbit-carousel-server.log
          if-no-files-found: warn
