name: Moment Orbit Carousel candidate QA

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/design-lab/capabilities/moment-orbit-carousel/**"
      - "app/styles/moment-orbit-carousel-candidate.css"
      - "lib/moment-orbit-carousel-capability.ts"
      - "docs/product/capabilities/MOMENT_ORBIT_CAROUSEL_CAPABILITY_SOURCE.md"
      - "tests/moment-orbit-carousel-capability.test.mjs"
      - "tests/moment-orbit-carousel-browser-qa.mjs"
      - "tests/moment-orbit-carousel-inspector-open-qa.mjs"
      - ".github/workflows/moment-orbit-carousel-candidate-qa.yml"

permissions:
  contents: read

jobs:
  candidate-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Static capability contracts
        run: node --import tsx --test tests/moment-orbit-carousel-capability.test.mjs

      - name: Prepare Playwright runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Actual-route browser QA
        shell: bash
        run: |
          set -euo pipefail
          npm start > /tmp/moment-orbit-carousel-server.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/design-lab/capabilities/moment-orbit-carousel > /dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/moment-orbit-carousel-server.log
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/moment-orbit-carousel-server.log
            exit 1
          fi

          node --import tsx --test tests/moment-orbit-carousel-browser-qa.mjs
          node --import tsx --test tests/moment-orbit-carousel-inspector-open-qa.mjs

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moment-orbit-carousel-browser-evidence
          path: |
            test-results/moment-orbit-carousel/*.png
            /tmp/moment-orbit-carousel-server.log
          if-no-files-found: warn
