<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LGPSM — Future Forward Fashion</title><style>
@import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Michroma&family=Orbitron:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
:root{
  --pad-x:clamp(1.25rem,4.5vw,5rem);--pad-y:clamp(1rem,3vh,4rem);--header-pt:clamp(1.25rem,2.5vh,2.5rem);
  --gap-nav:clamp(1rem,2.2vw,2.25rem);--logo:clamp(1.35rem,1.2vw + .9rem,2.1rem);--logo-deg:clamp(.65rem,.4vw + .45rem,.9rem);
  --nav:clamp(.65rem,.35vw + .5rem,.875rem);--headline:clamp(2.15rem,4.5vw + .75rem,5.25rem);--body:clamp(.7rem,.35vw + .55rem,.9rem);
  --micro:clamp(.55rem,.25vw + .45rem,.7rem);--btn-px:clamp(1.15rem,1.4vw,1.75rem);--btn-py:clamp(.6rem,.9vh,.85rem);
  --btn-gap:clamp(.75rem,1vw,1.1rem);--feature-pad:clamp(1rem,1.5vw,1.75rem);--feature-min:clamp(13rem,18vw,20rem);
  --globe:clamp(2.25rem,2.5vw + 1rem,3.25rem);--checker-w:clamp(2.75rem,4.5vw,6.5rem);--checker-h:clamp(1.35rem,2.2vw,3rem);
  --corner:clamp(.65rem,.4vw + .4rem,.95rem);--icon:clamp(1rem,.6vw + .7rem,1.35rem);--drawer-pad:clamp(1.25rem,2.5vw,2.25rem);
  --drawer-max:clamp(18rem,28vw,28rem);--section-gap:clamp(.75rem,1.5vh,1.5rem);--main-py:clamp(1.25rem,4vh,4rem)
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#fff;color:#000}
body{font-family:'Plus Jakarta Sans',sans-serif;-webkit-font-smoothing:antialiased}
::selection{background:#000;color:#fff}
button{font:inherit}
.page{min-height:100vh;background:#fff;color:#000;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.bg-desktop{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg-layer{position:absolute;inset:0;background-size:cover;background-position:center;background-repeat:no-repeat}
.grid-overlay{position:absolute;inset:0;opacity:.10}
.header{position:relative;z-index:20;padding-inline:var(--pad-x);padding-top:var(--header-pt);padding-bottom:var(--section-gap);display:flex;justify-content:space-between;align-items:flex-start}
.logo{border:0;background:transparent;color:#000;cursor:pointer;padding:0;display:flex;align-items:flex-start}
.logo-main{font-family:'Orbitron',sans-serif;font-size:var(--logo);font-weight:900;letter-spacing:.15em;line-height:1}
.logo-sub{font-family:'Plus Jakarta Sans',sans-serif;font-size:var(--micro);font-weight:600;letter-spacing:.2em;text-transform:uppercase;margin-top:.4rem;opacity:.6}
.logo-degree{font-size:var(--logo-deg);margin-left:.1rem;margin-top:-.15rem}
.logo:hover,.nav button:hover{opacity:.5}
.nav{display:flex;align-items:center;gap:var(--gap-nav);font-size:var(--nav);font-weight:500;letter-spacing:.2em;text-transform:uppercase}
.nav button{border:0;background:transparent;padding:0;cursor:pointer;color:#000}
.divider{color:#9ca3af}
.icon-btn{position:relative;display:grid;place-items:center}
.badge{position:absolute;right:-.65rem;top:-.55rem;background:#000;color:#fff;width:1.25rem;height:1.25rem;border-radius:50%;display:none;place-items:center;font-size:.6rem;letter-spacing:0}
.badge.show{display:grid}
.hero{position:relative;z-index:10;flex:1;padding-inline:var(--pad-x);padding-block:var(--main-py);display:flex;justify-content:space-between;gap:3rem;align-items:center}
.left{max-width:58rem}
.corner{width:var(--corner);height:var(--corner);display:block}
.headline{font-family:'Orbitron',sans-serif;font-size:var(--headline);font-weight:800;line-height:1.05;letter-spacing:.08em;text-transform:uppercase;margin:.7rem 0;max-width:13ch}
.headline .last{display:flex;align-items:flex-end;gap:.55rem;white-space:nowrap}
.checker,.path-matrix{width:var(--checker-w);height:var(--checker-h);transform:translateY(2px);flex:none}
.cta{margin-top:clamp(1.2rem,2.5vh,2.4rem);border:1px solid #9ca3af;border-radius:.375rem;background:transparent;color:#000;padding:var(--btn-py) var(--btn-px);text-transform:uppercase;letter-spacing:.18em;font-size:var(--body);font-weight:600;display:inline-flex;align-items:center;gap:var(--btn-gap);cursor:pointer;transition:.2s}
.cta:hover{background:#000;color:#fff;border-color:#000}
.cta svg{transition:transform .2s}.cta:hover svg{transform:translate(2px,-2px)}
.feature{align-self:flex-end;min-width:var(--feature-min);padding:var(--feature-pad);position:relative;display:flex;align-items:center;gap:1.2rem;margin-bottom:clamp(.25rem,2vh,2rem)}
.feature-corner{position:absolute;width:var(--corner);height:var(--corner)}
.tl{left:0;top:0}.tr{right:0;top:0}.bl{left:0;bottom:0}.br{right:0;bottom:0}
.globe{width:var(--globe);height:var(--globe);flex:none}
.tagline{font-size:var(--body);font-weight:600;letter-spacing:.18em;text-transform:uppercase;line-height:1.5}
.mobile-image{display:none;position:relative;z-index:10;margin:0 var(--pad-x) 1.5rem}
.mobile-image .img{aspect-ratio:4/5;background-size:cover;background-position:center;border:1px solid #e5e7eb}
.mobile-caption{margin-top:.5rem;font-size:var(--micro);letter-spacing:.16em;text-transform:uppercase;color:#6b7280}
.backdrop{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.2);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:.2s}
.backdrop.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;z-index:50;right:0;top:0;height:100vh;width:min(100%,var(--drawer-max));background:#fff;border-left:1px solid #d1d5db;padding:var(--drawer-pad);transform:translateX(100%);transition:transform .28s ease;display:flex;flex-direction:column}
.drawer.open{transform:translateX(0)}
.drawer-head{display:flex;justify-content:space-between;gap:1rem;align-items:center;padding-bottom:1.25rem;border-bottom:1px solid #e5e7eb}
.drawer-title{font-family:'Orbitron',sans-serif;font-size:clamp(1.1rem,2vw,1.6rem);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.close{width:2.6rem;height:2.6rem;border:1px solid #d1d5db;background:#fff;display:grid;place-items:center;cursor:pointer}
.drawer-sub{margin:1.25rem 0 .6rem;color:#6b7280;font-size:var(--micro);letter-spacing:.16em;text-transform:uppercase}
.drawer-content{overflow:auto;flex:1}
.row{padding:1.1rem 0;border-bottom:1px solid #e5e7eb}
.row-top{display:flex;justify-content:space-between;gap:1rem;align-items:flex-start}
.row-tag{font-size:var(--micro);color:#6b7280;letter-spacing:.14em;text-transform:uppercase}
.row-title{margin:.35rem 0;font-family:'Orbitron',sans-serif;font-weight:700;font-size:.95rem;line-height:1.25}
.row-meta{font-size:var(--micro);color:#6b7280;letter-spacing:.08em;text-transform:uppercase}
.row-desc{margin:.55rem 0 0;font-size:.78rem;line-height:1.55;color:#4b5563}
.mini{border:1px solid #9ca3af;background:#fff;padding:.45rem .65rem;font-size:var(--micro);font-weight:700;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
.mini:hover{background:#000;color:#fff;border-color:#000}
.drawer-foot{padding-top:1rem;border-top:1px solid #e5e7eb;text-align:center;color:#6b7280;font-size:var(--micro);letter-spacing:.13em;text-transform:uppercase}
.primary-full{width:100%;border:0;background:#000;color:#fff;padding:.9rem 1rem;text-transform:uppercase;letter-spacing:.15em;font-size:var(--body);font-weight:700;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.empty{min-height:45vh;display:grid;place-items:center;text-align:center;color:#4b5563}
.empty svg{margin:auto}.empty strong{display:block;color:#111;margin:.8rem 0 .35rem}
.toast{position:fixed;z-index:80;right:1.25rem;top:1.25rem;background:#000;color:#fff;padding:.85rem 1rem;display:flex;align-items:center;gap:.7rem;box-shadow:0 10px 30px rgba(0,0,0,.2);font-size:.78rem;transform:translateY(-1rem);opacity:0;pointer-events:none;transition:.22s}
.toast.show{transform:none;opacity:1}
@media(max-width:1023px){
  .bg-desktop{display:none}.hero{flex-direction:column;align-items:flex-start;justify-content:center;padding-bottom:1.25rem}.feature{align-self:stretch;margin:0}.mobile-image{display:block}.nav{gap:1rem}.nav .optional{display:none}.headline{max-width:12ch}
}
@media(min-width:640px) and (max-width:1023px){.mobile-image .img{aspect-ratio:16/9}}
@media(max-width:620px){.header{gap:1rem}.logo-main{letter-spacing:.08em}.nav{font-size:.58rem}.hero{padding-top:1rem}.headline .last{white-space:normal}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style></head>
<body><div class="page">
<div class="bg-desktop">
  <div class="bg-layer" id="bg1"></div><div class="bg-layer" id="bg2"></div>
  <svg class="grid-overlay" width="100%" height="100%"><defs><pattern id="gridPattern" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M 48 0 L 0 0 0 48" fill="none" stroke="#64748b" stroke-width=".6"/></pattern></defs><rect width="100%" height="100%" fill="url(#gridPattern)"/></svg>
</div>

<header class="header">
<button class="logo" id="logoBtn"><span class="logo-main">LGPSM</span><span class="logo-degree">˚</span></button>
<nav class="nav"><button data-open="shop">SHOP</button><button data-open="collections" class="optional">COLLECTIONS</button><button data-open="journal" class="optional">JOURNAL</button><span class="divider">|</span><button class="icon-btn" data-open="cart" aria-label="Shopping bag"><span id="bagIcon"></span><span class="badge" id="cartBadge">0</span></button></nav>
</header>
<main class="hero"><section class="left">
<svg class="corner" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M0 11.5V0.5H11.5"/></svg>
<h1 class="headline"><span>FUTURE</span><br><span>FORWARD</span><br><span class="last">FASHION 
<svg class="checker" viewBox="0 0 36 18" aria-hidden="true">
<g fill="currentColor">
<rect x="0" y="0" width="3.8" height="3.8"/><rect x="7.6" y="0" width="3.8" height="3.8"/><rect x="15.2" y="0" width="3.8" height="3.8"/><rect x="22.8" y="0" width="3.8" height="3.8"/>
<rect x="2.25" y="4.5" width="3.8" height="3.8"/><rect x="9.85" y="4.5" width="3.8" height="3.8"/><rect x="17.45" y="4.5" width="3.8" height="3.8"/><rect x="25.05" y="4.5" width="3.8" height="3.8"/>
<rect x="0" y="9" width="3.8" height="3.8"/><rect x="7.6" y="9" width="3.8" height="3.8"/><rect x="15.2" y="9" width="3.8" height="3.8"/><rect x="22.8" y="9" width="3.8" height="3.8"/>
<rect x="2.25" y="13.5" width="3.8" height="3.8"/><rect x="9.85" y="13.5" width="3.8" height="3.8"/><rect x="17.45" y="13.5" width="3.8" height="3.8"/><rect x="25.05" y="13.5" width="3.8" height="3.8"/>
</g></svg>
</span></h1>
<svg class="corner" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M0 0.5V11.5H11.5"/></svg>
<button class="cta" data-open="shop">SHOP NOW <span id="arrowIcon"></span></button>
</section>
<aside class="feature"><svg class="feature-corner tl" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M0 11.5V0.5H11.5"/></svg><svg class="feature-corner tr" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M0.5 0.5H11.5V11.5"/></svg><svg class="feature-corner bl" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M0 0.5V11.5H11.5"/></svg><svg class="feature-corner br" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M0.5 11.5H11.5V0.5"/></svg>
<svg class="globe" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true">
<circle cx="32" cy="32" r="28"/><path d="M4 32h56"/><ellipse cx="32" cy="32" rx="28" ry="12"/><ellipse cx="32" cy="32" rx="28" ry="20"/>
<path d="M32 4v56"/><ellipse cx="32" cy="32" rx="12" ry="28"/><ellipse cx="32" cy="32" rx="20" ry="28"/>
</svg>
<div class="tagline">BEYOND TRENDS.<br>BUILT FOR TOMORROW.</div></aside></main>
<section class="mobile-image"><div class="img" data-mobile-bg></div></section>
</div>
<div class="backdrop" id="backdrop"></div><aside class="drawer" id="drawer"><div class="drawer-head"><div class="drawer-title" id="drawerTitle"></div><button class="close" id="closeBtn"></button></div><div class="drawer-sub" id="drawerSub"></div><div class="drawer-content" id="drawerContent"></div><div class="drawer-foot" id="drawerFoot">LGPSM © 2026 — FUTURE FORWARD FASHION</div></aside><div class="toast" id="toast"></div>
<script>
const icons={
arrow:`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M7 17 17 7M7 7h10v10"/></svg>`,
x:`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M18 6 6 18M6 6l12 12"/></svg>`,
bag:`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18M16 10a4 4 0 0 1-8 0"/></svg>`,
heart:`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78Z"/></svg>`,
chev:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m9 18 6-6-6-6"/></svg>`,
check:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="1.8"><path d="m20 6-11 11-5-5"/></svg>`
}

document.getElementById('bagIcon').innerHTML=icons.bag;document.getElementById('arrowIcon').innerHTML=icons.arrow;document.getElementById('closeBtn').innerHTML=icons.x;
const items=[
{tag:'LIMITED EDITION',title:'CYBER-TEX OVERCOAT',price:850},{tag:'NEW DROP',title:'GEO-MESH TECH HOODIE',price:320},{tag:'IN STOCK',title:'ORBITAL TAPERED TROUSERS',price:290},{tag:'PRE-ORDER',title:'MODULAR ALL-WEATHER VEST',price:410}
]; let cart=[];
const drawers={
shop:{title:'Catalog',sub:'Featured Garments',render:()=>items.map((x,i)=>`<div class="row"><div class="row-top"><div><div class="row-tag">${x.tag}</div><div class="row-title">${x.title}</div><div class="row-meta">${x.price.toLocaleString('en-US',{style:'currency',currency:'USD'})}</div></div><button class="mini" onclick="addItem(${i})">ADD</button></div></div>`).join('')},
collections:{title:'Archive 2026',sub:'Season Lineup',render:()=>[
['SERIES 01 — SYNTHETIC HORIZONS','Ultra-durable weather-sealed fabrics with minimalist silhouette architecture.'],
['SERIES 02 — KINETIC FORM','Ergonomic streetwear designed for maximum mobility and temperature equilibrium.'],
['SERIES 03 — MONOCHROME ZERO','Pure black and white structural tailoring crafted from 100% recycled polymers.']
].map(x=>`<div class="row"><div class="row-title">${x[0]}</div><div class="row-desc">${x[1]}</div></div>`).join('')},
journal:{title:'Editorial',sub:'Latest Dispatches',render:()=>[
['AUG 2026','THE ARCHITECTURE OF NEXT-GEN TEXTILES','4 MIN READ'],['JUL 2026','CIRCULAR DESIGN IN HIGH-END APPAREL','6 MIN READ'],['JUN 2026','MINIMALISM AS A FUNCTIONAL STATEMENT','3 MIN READ']
].map(x=>`<div class="row"><div class="row-tag">${x[0]}</div><div class="row-title">${x[1]}</div><div class="row-meta">${x[2]}</div></div>`).join('')},
cart:{title:'Shopping Bag',sub:'',render:()=>renderCart()}
};
function showToast(msg){const t=document.getElementById('toast');t.innerHTML=icons.check+`<span>${msg}</span>`;t.classList.add('show');clearTimeout(window.__tt);window.__tt=setTimeout(()=>t.classList.remove('show'),3000)}
function updateBadge(){const b=document.getElementById('cartBadge');b.textContent=cart.length;b.classList.toggle('show',cart.length>0)}
function addItem(i){cart.push(items[i]);updateBadge();showToast(`Added "${items[i].title}" to your shopping bag.`)}
function removeItem(i){cart.splice(i,1);updateBadge();openDrawer('cart')}
function renderCart(){if(!cart.length)return `<div class="empty"><div>${icons.bag}<strong>Your shopping bag is empty.</strong></div></div>`;
return cart.map((x,i)=>`<div class="row"><div class="row-top"><div><div class="row-title">${x.title}</div><div class="row-meta">${x.price.toLocaleString('en-US',{style:'currency',currency:'USD'})}</div></div><button class="mini" onclick="removeItem(${i})">Remove</button></div></div>`).join('')+`<div style="padding-top:1rem"><button class="primary-full" onclick="checkout()">CHECKOUT NOW ${icons.chev}</button></div>`}
function checkout(){cart=[];updateBadge();closeDrawer();showToast('Order submitted successfully!')}
function openDrawer(key){const d=drawers[key];document.getElementById('drawerTitle').textContent=d.title;document.getElementById('drawerSub').textContent=d.sub;document.getElementById('drawerContent').innerHTML=d.render();document.getElementById('drawerFoot').style.display=key==='cart'?'none':'block';document.getElementById('backdrop').classList.add('open');document.getElementById('drawer').classList.add('open');}
function closeDrawer(){document.getElementById('backdrop').classList.remove('open');document.getElementById('drawer').classList.remove('open')}
document.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>openDrawer(b.dataset.open)));document.getElementById('closeBtn').onclick=closeDrawer;document.getElementById('backdrop').onclick=closeDrawer;document.getElementById('logoBtn').onclick=closeDrawer;addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});

const BG1='https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260802_074534_f0d9d476-3f86-4c67-9b12-dfc63d99da41.png&w=1920&q=85',BG2='https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260802_075145_1b557479-775b-43af-8270-f45d79d97d5a.png&w=1920&q=85';
const base=document.getElementById('bg1'),reveal=document.getElementById('bg2'),gridPattern=document.getElementById('gridPattern');
base.style.backgroundImage=`url("${BG1}")`; reveal.style.backgroundImage=`url("${BG2}")`;
document.querySelectorAll('[data-mobile-bg]').forEach(el=>el.style.backgroundImage=`url("${BG1}")`);
const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');
let mouse={x:innerWidth*.55,y:innerHeight*.45},smooth={...mouse},gridOffset={x:0,y:0};
function resizeMask(){canvas.width=innerWidth;canvas.height=innerHeight}
addEventListener('resize',resizeMask); resizeMask();
addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});
function frame(){
 if(innerWidth>=1024){
   smooth.x+=(mouse.x-smooth.x)*.1;smooth.y+=(mouse.y-smooth.y)*.1;
   ctx.clearRect(0,0,canvas.width,canvas.height);
   const r=Math.round(Math.min(420,Math.max(160,innerWidth*.16)));
   const g=ctx.createRadialGradient(smooth.x,smooth.y,0,smooth.x,smooth.y,r);
   [[0,'rgba(255,255,255,1)'],[.4,'rgba(255,255,255,1)'],[.6,'rgba(255,255,255,.75)'],[.75,'rgba(255,255,255,.4)'],[.88,'rgba(255,255,255,.12)'],[1,'rgba(255,255,255,0)']].forEach(s=>g.addColorStop(s[0],s[1]));
   ctx.fillStyle=g;ctx.fillRect(0,0,canvas.width,canvas.height);
   const data=canvas.toDataURL(); reveal.style.webkitMaskImage=`url("${data}")`; reveal.style.maskImage=`url("${data}")`;reveal.style.webkitMaskSize='100% 100%';reveal.style.maskSize='100% 100%';
   const cx=smooth.x/innerWidth-.5,cy=smooth.y/innerHeight-.5;
   gridOffset.x+=(cx*16-gridOffset.x)*.06;gridOffset.y+=(cy*16-gridOffset.y)*.06;
   if(gridPattern){gridPattern.setAttribute('x',gridOffset.x);gridPattern.setAttribute('y',gridOffset.y)}
 }
 requestAnimationFrame(frame)
}
if(!matchMedia('(prefers-reduced-motion: reduce)').matches) frame();

</script></body></html>
