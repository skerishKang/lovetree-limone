function portalAnchor(path,label='OPEN'){
 return `<a class="mini" href="${path}" target="_blank" rel="noopener noreferrer">${label}</a>`;
}

function sectionPortal(key){

 return `<div class="portal-banner"><div class="portal-banner-copy">RELATED LOVETREE TEMPLATE<br>${t.label.replace('OPEN ','')}</div>${portalAnchor(t.path,t.label)}</div>`;
}

function showToast(msg){const t=document.getElementById('toast');t.innerHTML=icons.check+`<span>${msg}</span>`;t.classList.add('show');clearTimeout(window.__tt);window.__tt=setTimeout(()=>t.classList.remove('show'),3000)}
function updateBadge(){const b=document.getElementById('treeBadge');b.textContent=planted.length;b.classList.toggle('show',planted.length>0)}
function plant(i){if(!planted.includes(i))planted.push(i);updateBadge();showToast(`Planted "${moments[i].title}" in My Tree.`)}
function removePlant(i){planted.splice(i,1);updateBadge();openDrawer('tree')}
function renderTree(){if(!planted.length)return `<div class="empty"><div>${icons.heart}<strong>No moments planted yet.</strong><div>Plant the moments that changed how you felt.</div></div></div>`;

function openPortal(path){
 if(!path)return;
 const a=document.createElement('a');
 a.href=path;
 a.target='_blank';
 a.rel='noopener noreferrer';
 document.body.appendChild(a);
 a.click();
 a.remove();
}
function renderWorks(){
 const list=document.getElementById('worksList');
 list.innerHTML=worksCatalog.map(item=>item.current?`
   <div class="work-row current">
     <div class="work-num">${item.code}</div>
     <div class="work-name">${item.name}</div>
     <div class="work-sub">${item.sub}</div>
     <div class="work-action">CURRENT</div>
   </div>`:`
   <a class="work-row" href="${item.path}" target="_blank" rel="noopener noreferrer">
     <div class="work-num">${item.code}</div>
     <div class="work-name">${item.name}</div>
     <div class="work-sub">${item.sub}</div>
     <div class="work-action">OPEN WORK</div>
   </a>`).join('');
}
function hideDrawerVisual(){
 document.getElementById('backdrop').classList.remove('open');
 document.getElementById('drawer').classList.remove('open');
}
function hideWorksVisual(){
 const o=document.getElementById('worksOverlay');
 o.classList.remove('open');o.setAttribute('aria-hidden','true');
 document.body.style.overflow='';
}
function setLayerHistory(layer,key){
 const next={track70Layer:layer,key:key||null};
 const hash=layer==='drawer'?`#${key}`:'#works';
 if(history.state&&history.state.track70Layer){
   history.replaceState(next,'',hash);
 }else{
   history.pushState(next,'',hash);
 }
}
function openWorks(pushHistory=true){
 hideDrawerVisual();
 renderWorks();
 const o=document.getElementById('worksOverlay');
 o.classList.add('open');o.setAttribute('aria-hidden','false');
 document.body.style.overflow='hidden';
 if(pushHistory)setLayerHistory('works');
}
function closeWorks(requestHistory=true){
 if(requestHistory&&history.state&&history.state.track70Layer==='works'){
   history.back();return;
 }
 hideWorksVisual();
}
function openDrawer(key,pushHistory=true){
 hideWorksVisual();
 const d=drawers[key];
 document.getElementById('drawerTitle').textContent=d.title;
 document.getElementById('drawerSub').textContent=d.sub;
 document.getElementById('drawerContent').innerHTML=d.render();
 document.getElementById('drawerFoot').style.display=key==='tree'?'none':'block';
 document.getElementById('backdrop').classList.add('open');
 document.getElementById('drawer').classList.add('open');
 if(pushHistory)setLayerHistory('drawer',key);
}
function closeDrawer(requestHistory=true){
 if(requestHistory&&history.state&&history.state.track70Layer==='drawer'){
   history.back();return;
 }
 hideDrawerVisual();
}
function restoreLayerFromHistory(state){
 hideDrawerVisual();hideWorksVisual();
 if(!state||!state.track70Layer)return;
 if(state.track70Layer==='drawer'&&drawers[state.key])openDrawer(state.key,false);
 if(state.track70Layer==='works')openWorks(false);
}
document.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>openDrawer(b.dataset.open)));
document.getElementById('closeBtn').onclick=()=>closeDrawer(true);

addEventListener('popstate',e=>restoreLayerFromHistory(e.state));

const base=document.getElementById('bg1'),reveal=document.getElementById('bg2'),gridPattern=document.getElementById('gridPattern');
base.style.backgroundImage=`url("${BG1}")`; reveal.style.backgroundImage=`url("${BG2}")`;
document.querySelectorAll('[data-mobile-bg]').forEach(el=>el.style.backgroundImage=`url("${BG1}")`);
const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');
let mouse={x:innerWidth*.55,y:innerHeight*.45},smooth={...mouse},gridOffset={x:0,y:0};
function resizeMask(){canvas.width=innerWidth;canvas.height=innerHeight}
addEventListener('resize',resizeMask); resizeMask();
addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});
function frame(){
 if(innerWidth>=1024){
   smooth.x+=(mouse.x-smooth.x)*.1;smooth.y+=(mouse.y-smooth.y)*.1;
   ctx.clearRect(0,0,canvas.width,canvas.height);
   const r=Math.round(Math.min(420,Math.max(160,innerWidth*.16)));
   const g=ctx.createRadialGradient(smooth.x,smooth.y,0,smooth.x,smooth.y,r);
   [[0,'rgba(255,255,255,1)'],[.4,'rgba(255,255,255,1)'],[.6,'rgba(255,255,255,.75)'],[.75,'rgba(255,255,255,.4)'],[.88,'rgba(255,255,255,.12)'],[1,'rgba(255,255,255,0)']].forEach(s=>g.addColorStop(s[0],s[1]));
   ctx.fillStyle=g;ctx.fillRect(0,0,canvas.width,canvas.height);
   const data=canvas.toDataURL(); reveal.style.webkitMaskImage=`url("${data}")`; reveal.style.maskImage=`url("${data}")`;reveal.style.webkitMaskSize='100% 100%';reveal.style.maskSize='100% 100%';
   const cx=smooth.x/innerWidth-.5,cy=smooth.y/innerHeight-.5;
   gridOffset.x+=(cx*16-gridOffset.x)*.06;gridOffset.y+=(cy*16-gridOffset.y)*.06;
   if(gridPattern){gridPattern.setAttribute('x',gridOffset.x);gridPattern.setAttribute('y',gridOffset.y)}
 }
 requestAnimationFrame(frame)
}
if(!matchMedia('(prefers-reduced-motion: reduce)').matches) frame();
