<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>LoveTree · GATE A5 · Solid Jelly Lens</title>
<style>
:root{--ink:#050505;--paper:#fff}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
.stage{position:relative;width:100vw;height:100vh;background:#fff;overflow:hidden}
#scene{position:absolute;inset:0;width:100%;height:100%;z-index:1}
.brand{position:absolute;left:3.0vw;top:2.6vh;font-family:Georgia,'Times New Roman',serif;font-size:2.72vw;line-height:1;letter-spacing:-.055em;z-index:9}
.intro{position:absolute;left:3.0vw;top:39.0vh;width:34vw;font-weight:800;font-size:1.56vw;line-height:.94;letter-spacing:-.062em;z-index:9}
.intro span{display:block}
.cta{position:absolute;left:3.0vw;bottom:5.1vh;width:7.8vw;height:7.8vw;min-width:104px;min-height:104px;border-radius:50%;background:#050505;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;font-size:.80vw;font-weight:800;letter-spacing:-.03em;z-index:9}
.gate{position:absolute;left:3vw;bottom:1.1vh;font-size:.52vw;letter-spacing:.17em;color:#8a8a8a;z-index:9;text-transform:uppercase}
</style>
</head>
<body>
<div class="stage">
  <canvas id="scene"></canvas>
  <div class="brand">LoveTree</div>
  <div class="intro"><span>Moments that moved your heart,</span><span>connected into the path that made you care,</span><span>and eventually made you a fan.</span></div>
  <div class="cta">MY<br>TREE</div>
  <div class="gate">GATE A5 · SOLID JELLY LENS · STATIC ONLY · NO GATE B/C</div>
</div>
<script>
(() => {
  const canvas=document.getElementById('scene');
  const DPR=Math.min(devicePixelRatio||1,1.5);
  const gl=canvas.getContext('webgl2',{alpha:false,antialias:true,premultipliedAlpha:false});
  if(!gl) throw new Error('WebGL2 required');
  const bg=document.createElement('canvas'); const bx=bg.getContext('2d');
  function drawBackground(){
    bg.width=Math.floor(innerWidth*DPR); bg.height=Math.floor(innerHeight*DPR);
    bx.setTransform(DPR,0,0,DPR,0,0); bx.fillStyle='#fff';bx.fillRect(0,0,innerWidth,innerHeight);
    bx.fillStyle='#050505';bx.textBaseline='top';
    bx.font=`900 ${innerWidth*.121}px Impact, Arial Black, Arial`; bx.fillText('PATH',innerWidth*.425,-innerHeight*.105);
    bx.font=`900 ${innerWidth*.087}px Impact, Arial Black, Arial`;
    const lh=innerWidth*.087*.74, x1=innerWidth*.425, x2=innerWidth*.535, y1=innerHeight*.268, y2=innerHeight*.235;
    [...'MOMENT'].forEach((t,i)=>bx.fillText(t,x1,y1+i*lh));
    [...'MEMORY'].forEach((t,i)=>bx.fillText(t,x2,y2+i*lh));
    bx.save();bx.translate(innerWidth*.958,innerHeight*.17);bx.rotate(Math.PI/2);bx.font=`900 ${innerWidth*.089}px Impact, Arial Black, Arial`;bx.fillText('LOVE',0,0);bx.restore();
    bx.beginPath();bx.arc(innerWidth*.434,innerHeight*.225,innerWidth*.016,0,Math.PI*2);bx.fill();
  }
  function resize(){canvas.width=Math.floor(innerWidth*DPR);canvas.height=Math.floor(innerHeight*DPR);canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';gl.viewport(0,0,canvas.width,canvas.height);drawBackground();}
  resize();

  const quadVS=`#version 300 es
  precision highp float; layout(location=0) in vec2 aPos; out vec2 vUv;
  uniform vec2 uCenter; uniform vec2 uScale; uniform float uRot;
  void main(){vUv=aPos; float c=cos(uRot),s=sin(uRot);vec2 p=vec2(c*aPos.x-s*aPos.y,s*aPos.x+c*aPos.y)*uScale+uCenter;gl_Position=vec4(p,0,1);}`;
  const bgFS=`#version 300 es
  precision highp float;in vec2 vUv;out vec4 o;uniform sampler2D uBg;
  void main(){o=texture(uBg,vUv*.5+.5);}`;
  const lensFS=`#version 300 es
  precision highp float; in vec2 vUv; out vec4 o;
  uniform sampler2D uBg; uniform sampler2D uLabel; uniform vec2 uResolution;
  uniform float uSeed; uniform float uRef; uniform float uLabelAng;
  uniform vec4 uShape; /* x ellipseY, y squash, z bulgeA, w bulgeB */
  uniform vec4 uDark;  /* angle1 angle2 strength width */
  uniform vec4 uColor; /* blueAngle amberAngle redAngle intensity */
  const float PI=3.14159265359; const float TAU=6.28318530718;
  float ad(float a,float b){float d=abs(a-b);return min(d,TAU-d);} float ga(float a,float b,float w){float d=ad(a,b);return exp(-(d*d)/(w*w));}
  float field(vec2 p){
    float a=atan(p.y,p.x);if(a<0.)a+=TAU;
    float yScale=uShape.x;
    vec2 q=vec2(p.x,p.y*yScale);
    float r=length(q);
    float boundary=1.0 + .048*sin(2.0*a+uSeed*.91)+.025*sin(3.0*a+uSeed*1.41)
      +uShape.z*ga(a,fract(.13+uSeed*.073)*TAU,.40)
      -uShape.w*ga(a,fract(.62+uSeed*.051)*TAU,.34);
    boundary*=1.0-uShape.y*.035*cos(a+uSeed);
    return boundary-r;
  }
  vec2 gradField(vec2 p){float e=.006;return normalize(vec2(field(p+vec2(e,0))-field(p-vec2(e,0)),field(p+vec2(0,e))-field(p-vec2(0,e)))+vec2(1e-6));}
  void main(){
    float d=field(vUv);float aa=max(fwidth(d)*1.2,.0025);float mask=smoothstep(-aa,aa,d);if(mask<.002)discard;
    vec2 n=gradField(vUv);float a=atan(vUv.y,vUv.x);if(a<0.)a+=TAU;
    float edge=1.0-smoothstep(.0,.24,d);float center=1.0-edge;
    float bulge=.62*ga(a,fract(.18+uSeed*.097)*TAU,.42)+.42*ga(a,fract(.70-uSeed*.063)*TAU,.34);
    float power=.14*center+.80*edge+.30*bulge;
    vec2 suv=vec2(gl_FragCoord.x/uResolution.x,gl_FragCoord.y/uResolution.y);
    vec2 off=n*(.006+.031*power)*uRef + vec2(-n.y,n.x)*.0035*sin(a*2.0+uSeed);
    vec3 orig=texture(uBg,suv).rgb;vec3 refr;
    refr.r=texture(uBg,clamp(suv+off*1.07,.001,.999)).r;
    refr.g=texture(uBg,clamp(suv+off,.001,.999)).g;
    refr.b=texture(uBg,clamp(suv+off*.93,.001,.999)).b;
    float centerLens=.58+.22*bulge;vec3 col=mix(orig,refr,centerLens+.20*edge);
    // almost colorless body; visible chiefly through distortion
    col=mix(col,vec3(1.0),.014*center+.055*edge);
    float neutralRim=edge*(.10+.09*(.5+.5*sin(a*2.0+uSeed)));
    col=mix(col,vec3(.12,.13,.14),neutralRim);
    // dark internal reflection only at selected curved locations
    float dark=(ga(a,uDark.x,uDark.w)+.72*ga(a,uDark.y,uDark.w*.82))*edge*uDark.z;
    col=mix(col,vec3(.002,.003,.006),clamp(dark,0.,.88));
    // local optical highlights and caustics, edge-biased
    float spec=(ga(a,fract(.27+uSeed*.091)*TAU,.18)+.55*ga(a,fract(.81-uSeed*.043)*TAU,.14))*edge;
    col+=vec3(1.0)*spec*.78;
    float blue=ga(a,uColor.x,.13)*edge, amber=ga(a,uColor.y,.14)*edge, red=ga(a,uColor.z,.10)*edge;
    col+=vec3(.00,.16,1.0)*blue*uColor.w; col+=vec3(1.0,.22,.0)*amber*uColor.w*.95; col+=vec3(1.0,.0,.025)*red*uColor.w*.55;
    // surface keyword; small and subordinate to the lens silhouette
    float da=atan(sin(a-uLabelAng),cos(a-uLabelAng));
    float radial=clamp(length(vec2(vUv.x,vUv.y*uShape.x)),0.,1.);vec2 luv=vec2(da/.88+.5,(radial-.18)/.82);
    vec4 lab=texture(uLabel,clamp(luv,0.,1.));float label=lab.a*step(-.44,da)*step(da,.44)*smoothstep(.14,.34,radial)*mask;
    col=mix(col,vec3(.01),label*.92);
    o=vec4(clamp(col,0.,1.),1.0);
  }`;
  function sh(t,s){const q=gl.createShader(t);gl.shaderSource(q,s);gl.compileShader(q);if(!gl.getShaderParameter(q,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(q));return q}
  function prog(fs){const p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,quadVS));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));return p}
  const pBg=prog(bgFS),pLens=prog(lensFS);
  const vao=gl.createVertexArray();gl.bindVertexArray(vao);const vb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,vb);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
  function tex(source,flip=false){const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,flip);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,source);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);return t}
  const bgTex=tex(bg,true);
  const words=['FIRST','MOMENTS','CONNECTION','REPLAY','MY TREE','RETURN'];
  function wordTex(w){const c=document.createElement('canvas');c.width=1024;c.height=256;const x=c.getContext('2d');x.clearRect(0,0,1024,256);x.fillStyle='#000';x.textAlign='center';x.textBaseline='middle';x.font='900 italic 130px Arial';x.translate(512,128);x.transform(1,0,-.07,1,0,0);x.fillText(w,0,0);return tex(c)}
  const labels=words.map(wordTex);
  // Reference-disciplined six independent filled jelly lenses; each has a solid transparent center.
  const lenses=[
    {c:[.28,.91],s:[.245,.155],r:-.22,seed:.3,shape:[1.04,.20,.055,.035],ref:1.12,label:4.78,dark:[3.72,5.55,.72,.18],color:[4.84,1.08,5.82,1.35]},
    {c:[.24,.63],s:[.235,.145],r:.08,seed:1.1,shape:[1.08,.10,.050,.030],ref:1.16,label:4.68,dark:[2.98,5.70,.76,.18],color:[2.73,5.42,.55,1.25]},
    {c:[.23,.38],s:[.210,.130],r:-.10,seed:2.0,shape:[1.02,.17,.060,.028],ref:1.12,label:4.83,dark:[4.60,1.80,.75,.17],color:[4.32,1.40,5.96,1.30]},
    {c:[.29,.12],s:[.220,.142],r:-.27,seed:2.9,shape:[1.07,.12,.048,.034],ref:1.20,label:4.88,dark:[2.68,5.12,.78,.18],color:[2.50,5.80,.34,1.32]},
    {c:[.36,-.18],s:[.202,.145],r:.17,seed:3.8,shape:[1.05,.15,.056,.032],ref:1.10,label:4.76,dark:[5.35,2.10,.74,.18],color:[5.03,2.46,.96,1.28]},
    {c:[.49,-.48],s:[.180,.150],r:.68,seed:4.7,shape:[1.10,.08,.050,.030],ref:1.15,label:4.88,dark:[1.35,4.38,.75,.17],color:[1.05,4.72,5.48,1.24]}
  ];
  function U(p,n){return gl.getUniformLocation(p,n)}
  const L={center:U(pLens,'uCenter'),scale:U(pLens,'uScale'),rot:U(pLens,'uRot'),bg:U(pLens,'uBg'),labelTex:U(pLens,'uLabel'),res:U(pLens,'uResolution'),seed:U(pLens,'uSeed'),ref:U(pLens,'uRef'),label:U(pLens,'uLabelAng'),shape:U(pLens,'uShape'),dark:U(pLens,'uDark'),color:U(pLens,'uColor')};
  function render(){
    gl.disable(gl.BLEND);gl.clearColor(1,1,1,1);gl.clear(gl.COLOR_BUFFER_BIT);gl.bindVertexArray(vao);
    gl.useProgram(pBg);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,bgTex);gl.uniform1i(U(pBg,'uBg'),0);gl.uniform2f(U(pBg,'uCenter'),0,0);gl.uniform2f(U(pBg,'uScale'),1,1);gl.uniform1f(U(pBg,'uRot'),0);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
    gl.useProgram(pLens);gl.uniform2f(L.res,canvas.width,canvas.height);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,bgTex);gl.uniform1i(L.bg,0);
    lenses.forEach((o,i)=>{gl.uniform2f(L.center,...o.c);gl.uniform2f(L.scale,...o.s);gl.uniform1f(L.rot,o.r);gl.uniform1f(L.seed,o.seed);gl.uniform1f(L.ref,o.ref);gl.uniform1f(L.label,o.label);gl.uniform4f(L.shape,...o.shape);gl.uniform4f(L.dark,...o.dark);gl.uniform4f(L.color,...o.color);gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,labels[i]);gl.uniform1i(L.labelTex,1);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);});
  }
  render();window.__A5_LENSES=lenses;
})();
</script>
</body>
</html>
