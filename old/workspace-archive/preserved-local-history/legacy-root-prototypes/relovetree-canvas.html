function renderAll(){renderTrees();renderCanvas();$('#page-title').innerHTML=`${esc(current.name)}<span>러브트리</span>`;$('#page-count').textContent=current.count;renderDetail();$('#love-score').textContent=current.love+'%';$('#charm-score').textContent=current.charm+'%';$('#flutter-score').textContent=current.flutter+'%';$('#love-line').style.width=current.love+'%';$('#charm-line').style.width=current.charm+'%';$('#flutter-line').style.width=current.flutter+'%'}function toast(s){const t=$('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2300)}function addMemory(){const url=prompt('YouTube 링크를 붙여넣어 주세요');if(!url)return;if(!idOf(url)){toast('YouTube 링크를 확인해 주세요');return}const memo=prompt('이 순간의 감상을 한 줄로 남겨주세요')||'내가 남긴 새로운 순간';const time=prompt('영상 시간(예: 1:30)을 적어주세요')||'지금';added.unshift(['내 기록',memo,'새 기록',url,time,'내 감상']);current.count+=1;selected=current.memories.length-1;renderAll();toast('새로운 기억이 연결됐어요')}$('#add-top').addEventListener('click',addMemory);$('#right-save').addEventListener('click',addMemory);$('#save-btn').addEventListener('click',()=>toast('이 순간이 내 러브트리에 저장됐어요'));renderAll();
