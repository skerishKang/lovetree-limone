<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f2f3ef">
  <title>LoveTree — Rotating Memory Index</title>
  <style>
    :root{--paper:#f2f3ef;--ink:#090a09;--muted:rgba(9,10,9,.46);--line:rgba(9,10,9,.14);--red:#b5111d;--font:Inter,Pretendard,SUIT,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",Arial,sans-serif}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--font)}body{user-select:none;-webkit-user-select:none}button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}.stage{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:grab;background:radial-gradient(circle at 50% 44%,#fff 0,#f4f5f1 46%,#eceee9 100%)}.stage.dragging{cursor:grabbing}.stage:after{content:"";position:absolute;left:50%;bottom:8%;width:min(510px,62vw);height:8%;transform:translateX(-50%);border-radius:50%;background:rgba(0,0,0,.13);filter:blur(26px);pointer-events:none}
    .scene{position:absolute;inset:0;display:grid;place-items:center;perspective:1600px;perspective-origin:50% 46%;transform-style:preserve-3d}.deck{position:relative;width:1px;height:1px;transform-style:preserve-3d;margin-top:-2vh}.panel{position:absolute;left:0;top:0;width:clamp(190px,21vw,285px);height:clamp(330px,38vw,455px);margin-left:calc(clamp(190px,21vw,285px)/-2);margin-top:calc(clamp(330px,38vw,455px)/-2);transform-style:preserve-3d;will-change:transform;outline:0}.face{position:absolute;inset:0;border-radius:30px;overflow:hidden;backface-visibility:hidden;background:#121313;box-shadow:0 26px 65px rgba(0,0,0,.16),inset 0 0 0 1px rgba(255,255,255,.16)}.face.back{transform:rotateY(180deg);background:#080908;color:#f7f7f3;padding:25px;display:flex;flex-direction:column;justify-content:space-between}.face img,.face video{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover;filter:contrast(1.04) saturate(.88)}.face video{opacity:0}.face:after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;border:1px solid rgba(255,255,255,.16);background:linear-gradient(180deg,rgba(255,255,255,.12),transparent 12%,transparent 72%,rgba(0,0,0,.3))}.panel:hover .face,.panel.selected .face{box-shadow:0 35px 88px rgba(0,0,0,.25),0 0 0 2px rgba(0,0,0,.52)}.panel-copy{position:absolute;z-index:3;left:20px;right:18px;bottom:18px;color:#fff;text-shadow:0 2px 15px rgba(0,0,0,.72)}.panel-copy small{display:block;margin-bottom:7px;font-size:6px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}.panel-copy h2{margin:0;font-size:clamp(25px,2.8vw,40px);line-height:.9;letter-spacing:-.065em;font-weight:720}.back-index{font-size:7px;letter-spacing:.17em;text-transform:uppercase;color:rgba(255,255,255,.5)}.back-quote{font-size:clamp(20px,2.1vw,30px);line-height:1.02;letter-spacing:-.055em}.back-footer{font-size:7px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.5)}
    .panel.type-card .face.front{background:#fff;color:#070807;display:grid;place-items:center}.panel.type-card .face.front:after{border-color:rgba(0,0,0,.08);background:linear-gradient(180deg,rgba(255,255,255,.7),transparent)}.type-letter{position:relative;z-index:2;font-size:clamp(120px,16vw,220px);font-weight:780;line-height:.7;letter-spacing:-.12em}.type-meta{position:absolute;z-index:3;left:20px;right:20px;top:19px;display:flex;justify-content:space-between;font-size:6px;letter-spacing:.17em;text-transform:uppercase}.panel.text-card .face.front{background:#080908;color:#f7f7f3;padding:25px}.editorial{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;justify-content:space-between}.editorial h2{margin:0;font-size:clamp(26px,2.8vw,41px);line-height:.88;letter-spacing:-.06em;font-weight:560}.editorial p{margin:0;font-size:clamp(12px,1.2vw,17px);line-height:1.08;letter-spacing:-.025em}.editorial small{font-size:6px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.5)}
    .chrome{position:fixed;z-index:30;inset:0;pointer-events:none}.topbar{position:absolute;left:25px;right:25px;top:21px;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:780;letter-spacing:-.02em}.mark{position:relative;width:18px;height:18px}.mark:before,.mark:after{content:"";position:absolute;width:11px;height:15px;border:1.5px solid currentColor;border-radius:60% 60% 48% 48%;top:1px}.mark:before{left:1px;transform:rotate(-38deg)}.mark:after{right:1px;transform:rotate(38deg)}.top-meta{font-size:7px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}.bottom{position:absolute;left:25px;right:25px;bottom:20px;display:grid;grid-template-columns:1fr auto 1fr;align-items:end;font-size:7px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}.bottom .hint{text-align:center}.bottom .count{text-align:right}.live:before{content:"";display:inline-block;width:5px;height:5px;margin-right:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 4px rgba(181,17,29,.12)}
    .controls{position:fixed;z-index:40;right:22px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:7px}.round-btn{width:42px;height:42px;border:1px solid var(--line);border-radius:50%;background:rgba(255,255,255,.68);backdrop-filter:blur(12px);display:grid;place-items:center;font-size:9px;font-weight:700}.round-btn:hover{background:#fff}.index-btn{position:fixed;z-index:40;left:22px;top:50%;transform:translateY(-50%);padding:12px 9px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.68);backdrop-filter:blur(12px);font-size:7px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;writing-mode:vertical-rl}
    .drawer{position:fixed;z-index:60;left:12px;top:12px;bottom:12px;width:min(340px,88vw);border:1px solid var(--line);border-radius:25px;background:rgba(247,248,244,.92);backdrop-filter:blur(30px);box-shadow:0 28px 90px rgba(0,0,0,.14);transform:translateX(calc(-100% - 24px));transition:transform .34s cubic-bezier(.2,.8,.2,1);overflow:hidden}.drawer.open{transform:none}.drawer-head{height:96px;padding:20px;border-bottom:1px solid var(--line)}.eyebrow{font-size:7px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}.drawer-title{font-size:24px;font-weight:720;letter-spacing:-.05em}.drawer-close{position:absolute;right:18px;top:18px;width:29px;height:29px;border:1px solid var(--line);border-radius:50%}.drawer-body{height:calc(100% - 96px);overflow:auto;padding:12px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}.index-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.index-item{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:#111;border:1px solid transparent}.index-item:hover,.index-item.active{border-color:#080908;box-shadow:0 0 0 1px #080908}.index-item img{width:100%;height:100%;display:block;object-fit:cover}.index-item:after{content:"";position:absolute;inset:55% 0 0;background:linear-gradient(transparent,rgba(0,0,0,.82))}.index-item span{position:absolute;z-index:2;left:7px;right:7px;bottom:6px;color:#fff;font-size:7px;font-weight:700;line-height:1.15}
    .viewer{position:fixed;z-index:90;inset:0;display:grid;grid-template-columns:minmax(0,1fr) 320px;background:rgba(4,5,4,.97);color:#f6f6f2;opacity:0;pointer-events:none;transform:scale(.985);transition:.3s}.viewer.open{opacity:1;pointer-events:auto;transform:none}.viewer-media{display:grid;place-items:center;min-width:0;background:#000}.viewer-media video{width:100%;height:100%;object-fit:contain}.viewer-info{padding:35px 28px;display:flex;flex-direction:column;justify-content:flex-end;border-left:1px solid rgba(255,255,255,.16)}.viewer-info small{font-size:7px;letter-spacing:.18em;color:rgba(255,255,255,.5);text-transform:uppercase}.viewer-info h2{margin:11px 0;font-size:38px;line-height:.9;letter-spacing:-.065em}.viewer-info p{font-size:10px;line-height:1.7;color:rgba(255,255,255,.52)}.viewer-close{position:absolute;right:25px;top:22px;z-index:2;width:36px;height:36px;border:1px solid rgba(255,255,255,.28);border-radius:50%;font-size:18px}
    @media(max-width:760px){.panel{width:185px;height:320px;margin-left:-92.5px;margin-top:-160px}.face{border-radius:23px}.topbar{left:14px;right:14px;top:14px}.top-meta{display:none}.bottom{left:14px;right:14px;bottom:14px;grid-template-columns:1fr 1fr}.bottom .hint{display:none}.controls{right:10px}.index-btn{left:10px}.viewer{grid-template-columns:1fr}.viewer-info{position:absolute;left:0;right:0;bottom:0;border:0;background:linear-gradient(transparent,rgba(0,0,0,.92));padding-top:80px}.viewer-info p{display:none}}
    @media(prefers-reduced-motion:reduce){.drawer,.viewer{transition:none}}
  </style>
</head>
<body>
  <main class="stage" id="stage" aria-label="러브트리 회전 메모리 인덱스"><div class="scene"><div class="deck" id="deck"></div></div></main>
  <div class="chrome" aria-hidden="true"><header class="topbar"><div class="brand"><span class="mark"></span>LoveTree</div><div class="top-meta">Rotating memory index · selected films · 2026</div></header><footer class="bottom"><div class="live">Live sculpture</div><div class="hint">Drag to rotate · Scroll to change · Click to open</div><div class="count"><span id="currentNo">001</span> / 089</div></footer></div>
  <button class="index-btn" id="indexTrigger" aria-label="영상 목록 열기">Index 89</button><div class="controls"><button class="round-btn" id="prev" aria-label="이전 영상">←</button><button class="round-btn" id="pause" aria-label="자동 회전 일시정지">Ⅱ</button><button class="round-btn" id="next" aria-label="다음 영상">→</button></div>
  <aside class="drawer" id="drawer" aria-label="전체 영상 목록"><button class="drawer-close" id="drawerClose" aria-label="목록 닫기">×</button><div class="drawer-head"><div class="eyebrow">LoveTree archive</div><div class="drawer-title">Moving Memory Index</div></div><div class="drawer-body"><div class="index-grid" id="indexGrid"></div></div></aside>
  <section class="viewer" id="viewer" role="dialog" aria-modal="true" aria-hidden="true"><button class="viewer-close" id="viewerClose" aria-label="닫기">×</button><div class="viewer-media" id="viewerMedia"></div><div class="viewer-info"><small id="viewerMeta"></small><h2 id="viewerTitle"></h2><p>러브트리에 보관된 움직이는 기억입니다. 영상과 소리를 크게 열어 다시 감상할 수 있습니다.</p></div></section>
  <script>
  (function(){
    'use strict';
    var TOTAL=89,SLOTS=7;
    function pad(n){return String(n).padStart(3,'0');}function mod(n,m){return((n%m)+m)%m;}
    var first=['First','Living','Shared','Quiet','Red','Infinite','Hidden','Tender','Parallel','Golden'];var second=['Memory','Journey','Signal','Portrait','Orbit','Chapter','Feeling','Archive','Promise'];var sibling='../12_러브트리_리빙미디어스피어_인터랙티브대문_V1/assets/';
    var films=Array.from({length:TOTAL},function(_,i){var no=i+1;return{index:i,no:no,title:first[i%first.length]+' '+second[Math.floor(i/first.length)%second.length],src:sibling+'videos-v3/v3-'+pad(no)+'.mp4',poster:sibling+'posters-v3/poster-'+pad(no)+'.jpg'};});
    var deck=document.getElementById('deck'),stage=document.getElementById('stage'),drawer=document.getElementById('drawer'),indexGrid=document.getElementById('indexGrid'),slots=[];var selected=0,rotation=-18,targetRotation=-18,velocity=.035,auto=true,dragging=false,moved=false,pointerId=null,startX=0,startY=0,lastX=0,downSlot=-1,lastTime=performance.now(),frame=0;
    for(var s=0;s<SLOTS;s++){var panel=document.createElement('button');panel.className='panel';panel.dataset.slot=s;panel.setAttribute('aria-label','영상 카드');var front=document.createElement('span');front.className='face front';var img=document.createElement('img');img.alt='';front.appendChild(img);var video=document.createElement('video');video.muted=true;video.loop=true;video.playsInline=true;video.preload='none';front.appendChild(video);var copy=document.createElement('span');copy.className='panel-copy';copy.innerHTML='<small></small><h2></h2>';front.appendChild(copy);var back=document.createElement('span');back.className='face back';back.innerHTML='<span class="back-index"></span><span class="back-quote">Every memory changes when we return to it.</span><span class="back-footer">LoveTree · Moving Archive</span>';panel.appendChild(front);panel.appendChild(back);deck.appendChild(panel);slots.push({el:panel,front:front,img:img,video:video,copy:copy,back:back,filmIndex:0,z:0});}
    films.forEach(function(f){var item=document.createElement('button');item.className='index-item';item.dataset.index=f.index;item.setAttribute('aria-label',f.title+' 선택');var img=document.createElement('img');img.src=f.poster;img.alt='';img.loading='lazy';item.appendChild(img);var label=document.createElement('span');label.textContent=pad(f.no)+' '+f.title;item.appendChild(label);item.addEventListener('click',function(){selectFilm(f.index);drawer.classList.remove('open');});indexGrid.appendChild(item);});
    function updateSlots(){slots.forEach(function(slot,s){var pos=s-Math.floor(SLOTS/2),index=mod(selected+pos,TOTAL),f=films[index];slot.filmIndex=index;slot.el.classList.toggle('type-card',s===SLOTS-1);slot.el.classList.toggle('text-card',s===0);slot.front.innerHTML='';if(s===SLOTS-1){var meta=document.createElement('span');meta.className='type-meta';meta.innerHTML='<span>LT-'+pad(f.no)+'</span><span>Memory Type</span>';var letter=document.createElement('span');letter.className='type-letter';letter.textContent='LOVE'[selected%4];slot.front.appendChild(meta);slot.front.appendChild(letter);}else if(s===0){var editorial=document.createElement('span');editorial.className='editorial';editorial.innerHTML='<small>LoveTree · '+pad(f.no)+'</small><h2>Every moment<br>becomes part<br>of us.</h2><p>'+f.title+'<br>A moving memory kept alive.</p>';slot.front.appendChild(editorial);}else{slot.img=document.createElement('img');slot.img.src=f.poster;slot.img.alt='';slot.video=document.createElement('video');slot.video.muted=true;slot.video.loop=true;slot.video.playsInline=true;slot.video.preload='none';slot.video.dataset.src=f.src;slot.video.style.opacity='0';slot.front.appendChild(slot.img);slot.front.appendChild(slot.video);var copy=document.createElement('span');copy.className='panel-copy';copy.innerHTML='<small>LT-'+pad(f.no)+' · Moving memory</small><h2>'+f.title+'</h2>';slot.front.appendChild(copy);}slot.back.querySelector('.back-index').textContent='Memory '+pad(f.no)+' / '+pad(TOTAL);slot.el.setAttribute('aria-label',f.title+' 영상 열기');});document.getElementById('currentNo').textContent=pad(selected+1);document.querySelectorAll('.index-item').forEach(function(b){b.classList.toggle('active',Number(b.dataset.index)===selected);});}
    function selectFilm(index){selected=mod(index,TOTAL);updateSlots();}
    function openViewer(index){var f=films[index],wrap=document.getElementById('viewerMedia');wrap.innerHTML='';var video=document.createElement('video');video.src=f.src;video.poster=f.poster;video.controls=true;video.autoplay=true;video.playsInline=true;wrap.appendChild(video);video.play().catch(function(){video.muted=true;video.play().catch(function(){});});document.getElementById('viewerTitle').textContent=f.title;document.getElementById('viewerMeta').textContent='LOVE TREE · MEMORY '+pad(f.no)+' / '+pad(TOTAL);document.getElementById('viewer').classList.add('open');document.getElementById('viewer').setAttribute('aria-hidden','false');}
    function closeViewer(){var viewer=document.getElementById('viewer'),video=viewer.querySelector('video');if(video)video.pause();viewer.classList.remove('open');viewer.setAttribute('aria-hidden','true');setTimeout(function(){document.getElementById('viewerMedia').innerHTML='';},300);}
    stage.addEventListener('pointerdown',function(e){if(e.button!==0)return;dragging=true;moved=false;pointerId=e.pointerId;startX=lastX=e.clientX;startY=e.clientY;var panel=e.target.closest('.panel');downSlot=panel?Number(panel.dataset.slot):-1;stage.classList.add('dragging');stage.setPointerCapture(pointerId);e.preventDefault();});stage.addEventListener('pointermove',function(e){if(!dragging||e.pointerId!==pointerId)return;var dx=e.clientX-lastX;lastX=e.clientX;if(Math.hypot(e.clientX-startX,e.clientY-startY)>5)moved=true;targetRotation+=dx*.34;velocity=dx*.018;e.preventDefault();});function endPointer(e){if(!dragging||e.pointerId!==pointerId)return;dragging=false;stage.classList.remove('dragging');try{stage.releasePointerCapture(pointerId);}catch(err){}if(!moved&&downSlot>=0)openViewer(slots[downSlot].filmIndex);pointerId=null;downSlot=-1;}stage.addEventListener('pointerup',endPointer);stage.addEventListener('pointercancel',endPointer);stage.addEventListener('wheel',function(e){selectFilm(selected+(e.deltaY>0?1:-1));targetRotation+=e.deltaY>0?10:-10;e.preventDefault();},{passive:false});
    function managePlayback(){var nearest=slots.filter(function(slot){return slot.video&&slot.video.dataset&&slot.video.dataset.src;}).sort(function(a,b){return b.z-a.z;}).slice(0,2);slots.forEach(function(slot){if(!slot.video||!slot.video.dataset||!slot.video.dataset.src)return;if(nearest.indexOf(slot)<0){slot.video.pause();slot.video.style.opacity='0';if(slot.img)slot.img.style.opacity='1';return;}if(!slot.video.getAttribute('src'))slot.video.src=slot.video.dataset.src;slot.video.style.opacity='1';if(slot.img)slot.img.style.opacity='0';if(!document.hidden)slot.video.play().catch(function(){});});}
    function render(now){frame++;var dt=Math.min(40,now-lastTime);lastTime=now;if(!dragging){if(auto)targetRotation+=dt*.0065;targetRotation+=velocity;velocity*=.94;}rotation+=(targetRotation-rotation)*.075;var rad=rotation*Math.PI/180,cos=Math.cos(rad),sin=Math.sin(rad),spacing=innerWidth<760?34:52;slots.forEach(function(slot,s){var pos=s-Math.floor(SLOTS/2),x0=pos*spacing,z0=-Math.abs(pos)*18,x=x0*cos+z0*sin,z=-x0*sin+z0*cos,y=Math.abs(pos)*2,ry=rotation+pos*3,scale=1-Math.abs(pos)*.025;slot.z=z;slot.el.style.transform='translate3d('+x.toFixed(2)+'px,'+y.toFixed(2)+'px,'+z.toFixed(2)+'px) rotateY('+ry.toFixed(2)+'deg) scale('+scale.toFixed(3)+')';slot.el.style.zIndex=String(1000+Math.round(z));slot.el.style.opacity=String(Math.max(.4,1-Math.abs(pos)*.085));});if(frame%20===0)managePlayback();requestAnimationFrame(render);}updateSlots();requestAnimationFrame(render);
    document.getElementById('prev').addEventListener('click',function(){selectFilm(selected-1);});document.getElementById('next').addEventListener('click',function(){selectFilm(selected+1);});document.getElementById('pause').addEventListener('click',function(){auto=!auto;this.textContent=auto?'Ⅱ':'▶';});document.getElementById('indexTrigger').addEventListener('click',function(){drawer.classList.toggle('open');});document.getElementById('drawerClose').addEventListener('click',function(){drawer.classList.remove('open');});document.getElementById('viewerClose').addEventListener('click',closeViewer);document.addEventListener('visibilitychange',managePlayback);document.addEventListener('keydown',function(e){if(e.key==='Escape'){drawer.classList.remove('open');closeViewer();}if(e.key==='ArrowLeft')selectFilm(selected-1);if(e.key==='ArrowRight')selectFilm(selected+1);});
  })();
  </script>
</body>
</html>
