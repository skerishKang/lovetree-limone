<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LoveTree — Tree Keeper</title>
<style>
:root{--pink:#ff70b8;--cyan:#70dcff;--violet:#a483ff;--gold:#ffdba2;--scene:0}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#090716;color:#fff;font-family:Arial,sans-serif}button,input{font:inherit}.world{position:fixed;inset:0;background:radial-gradient(circle at 28% 42%,#6d285e80,transparent 28%),radial-gradient(circle at 74% 30%,#153c7780,transparent 31%),linear-gradient(125deg,#10091d,#071326 62%,#16091c);transition:background 1s;overflow:hidden}.world[data-scene="1"]{background:radial-gradient(circle at 72% 30%,#90366d88,transparent 27%),linear-gradient(125deg,#110b22,#111b3c)}.world[data-scene="2"]{background:radial-gradient(circle at 55% 45%,#23579099,transparent 28%),linear-gradient(125deg,#070d20,#120725)}.world[data-scene="3"]{background:radial-gradient(circle at 68% 40%,#7b3a8680,transparent 30%),linear-gradient(125deg,#12091e,#09192b)}.world[data-scene="4"]{background:radial-gradient(circle at 50% 45%,#b2468880,transparent 28%),linear-gradient(125deg,#130b20,#071927)}.world[data-scene="5"]{background:radial-gradient(circle at 50% 40%,#c34f927d,transparent 32%),radial-gradient(circle at 70% 70%,#174b7b99,transparent 36%),linear-gradient(125deg,#160a21,#071421)}
.stars,.stars:before,.stars:after{position:absolute;content:"";inset:0;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:73px 73px;opacity:.17}.stars:before{background-size:111px 111px;transform:translate(22px,35px);opacity:.4}.stars:after{background-size:157px 157px;transform:translate(68px,14px);opacity:.6}.mist{position:absolute;width:55vw;height:55vw;border-radius:50%;left:24%;top:12%;background:conic-gradient(from 0deg,#ff5fb900,#ff5fb933,#70dfff00,#70dfff35,#ff5fb900);filter:blur(50px);animation:spin 18s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
header{position:fixed;z-index:30;top:0;left:0;right:0;height:78px;padding:0 32px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #fff2;background:#09071370;backdrop-filter:blur(20px)}.brand{font-size:13px;font-weight:700;letter-spacing:.19em}.brand small{display:block;color:#c5b8cb;font-size:9px;font-weight:400;margin-top:5px}.header-actions{display:flex;gap:8px}.header-actions button{border:1px solid #fff3;background:#fff1;color:#fff;border-radius:99px;padding:9px 14px;cursor:pointer;font-size:9px;letter-spacing:.1em}.header-actions button:hover{border-color:#ff89bf;background:#ff89bf1c}
.scene-wrap{position:absolute;inset:78px 0 86px;display:grid;grid-template-columns:43% 57%;align-items:center;max-width:1500px;margin:auto}.copy{padding-left:7vw;z-index:3}.step{display:inline-flex;align-items:center;gap:10px;color:#f2a7ca;font-size:10px;letter-spacing:.2em}.step:before{content:"";width:34px;height:1px;background:#f080b6}.copy h1{font-family:Georgia,serif;font-size:clamp(42px,5.2vw,78px);font-weight:400;line-height:.95;margin:24px 0 20px;max-width:690px}.copy h1 em{color:#f08cbd;font-weight:400}.copy p{max-width:520px;color:#c5bac9;font-size:14px;line-height:1.75}.cta-row{display:flex;gap:10px;margin-top:28px}.cta{border:0;border-radius:99px;padding:13px 20px;background:linear-gradient(90deg,#ef63a5,#7556d9);color:#fff;cursor:pointer;font-size:10px;letter-spacing:.08em;box-shadow:0 9px 30px #d44c9433}.cta.alt{background:#fff1;border:1px solid #fff3}.scene-content{position:relative;height:100%;display:grid;place-items:center;perspective:1200px}.keeper{position:absolute;right:8%;bottom:2%;height:min(77vh,720px);width:48%;object-fit:contain;filter:drop-shadow(0 30px 35px #0007) drop-shadow(0 0 30px #ff87bd35);transition:.55s cubic-bezier(.2,.8,.2,1);z-index:5}.keeper.out{opacity:0;transform:translateX(60px) scale(.92)}
.ui-card{position:absolute;left:4%;top:16%;width:54%;min-height:54%;border:1px solid #fff3;border-radius:26px;background:linear-gradient(145deg,#ffffff18,#ffffff08);backdrop-filter:blur(24px);box-shadow:0 28px 90px #03010977;padding:22px;transform:rotateY(-6deg) translateZ(30px);transition:.5s;overflow:hidden}.ui-card:before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,#fff2,transparent 22% 72%,#ff73b318);pointer-events:none}.ui-card>*{position:relative}.card-title{display:flex;justify-content:space-between;font-size:9px;letter-spacing:.14em;color:#dccfe0}.drop{margin-top:18px;border:1px dashed #ff91c366;border-radius:17px;height:190px;display:grid;place-items:center;text-align:center;background:#0c08124f}.drop b{display:block;font-size:32px;font-weight:400;margin-bottom:8px}.drop small{color:#a99dad}.thumbs{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:16px}.thumb{aspect-ratio:.78;border-radius:11px;border:1px solid #fff2;overflow:hidden;background:#100c18}.thumb img{width:100%;height:100%;object-fit:contain}.thumb.active{outline:2px solid #ff72b5;box-shadow:0 0 20px #ff72b555}.scan-ring{height:245px;display:grid;place-items:center;position:relative}.scan-ring:before,.scan-ring:after{content:"";position:absolute;width:210px;height:210px;border:1px solid #65ddff;border-radius:50%;box-shadow:0 0 35px #65ddff44;animation:pulse 2s ease-in-out infinite}.scan-ring:after{width:150px;height:150px;border-style:dashed;animation:spin 6s linear infinite}@keyframes pulse{50%{transform:scale(.9);opacity:.4}}.scan-ring img{height:210px;filter:drop-shadow(0 10px 20px #0008)}.scanline{height:3px;background:linear-gradient(90deg,transparent,#70ddff,transparent);position:absolute;left:8%;right:8%;top:20%;animation:scan 2.5s ease-in-out infinite}@keyframes scan{50%{top:78%}}.meters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.meter{background:#fff1;border-radius:12px;padding:10px;font-size:8px}.meter b{font-size:16px;display:block;color:#80e5ff}.build-ring{height:250px;display:grid;place-items:center;position:relative}.build-ring:before{content:"";width:210px;height:210px;border:2px solid #ff70b8;border-radius:50%;box-shadow:0 0 45px #ff70b866,inset 0 0 40px #8c5cff55;animation:spin 8s linear infinite}.build-ring img{position:absolute;height:220px;filter:drop-shadow(0 15px 20px #0009)}.build-ring i{position:absolute;width:270px;height:82px;border:1px solid #75ddff;border-radius:50%;transform:rotateX(68deg);box-shadow:0 0 25px #75ddff55}.tree{height:270px;position:relative;display:grid;place-items:end center}.trunk{width:18px;height:125px;background:linear-gradient(90deg,#ff9ac9,#fff1b1,#bd77ff);border-radius:20px 20px 4px 4px;box-shadow:0 0 28px #ff7bb7}.crown{position:absolute;width:240px;height:170px;bottom:87px;border-radius:48%;background:radial-gradient(circle at 20% 45%,#fff 0 2px,transparent 3px),radial-gradient(circle at 75% 30%,#fff 0 2px,transparent 3px),radial-gradient(ellipse,#ff8fc3 0 10%,#9f6effaa 48%,transparent 70%);background-size:35px 31px,42px 39px,100% 100%;filter:drop-shadow(0 0 32px #ff79bb);animation:bloom 2.4s ease-in-out infinite}@keyframes bloom{50%{transform:scale(1.05)}}.branch{position:absolute;width:160px;height:1px;background:linear-gradient(90deg,transparent,#ffd0e7,transparent);transform-origin:center}.branch.b1{transform:rotate(24deg);bottom:140px}.branch.b2{transform:rotate(-28deg);bottom:165px}.memory-dots{display:flex;justify-content:center;gap:8px;margin-top:12px}.memory-dots i{width:7px;height:7px;border-radius:50%;background:#ff8fc4;box-shadow:0 0 12px #ff8fc4}
.caption{position:absolute;right:5%;bottom:2%;z-index:10;border-left:1px solid #fff4;padding-left:14px;font-size:9px;line-height:1.6;color:#c9bdcc}.nav{position:fixed;z-index:30;left:0;right:0;bottom:0;height:86px;display:flex;align-items:center;justify-content:center;gap:16px;background:#08061196;border-top:1px solid #fff2;backdrop-filter:blur(20px)}.nav button{border:1px solid #fff3;background:#fff1;color:#fff;border-radius:50%;width:38px;height:38px;cursor:pointer}.steps{display:flex;gap:7px}.node{width:92px;cursor:pointer}.node i{display:block;height:2px;background:#fff2;position:relative;overflow:hidden}.node i:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#ff64ad,#75dbff);transform:scaleX(0);transform-origin:left;transition:.4s}.node.active i:after,.node.done i:after{transform:scaleX(1)}.node span{display:block;font-size:8px;letter-spacing:.08em;color:#766d7b;margin-top:7px}.node.active span{color:#fff}.auto{position:absolute;right:26px;font-size:9px;letter-spacing:.1em}.auto input{accent-color:#ff64ad}.particles{position:absolute;inset:0;pointer-events:none;overflow:hidden}.particle{position:absolute;width:4px;height:4px;border-radius:50%;background:#ff9bc8;box-shadow:0 0 8px #ff9bc8;animation:rise var(--t) linear infinite;left:var(--x);bottom:-10px}@keyframes rise{to{transform:translate(var(--drift),-105vh) scale(.1);opacity:0}}
@media(max-width:900px){.scene-wrap{grid-template-columns:1fr}.copy{position:absolute;left:0;top:5%;padding:22px;width:58%;z-index:12}.copy h1{font-size:45px}.copy p{font-size:11px}.scene-content{margin-left:20%;}.keeper{right:0;width:52%}.ui-card{left:0;width:52%}.steps .node{width:55px}.node span{display:none}}@media(max-width:650px){header{padding:0 14px}.header-actions button:first-child{display:none}.scene-wrap{inset:78px 0 72px}.copy{width:100%;top:0;padding:18px}.copy h1{font-size:36px;max-width:58%}.copy p{max-width:55%;line-height:1.45}.scene-content{margin:0}.keeper{height:48vh;width:58%;right:-7%;bottom:0}.ui-card{left:3%;top:43%;width:62%;min-height:46%;padding:12px}.drop{height:100px}.nav{height:72px}.node{width:36px!important}.auto{display:none}}
</style></head><body><div class="world" id="world"><div class="stars"></div><div class="mist"></div><div class="particles" id="particles"></div>
<header><div class="brand">LOVETREE<small>TREE KEEPER / 03</small></div><div class="header-actions"><button onclick="location.href='index.html'">EXPERIENCE INDEX</button><button id="skip">SKIP TO BLOOM →</button></div></header>
<main class="scene-wrap"><section class="copy"><div class="step" id="step">MEET YOUR KEEPER · 01</div><h1 id="title">Every memory<br>needs a <em>keeper.</em></h1><p id="desc">안녕하세요, 나는 LUMI예요. 최애의 영상에서 마음이 움직인 순간을 찾아 하나의 러브트리로 이어드릴게요.</p><div class="cta-row"><button class="cta" id="primary">BEGIN WITH LUMI →</button><button class="cta alt" id="secondary">HOW IT WORKS</button></div></section><section class="scene-content"><div class="ui-card" id="card"></div><img class="keeper" id="keeper" src="assets/keeper/01-welcome.png" alt="러브트리 오리지널 메모리 키퍼 LUMI"><div class="caption" id="caption">ORIGINAL LOVETREE CHARACTER<br>MEMORY GARDENER · LUMI</div></section></main>
<nav class="nav"><button id="prev">←</button><div class="steps" id="steps"></div><button id="next">→</button><label class="auto">AUTO STORY <input id="autoplay" type="checkbox"></label></nav></div>
<input id="file" type="file" accept="video/*,image/*" hidden>
<script>
const scenes=[
 {k:'01-welcome.png',step:'MEET YOUR KEEPER · 01',title:'Every memory<br>needs a <em>keeper.</em>',desc:'안녕하세요, 나는 LUMI예요. 최애의 영상에서 마음이 움직인 순간을 찾아 하나의 러브트리로 이어드릴게요.',p:'BEGIN WITH LUMI →',s:'HOW IT WORKS',cap:'ORIGINAL LOVETREE CHARACTER<br>MEMORY GARDENER · LUMI',card:`<div class="card-title"><span>WELCOME TO YOUR MEMORY GARDEN</span><span>01 / 06</span></div><div style="font-family:Georgia,serif;font-size:30px;margin-top:35px">One video.<br>Ten looks.<br>One growing story.</div><p style="color:#b9afbe;font-size:11px;line-height:1.6">Upload a moment you love.<br>LUMI will guide the rest.</p>`},
 {k:'02-orb.png',step:'GIVE ME A MEMORY · 02',title:'Start with the<br><em>video you love.</em>',desc:'콘서트, 무대, 인터뷰, 직캠 중 하나를 올려주세요. 파일은 이 프로토타입 안에서만 미리보기 됩니다.',p:'CHOOSE A VIDEO',s:'USE SAMPLE',cap:'LOCAL PREVIEW · PRIVATE BY DEFAULT',card:`<div class="card-title"><span>MEMORY INPUT</span><span>02 / 06</span></div><div class="drop" id="drop"><div><b>＋</b><strong>DROP YOUR FAVORITE VIDEO</strong><br><small>MP4 · MOV · JPG · PNG</small></div></div><div id="fileName" style="font-size:9px;color:#d4c5d6;margin-top:12px">NO FILE SELECTED</div>`},
 {k:'03-scan.png',step:'READ THE MOMENTS · 03',title:'Let the feeling<br><em>come into focus.</em>',desc:'LUMI가 영상의 표정, 의상, 무대와 감정 포인트를 읽어 후보 장면을 만듭니다.',p:'SCAN THIS VIDEO',s:'VIEW CRITERIA',cap:'MOMENT SCAN · IDENTITY + OUTFIT + EMOTION',card:`<div class="card-title"><span>MOMENT SCAN</span><span>03 / 06</span></div><div class="scan-ring"><div class="scanline"></div><img src="assets/figures/A_000.png"></div><div class="meters"><div class="meter"><b>98%</b>IDENTITY</div><div class="meter"><b>10</b>LOOKS</div><div class="meter"><b>24</b>MOMENTS</div></div>`},
 {k:'04-cards.png',step:'CHOOSE THE LOOKS · 04',title:'Keep the versions<br><em>that moved you.</em>',desc:'영상 100개 속 모습 중 원하는 10개를 고르듯, 각기 다른 의상과 감정을 피규어 컬렉션으로 선택합니다.',p:'KEEP SELECTED 10',s:'SHUFFLE LOOKS',cap:'CURATE · OUTFIT COLLECTION',card:`<div class="card-title"><span>CHOOSE 10 LOOKS</span><span>04 / 06</span></div><div class="thumbs">${'ABCDEFGHIJ'.split('').map((x,i)=>`<div class="thumb ${i<5?'active':''}"><img src="assets/figures/${x}_000.png"></div>`).join('')}</div><p style="font-size:9px;color:#b9afbe">5 selected · click cards to curate your set</p>`},
 {k:'05-build.png',step:'BUILD THE FIGURE · 05',title:'Turn every look<br><em>into an orbit.</em>',desc:'선택한 모습마다 8방향 이미지를 연결해 돌려볼 수 있는 디지털 피규어로 구성합니다.',p:'BUILD 360° FIGURE',s:'PREVIEW ANGLES',cap:'8-ANGLE TURNAROUND · DIGITAL COLLECTIBLE',card:`<div class="card-title"><span>FIGURE BUILDER</span><span>05 / 06</span></div><div class="build-ring"><i></i><img id="buildFigure" src="assets/figures/A_000.png"></div><div style="display:flex;justify-content:space-between;font-size:8px;color:#c8bdcc"><span>000°</span><span>090°</span><span>180°</span><span>270°</span><span>360°</span></div>`},
 {k:'06-bloom.png',step:'WATCH IT BLOOM · 06',title:'Ten figures become<br><em>your LoveTree.</em>',desc:'저장한 순간과 피규어가 가지처럼 연결되어, 나만의 최애 아카이브가 자랍니다.',p:'ENTER MY LOVETREE →',s:'REPLAY JOURNEY',cap:'YOUR MOMENTS · YOUR FIGURES · YOUR TREE',card:`<div class="card-title"><span>MY LOVETREE</span><span>06 / 06</span></div><div class="tree"><div class="crown"></div><div class="branch b1"></div><div class="branch b2"></div><div class="trunk"></div></div><div class="memory-dots">${'<i></i>'.repeat(10)}</div><div style="text-align:center;font-family:Georgia,serif;font-size:18px;margin-top:8px">10 looks · 24 moments · 6 paths</div>`}
];
let current=0,timer,buildTimer;const world=document.getElementById('world'),keeper=document.getElementById('keeper'),card=document.getElementById('card');
scenes.forEach((x,i)=>{let n=document.createElement('div');n.className='node'+(i===0?' active':'');n.innerHTML=`<i></i><span>0${i+1} ${['WELCOME','UPLOAD','SCAN','CHOOSE','BUILD','BLOOM'][i]}</span>`;n.onclick=()=>show(i);document.getElementById('steps').appendChild(n)});
function show(i){clearInterval(buildTimer);current=(i+scenes.length)%scenes.length;let x=scenes[current];keeper.classList.add('out');setTimeout(()=>{keeper.src='assets/keeper/'+x.k;keeper.classList.remove('out')},180);world.dataset.scene=current;document.getElementById('step').textContent=x.step;document.getElementById('title').innerHTML=x.title;document.getElementById('desc').textContent=x.desc;document.getElementById('primary').textContent=x.p;document.getElementById('secondary').textContent=x.s;document.getElementById('caption').innerHTML=x.cap;card.innerHTML=x.card;document.querySelectorAll('.node').forEach((n,j)=>{n.classList.toggle('active',j===current);n.classList.toggle('done',j<current)});bindScene();if(current===4){let a=0;buildTimer=setInterval(()=>{a=(a+1)%8;let vals=[0,45,90,135,180,225,270,315];let f=document.getElementById('buildFigure');if(f)f.src=`assets/figures/A_${String(vals[a]).padStart(3,'0')}.png`},350)}}
function bindScene(){document.getElementById('primary').onclick=()=>{if(current===1)document.getElementById('file').click();else if(current<5)show(current+1);else location.href='01-memory-capsule.html'};document.getElementById('secondary').onclick=()=>current===5?show(0):show(Math.min(5,current+1));if(current===1){let d=document.getElementById('drop');d.onclick=()=>document.getElementById('file').click();d.ondragover=e=>e.preventDefault();d.ondrop=e=>{e.preventDefault();handleFile(e.dataTransfer.files[0])}}if(current===3)document.querySelectorAll('.thumb').forEach(t=>t.onclick=()=>t.classList.toggle('active'))}
function handleFile(f){if(!f)return;let n=document.getElementById('fileName');if(n)n.textContent='READY · '+f.name.toUpperCase();setTimeout(()=>show(2),500)}document.getElementById('file').onchange=e=>handleFile(e.target.files[0]);
document.getElementById('next').onclick=()=>show(current+1);document.getElementById('prev').onclick=()=>show(current-1);document.getElementById('skip').onclick=()=>show(5);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(current+1);if(e.key==='ArrowLeft')show(current-1)});let wheelLock=false;world.addEventListener('wheel',e=>{if(wheelLock)return;wheelLock=true;show(current+(e.deltaY>0?1:-1));setTimeout(()=>wheelLock=false,700)},{passive:true});document.getElementById('autoplay').onchange=e=>{clearInterval(timer);if(e.target.checked)timer=setInterval(()=>show(current+1),4200)};
const p=document.getElementById('particles');for(let i=0;i<42;i++){let s=document.createElement('i');s.className='particle';s.style.setProperty('--x',Math.random()*100+'%');s.style.setProperty('--t',(5+Math.random()*8)+'s');s.style.setProperty('--drift',(Math.random()*160-80)+'px');s.style.animationDelay=(-Math.random()*10)+'s';p.appendChild(s)}show(0);
</script></body></html>
