<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LoveTree | 감정 기록</title><style>
@import url('https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Manrope:wght@400;500;600;700&display=swap');:root{--paper:#f6f0e8;--white:#fffdf8;--ink:#403536;--muted:#927f79;--rose:#c86e79;--deep:#98505e;--sage:#879975;--sage-deep:#596b4c;--display:'Gowun Batang','Noto Serif KR',serif;--body:'Gowun Dodum','Noto Sans KR',sans-serif;--latin:'Manrope','Gowun Dodum',sans-serif;--shadow:0 24px 70px #62443a22}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:var(--body);background:radial-gradient(circle at 8% 16%,#db979133,transparent 24rem),radial-gradient(circle at 93% 84%,#9cae8233,transparent 26rem),linear-gradient(135deg,#f8f1e9,#fbf8f1 60%,#f1e8dc);min-height:100vh}button,input,textarea{font:inherit}button{cursor:pointer}.shell{width:min(1110px,calc(100% - 56px));margin:auto;padding:28px 0 55px}.top{display:flex;justify-content:space-between;align-items:center}.brand{color:var(--deep);font:1.35rem var(--display)}.back{border:0;background:transparent;color:var(--muted);font-size:.73rem}.step{color:var(--deep);font:.62rem var(--latin);letter-spacing:.12em;text-transform:uppercase}.progress{height:2px;margin:25px 0 62px;background:#98505e1f}.progress span{display:block;width:50%;height:100%;background:var(--rose)}.layout{display:grid;grid-template-columns:.92fr 1.08fr;gap:76px;align-items:center}.eyebrow{margin:0 0 18px;color:var(--deep);font:700 .63rem var(--latin);letter-spacing:.18em;text-transform:uppercase}.copy h1{margin:0;font:400 clamp(2.7rem,5vw,4.65rem)/1.12 var(--display);letter-spacing:-.1em}.copy h1 em{color:var(--rose);font-style:normal}.copy>p:not(.eyebrow){margin:22px 0 28px;color:var(--muted);font-size:.88rem;line-height:1.85}.content-card{overflow:hidden;border:1px solid #775b5224;border-radius:20px;background:var(--white);box-shadow:var(--shadow);transform:rotate(-1deg)}.thumb{height:230px;background:linear-gradient(140deg,#8d6971,#db9d91 62%,#f0c7a6);background-size:cover;background-position:center;display:grid;place-items:center;color:#fff}.thumb span{width:44px;height:44px;border:1px solid #ffffffc7;border-radius:50%;display:grid;place-items:center;background:#3a2e2f36}.meta{padding:17px 19px}.meta small{color:var(--deep);font:700 .58rem var(--latin)}.meta strong{display:block;margin-top:7px;font:400 1.15rem var(--display)}.meta p{margin:7px 0 0;color:var(--muted);font-size:.68rem;line-height:1.5;word-break:break-all}.label{display:block;margin:0 0 10px;color:var(--sage-deep);font-size:.69rem;font-weight:700}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:23px}.chip{padding:9px 14px;border:1px solid #775b5230;border-radius:99px;background:#fffdf878;color:var(--muted);font-size:.71rem}.chip.selected,.chip:hover{border-color:var(--rose);background:#c86e7919;color:var(--deep)}textarea{width:100%;min-height:112px;padding:14px;border:1px solid #775b5230;border-radius:14px;outline:0;resize:vertical;background:#fffdf8b8;color:var(--ink);line-height:1.65}textarea:focus,.time:focus{border-color:var(--rose);box-shadow:0 0 0 4px #c86e791f}.time-row{display:flex;align-items:center;gap:10px;margin:0 0 19px}.time{width:138px;height:45px;padding:0 13px;border:1px solid #775b5230;border-radius:13px;outline:0;background:#fffdf8b8;color:var(--ink);font-family:var(--latin);letter-spacing:.08em}.time-help{color:#ae9b94;font-size:.65rem}.date{width:100%;height:45px;margin-top:10px;padding:0 12px;border:1px solid #775b5230;border-radius:13px;background:#fffdf8b8;color:var(--ink)}.actions{display:flex;align-items:center;gap:14px;margin-top:24px}.button{min-height:49px;padding:0 21px;border:1px solid transparent;border-radius:99px;background:var(--rose);color:#fffaf6;box-shadow:0 12px 24px #c86e7942}.hint{color:#ae9b94;font-size:.65rem}@media(max-width:850px){.layout{grid-template-columns:1fr;gap:38px}.copy{max-width:650px}.content-card{width:min(600px,100%)}}@media(max-width:600px){.shell{width:calc(100% - 32px);padding-top:20px}.progress{margin:22px 0 42px}.copy h1{font-size:clamp(2.4rem,13vw,3.6rem)}.actions{display:grid;gap:10px}.button{width:100%}.hint{text-align:center}.thumb{height:195px}.top .brand{font-size:1.2rem}.time-row{align-items:flex-start;flex-direction:column;gap:7px}}
</style></head><body><main class="shell"><header class="top"><button class="back" type="button" onclick="history.back()">← 이전 단계</button><span class="brand">LoveTree</span><span class="step">02 · record the feeling</span></header><div class="progress"><span></span></div><section class="layout"><div class="copy"><p class="eyebrow">02 · 감정 기록</p><h1>첫 가지가 생겼어요.<br><em>이 장면이 왜 특별했나요?</em></h1><p>콘텐츠는 러브트리의 뿌리예요. 영상의 시간과 그때의 마음을 함께 남기면 첫 카드가 완성됩니다.</p><article class="content-card"><div class="thumb" id="thumb"><span>▶</span></div><div class="meta"><small>CONNECTED YOUTUBE MOMENT</small><strong>YouTube 콘텐츠가 연결됐어요</strong><p id="video-url">https://youtube.com/watch?v=dQw4w9WgXcQ</p></div></article></div><form id="memory-form"><label class="label">그때 가장 가까웠던 감정은?</label><div class="chips"><button class="chip selected" type="button">설렘</button><button class="chip" type="button">웃음</button><button class="chip" type="button">위로</button><button class="chip" type="button">충격</button><button class="chip" type="button">존경</button></div><label class="label" for="time">영상에서 기억하고 싶은 시간</label><div class="time-row"><input class="time" id="time" inputmode="numeric" placeholder="01:30" pattern="[0-9]{1,2}:[0-5][0-9]" required><span class="time-help">분:초 형식으로 입력해 주세요. 예: 01:30</span></div><label class="label" for="memory">이 장면이 특별했던 이유</label><textarea id="memory" placeholder="예: 우연히 보게 됐는데, 하루 종일 이 장면이 생각났어."></textarea><input class="date" type="date" aria-label="기록 날짜"><div class="actions"><button class="button" type="submit">첫 카드 만들기 →</button><span class="hint">나중에 수정할 수 있어요.</span></div></form></section></main><script>document.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')}));const id=new URLSearchParams(location.search).get('v');if(id){document.querySelector('#video-url').textContent='https://youtube.com/watch?v='+id;const t=document.querySelector('#thumb');t.style.backgroundImage='linear-gradient(180deg,#0000,#0005),url(https://img.youtube.com/vi/'+id+'/hqdefault.jpg)';t.style.backgroundSize='cover';t.style.backgroundPosition='center'}document.querySelector('#memory-form').addEventListener('submit',e=>{e.preventDefault();const time=document.querySelector('#time').value.trim();if(!/^\d{1,2}:[0-5]\d$/.test(time)){document.querySelector('#time').focus();return}const note=document.querySelector('#memory').value.trim();location.href='step3.html?time='+encodeURIComponent(time)+'&note='+encodeURIComponent(note)+'&v='+(id||'dQw4w9WgXcQ')});</script></body></html>
