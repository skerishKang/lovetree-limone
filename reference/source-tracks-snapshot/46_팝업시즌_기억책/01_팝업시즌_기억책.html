    <button class="card-close" id="cardClose" type="button" aria-label="Close moment card">×</button>
    <div class="moment-thumb" id="momentThumb"><span class="play-symbol">▶</span></div>
    <div class="moment-meta" id="momentMeta"></div><h2 id="momentTitle"></h2><div class="feeling"><i></i><span id="momentFeeling"></span></div><div class="relation" id="momentRelation"></div>
    <button class="play-btn" id="momentPlay" type="button">Play this Moment</button>
  </aside>
  <div class="video-modal" id="videoModal" role="dialog" aria-modal="true" aria-hidden="true" aria-label="Moment video player">
    <div class="video-paper"><div class="video-frame" id="videoFrame"></div><div class="video-caption"><h3 id="videoTitle"></h3><button class="video-close" id="videoClose" type="button">Return to the book</button></div></div>
  </div>
  <div class="toast" id="toast"></div><div class="fast-shutter" id="shutter"></div>
</div>
<script>
(()=>{
'use strict';
const STORAGE_KEY='lovetree-popup-season-memory-book-v1';
const accentCycle=['#d98191','#7f9e83','#72899a','#c99a52','#b27d95','#8c9f73','#7d94a4','#d29a72','#9a779a'];
const titleBase=['The first clip I stopped for','The voice I searched for again','The stage I watched twice','The next performance','The interview that changed the feeling','A quiet moment off stage','The laugh I remembered','The night the path became clear','The Season I finally understood'];
const feelingBase=['First spark','Curiosity','Revisit','Anticipation','Comfort','Presence','Warmth','Attachment','Reflection'];
const relationBase=['I paused because the voice felt unfamiliar and impossible to ignore.','I searched again to find the source of that low, steady tone.','The first watch left a question, so I returned to the same stage.','One performance made me wonder how the next one would feel.','The words off stage changed the way I heard the performance.','The quiet interval made the person behind the stage feel present.','A small laugh stayed longer than the scene itself.','The path between the moments finally felt like one story.','Looking back, the whole Season became understandable.'];
const chapters=Array.from({length:3},(_,c)=>({index:c+1,moments:Array.from({length:9},(_,i)=>({
 id:`s03-c${c+1}-m${i+1}`,index:c*9+i+1,title:c===0?titleBase[i]:`${titleBase[i]} · Chapter ${String(c+1).padStart(2,'0')}`,
 feeling:feelingBase[(i+c*2)%9],relation:relationBase[(i+c)%9],date:`2026.${String(3+c).padStart(2,'0')}.${String(14+i*3).padStart(2,'0')}`,
 youtubeId:'M7lc1UVf-VE',startSeconds:(i*11+c*7)%95,accent:accentCycle[i]
}))}));
const seasonData={person:{id:'felix',name:'Felix'},tree:{id:'voice-path',title:'The voice that started everything'},season:{id:'season-03',label:'Season 03',dateRange:'2026.03.14 — 2026.05.28'},chapters};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const app=$('#app'),book=$('#book'),branchLayer=$('#branchLayer'),openButton=$('#openButton'),closeButton=$('#closeButton'),playPause=$('#playPause'),modeBadge=$('#modeBadge'),help=$('#help'),toast=$('#toast'),momentCard=$('#momentCard'),videoModal=$('#videoModal'),videoFrame=$('#videoFrame'),themeMenu=$('#themeMenu'),microActions=$('#microActions');
let state='closed',currentChapter=0,selectedMoment=null,demoRunning=false,demoPaused=false,demoTimers=[],soundEnabled=false,userInterrupted=false,audioCtx=null;
const reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;
function saved(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}')}catch{return {}}}
const initial=saved();currentChapter=Math.max(0,Math.min(chapters.length-1,Number(initial.currentChapter)||0));app.dataset.theme=initial.bookTheme||'archive';
function persist(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({personId:seasonData.person.id,seasonId:seasonData.season.id,currentChapter,selectedMomentId:selectedMoment?.id||null,bookTheme:app.dataset.theme,openedAt:initial.openedAt||new Date().toISOString(),lastViewedAt:new Date().toISOString()}))}catch(e){/* sandboxed preview: storage unavailable */}}
function notify(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(notify.t);notify.t=setTimeout(()=>toast.classList.remove('show'),2200)}
function cue(type){if(!soundEnabled)return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();const now=audioCtx.currentTime;if(type==='paper'){const len=Math.floor(audioCtx.sampleRate*.22),buf=audioCtx.createBuffer(1,len,audioCtx.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);const src=audioCtx.createBufferSource(),f=audioCtx.createBiquadFilter(),g=audioCtx.createGain();f.type='lowpass';f.frequency.value=1600;g.gain.setValueAtTime(.035,now);g.gain.exponentialRampToValueAtTime(.001,now+.22);src.buffer=buf;src.connect(f).connect(g).connect(audioCtx.destination);src.start(now)}else{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.setValueAtTime(type==='bloom'?520:280,now);o.frequency.exponentialRampToValueAtTime(type==='bloom'?720:210,now+.28);g.gain.setValueAtTime(.035,now);g.gain.exponentialRampToValueAtTime(.001,now+.35);o.connect(g).connect(audioCtx.destination);o.start(now);o.stop(now+.36)}}catch(e){}}
function setState(next){state=next;app.dataset.state=next;if(next==='cover'||next==='world'||next==='closed')cue('paper');if(next==='tree'||next==='bloom')cue(next==='bloom'?'bloom':'grow');const open=next!=='closed';openButton.hidden=open;closeButton.hidden=!open;microActions.classList.toggle('is-visible',open&&next!=='cover');help.classList.toggle('fade',open);book.setAttribute('aria-label',open?'Explore the open Season 03 memory book':'Open Season 03 popup memory book')}
function clearDemo(){demoTimers.forEach(clearTimeout);demoTimers=[];demoRunning=false;demoPaused=false;playPause.textContent='▶'}
function schedule(fn,ms){const id=setTimeout(()=>{if(!demoPaused)fn()},ms);demoTimers.push(id)}
function interrupt(){if(demoRunning){clearDemo();modeBadge.textContent='Normal mode';userInterrupted=true;notify('Demo stopped for exploration.')}}
function renderBranches(){
 branchLayer.innerHTML='';const moments=chapters[currentChapter].moments;
 const angles=[-72,-54,-36,-18,0,18,36,54,72];const lengths=[168,186,202,215,226,215,202,186,168];
 moments.forEach((m,i)=>{const b=document.createElement('div');b.className='branch';b.dataset.id=m.id;b.style.cssText=`--angle:${angles[i]}deg;--closed:${angles[i]*.18}deg;--length:${lengths[i]}px;--depth:${(i%3-1)*7}px;--delay:${(i*.085+.05).toFixed(3)}s;--accent:${m.accent};--twig:${i%2?28:-28}deg`;
 b.innerHTML=`<div class="paper-branch"><span class="twig"></span></div><button class="moment-bloom" type="button" aria-label="Open Moment ${m.index}: ${escapeHtml(m.title)}"></button>`;
 b.querySelector('button').addEventListener('click',e=>{e.stopPropagation();interrupt();selectMoment(m,b)});b.addEventListener('mouseenter',()=>{if(state==='tree'||state==='bloom')previewMoment(m)});branchLayer.appendChild(b)});
 $('#chapterIndicator').textContent=`${String(currentChapter+1).padStart(2,'0')} / ${String(chapters.length).padStart(2,'0')}`;$('#prevChapter').disabled=currentChapter===0;$('#nextChapter').disabled=currentChapter===chapters.length-1;$('#inscriptionTitle').textContent=`THE VOICE THAT STARTED EVERYTHING · ${moments.length} MOMENTS IN THIS CHAPTER`;persist();
}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function previewMoment(m){$('#momentThumb').style.setProperty('--accent',m.accent);$('#momentMeta').textContent=`Moment ${String(m.index).padStart(2,'0')} · ${m.date}`;$('#momentTitle').textContent=m.title;$('#momentFeeling').textContent=m.feeling;$('#momentFeeling').parentElement.style.setProperty('--accent',m.accent);$('#momentRelation').textContent=m.relation}
function selectMoment(m,branch){selectedMoment=m;$$('.branch').forEach(x=>x.classList.toggle('is-selected',x===branch));previewMoment(m);momentCard.classList.add('open');momentCard.setAttribute('aria-hidden','false');persist()}
function closeMoment(){selectedMoment=null;$$('.branch').forEach(x=>x.classList.remove('is-selected'));momentCard.classList.remove('open');momentCard.setAttribute('aria-hidden','true');persist()}
function openBook({auto=false}={}){if(state!=='closed'&&!app.classList.contains('is-closing'))return;app.classList.remove('is-closing');setState('cover');if(reduced){setState('bloom');return}schedule(()=>setState('world'),auto?1600:1350);schedule(()=>setState('seed'),auto?3600:3000);schedule(()=>setState('tree'),auto?5200:4300);schedule(()=>setState('bloom'),auto?7200:5900);if(!initial.openedAt)persist()}
function closeBook({fast=false}={}){closeMoment();closeVideo();if(state==='closed')return;if(fast){app.classList.add('is-closing');$('#shutter').classList.remove('flash');void $('#shutter').offsetWidth;$('#shutter').classList.add('flash');setTimeout(()=>{setState('closed');app.classList.remove('is-closing')},300)}else{setState('cover');setTimeout(()=>setState('closed'),980)}persist()}
function runDemo(){clearDemo();userInterrupted=false;demoRunning=true;modeBadge.textContent='Reference demo · 12 s';playPause.textContent='Ⅱ';setState('closed');app.classList.remove('is-closing');schedule(()=>setState('cover'),900);schedule(()=>setState('world'),2100);schedule(()=>setState('seed'),4200);schedule(()=>setState('tree'),6100);schedule(()=>setState('bloom'),8200);schedule(()=>closeBook({fast:true}),10300);schedule(()=>{demoRunning=false;playPause.textContent='▶';modeBadge.textContent='Demo complete';},11550)}
function togglePlay(){if(demoRunning){clearDemo();modeBadge.textContent='Demo paused';return}runDemo()}
function changeChapter(dir){interrupt();if(state!=='tree'&&state!=='bloom')return;const next=currentChapter+dir;if(next<0||next>=chapters.length)return;closeMoment();setState('seed');setTimeout(()=>{currentChapter=next;renderBranches();setState('tree');setTimeout(()=>setState('bloom'),1050)},420)}
function openVideo(){if(!selectedMoment)return;interrupt();const m=selectedMoment;videoFrame.innerHTML=`<iframe title="${escapeHtml(m.title)}" src="https://www.youtube.com/embed/${m.youtubeId}?autoplay=1&playsinline=1&rel=0&start=${m.startSeconds}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;$('#videoTitle').textContent=m.title;videoModal.classList.add('open');videoModal.setAttribute('aria-hidden','false');$('#videoClose').focus()}
function closeVideo(){videoFrame.innerHTML='';videoModal.classList.remove('open');videoModal.setAttribute('aria-hidden','true')}
function chooseTheme(theme){app.dataset.theme=theme;$$('.theme-option').forEach(b=>b.classList.toggle('active',b.dataset.theme===theme));themeMenu.classList.remove('open');persist();notify(`${theme.toUpperCase()} cover applied.`)}
function doAction(action){persist();notify(action==='save'?'This Season book has been saved.':action==='share'?'A share preview has been prepared locally.':'Course opening preference has been saved.')}
function addDust(){const box=$('#dust');for(let i=0;i<30;i++){const s=document.createElement('span');s.style.cssText=`left:${Math.random()*100}%;top:${20+Math.random()*75}%;animation-delay:${-Math.random()*9}s;animation-duration:${7+Math.random()*8}s;scale:${.5+Math.random()*1.2}`;box.appendChild(s)}}
function pointerParallax(e){if(innerWidth<700||state==='closed')return;const x=(e.clientX/innerWidth-.5)*2,y=(e.clientY/innerHeight-.5)*2;$('#sceneCamera').style.marginLeft=`${x*7}px`;$('#sceneCamera').style.marginTop=`${y*4}px`}
book.addEventListener('click',()=>{interrupt();if(state==='closed')openBook()});book.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&state==='closed'){e.preventDefault();openBook()}});openButton.addEventListener('click',()=>{interrupt();openBook()});closeButton.addEventListener('click',()=>{interrupt();closeBook()});playPause.addEventListener('click',togglePlay);$('#replayButton').addEventListener('click',runDemo);$('#prevChapter').addEventListener('click',e=>{e.stopPropagation();changeChapter(-1)});$('#nextChapter').addEventListener('click',e=>{e.stopPropagation();changeChapter(1)});$('#cardClose').addEventListener('click',closeMoment);$('#momentPlay').addEventListener('click',openVideo);$('#videoClose').addEventListener('click',closeVideo);videoModal.addEventListener('click',e=>{if(e.target===videoModal)closeVideo()});$('#coverSwitch').addEventListener('click',()=>themeMenu.classList.toggle('open'));$$('.theme-option').forEach(b=>b.addEventListener('click',()=>chooseTheme(b.dataset.theme)));$$('[data-action]').forEach(b=>b.addEventListener('click',()=>doAction(b.dataset.action)));$('#soundButton').addEventListener('click',()=>{soundEnabled=!soundEnabled;$('#soundButton').textContent=soundEnabled?'Sound on':'Sound off';$('#soundButton').setAttribute('aria-pressed',String(soundEnabled));if(soundEnabled)cue('bloom');notify(soundEnabled?'Soft paper and branch cues enabled.':'Sound muted.')});addEventListener('pointermove',pointerParallax,{passive:true});addEventListener('keydown',e=>{if(e.code==='Space'&&!/INPUT|TEXTAREA|BUTTON/.test(document.activeElement.tagName)){e.preventDefault();state==='closed'?openBook():togglePlay()}if(e.key.toLowerCase()==='r')runDemo();if(e.key==='Escape'){if(videoModal.classList.contains('open'))closeVideo();else if(momentCard.classList.contains('open'))closeMoment();else if(themeMenu.classList.contains('open'))themeMenu.classList.remove('open');else if(state!=='closed')closeBook()}});document.addEventListener('visibilitychange',()=>{if(document.hidden&&demoRunning)clearDemo()});
renderBranches();addDust();$$('.theme-option').forEach(b=>b.classList.toggle('active',b.dataset.theme===app.dataset.theme));
const params=new URLSearchParams(location.search);if(params.get('demo')==='1'&&!reduced)setTimeout(runDemo,420);
window.LoveTreeBook={openBook,closeBook,runDemo,setState,changeChapter,selectMomentByIndex(i){const m=chapters[currentChapter].moments[i];const b=branchLayer.children[i];if(m&&b)selectMoment(m,b)},closeMoment,openVideo,closeVideo,chooseTheme,getState:()=>({state,currentChapter,selectedMoment,demoRunning})};
})();
</script>
</body>
</html>
