<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LoveTree · Vinyl Video Memory Player</title>
  <style>
    :root {
      --theme: #ff5a99;
      --theme-deep: #7a244c;
      --theme-soft: #f6b4cf;
      --ink: #f3f4f5;
      --muted: #888d91;
      --window: rgba(9,11,11,.975);
      --wood-a: #a7561c;
      --wood-b: #6e2f10;
      --wood-c: #cd7b32;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      overflow: hidden;
      color: var(--ink);
      background: #5c270d;
      font-family: Inter, Pretendard, "Noto Sans KR", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: -.02em;
    }
    button, input { font: inherit; }
    button { color: inherit; cursor: pointer; }

    .desktop {
      position: relative;
      height: 100%;
      min-width: 1040px;
      min-height: 660px;
      overflow: hidden;
      isolation: isolate;
      background:
        linear-gradient(108deg, transparent 0 21%, rgba(13,6,1,.36) 21.3% 27%, transparent 27.3% 100%),
        linear-gradient(78deg, transparent 0 76%, rgba(18,8,2,.19) 76.4% 80%, transparent 80.4% 100%),
        repeating-linear-gradient(1deg, rgba(255,216,152,.025) 0 1px, transparent 1px 4px),
        repeating-linear-gradient(91deg, rgba(75,24,5,.11) 0 2px, transparent 2px 120px),
        linear-gradient(110deg, var(--wood-a), var(--wood-c) 34%, var(--wood-b) 74%, #8b4216);
      transition: background-color .7s ease;
    }
    .desktop::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: .56;
      background:
        radial-gradient(circle at 70% 49%, color-mix(in srgb, var(--theme) 18%, transparent), transparent 28%),
        radial-gradient(ellipse at 47% 5%, rgba(255,235,199,.2), transparent 35%),
        linear-gradient(90deg, rgba(255,255,255,.035), transparent 20%, rgba(0,0,0,.12) 72%, transparent);
      transition: background .7s ease;
    }
    .desktop::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 50;
      pointer-events: none;
      box-shadow: inset 0 0 130px rgba(21,7,0,.48);
      mix-blend-mode: multiply;
    }

    .menubar {
      position: relative;
      z-index: 45;
      height: 30px;
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 0 22px;
      color: rgba(255,255,255,.82);
      background: rgba(40,16,5,.24);
      backdrop-filter: blur(10px);
      font-size: 9px;
      font-weight: 700;
      text-shadow: 0 1px 4px rgba(0,0,0,.35);
    }
    .menu-logo { font-size: 14px; }
    .menu-app { color: #fff; font-weight: 900; }
    .menu-spacer { flex: 1; }
    .menu-status { display: flex; align-items: center; gap: 12px; }

    .vinyl-scene {
      position: absolute;
      z-index: 2;
      right: 3.5%;
      top: 7%;
      width: min(1060px, 57vw);
      height: 84%;
      min-height: 540px;
    }
    .album-sleeve {
      position: absolute;
      left: 1%;
      top: 25%;
      width: 52%;
      aspect-ratio: 1;
      overflow: hidden;
      border-radius: 3px;
      background: #151311;
      box-shadow: 0 26px 45px rgba(31,12,2,.42), 0 3px 7px rgba(0,0,0,.48);
      transform: rotate(-2.2deg);
      transform-origin: 50% 70%;
      transition: transform .5s cubic-bezier(.2,.8,.2,1), filter .5s ease;
    }
    .album-sleeve.switching { transform: rotate(-5deg) translateX(-18px) scale(.97); filter: brightness(.65); }
    .album-sleeve img { width: 100%; height: 100%; object-fit: cover; filter: saturate(.82) contrast(1.04); }
    .album-sleeve::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      background:
        linear-gradient(145deg, color-mix(in srgb, var(--theme) 28%, transparent), transparent 45%),
        linear-gradient(0deg, rgba(5,5,5,.76), transparent 46%);
      mix-blend-mode: screen, normal;
    }
    .album-sleeve::after { content:""; position:absolute; inset:0; z-index:3; box-shadow:inset 0 0 0 1px rgba(255,255,255,.1), inset 0 0 55px rgba(0,0,0,.38); pointer-events:none; }
    .sleeve-copy {
      position: absolute;
      left: 8%;
      right: 8%;
      bottom: 7%;
      z-index: 2;
      color: #fff;
      text-shadow: 0 2px 12px rgba(0,0,0,.55);
    }
    .sleeve-copy small { display: block; margin-bottom: 7px; color: color-mix(in srgb, var(--theme) 65%, white); font-size: 8px; font-weight: 900; letter-spacing: .14em; text-transform: uppercase; }
    .sleeve-copy strong { display: block; max-width: 86%; font: 500 clamp(18px,2vw,35px)/1.04 Georgia, "Noto Serif KR", serif; letter-spacing: -.05em; }
    .sleeve-copy span { display: block; margin-top: 10px; color: rgba(255,255,255,.62); font-size: 9px; }

    .turntable {
      position: absolute;
      right: 0;
      top: 9%;
      width: 67%;
      height: 75%;
      min-height: 455px;
      border-radius: 20px;
      background:
        repeating-linear-gradient(93deg, rgba(92,72,49,.018) 0 1px, transparent 1px 5px),
        repeating-linear-gradient(3deg, rgba(255,255,255,.09) 0 1px, transparent 1px 3px),
        linear-gradient(138deg, #d6c9ac, #b8a98d 48%, #d2c4a6);
      box-shadow: 0 34px 55px rgba(31,12,2,.48), inset 0 1px 2px rgba(255,255,255,.75), inset 0 0 0 1px rgba(75,55,35,.25);
    }
    .turntable::after { content:""; position:absolute; inset:12px; border:1px solid rgba(58,46,32,.08); border-radius:14px; pointer-events:none; }
    .platter {
      position: absolute;
      left: 8%;
      top: 50%;
      width: min(78%, calc(100% - 120px));
      aspect-ratio: 1;
      translate: 0 -50%;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: radial-gradient(circle, #6a655a 0 3%, #302f2b 3.2% 71%, #181817 71.4% 75%, #777266 75.5% 76.5%, #282722 77%);
      box-shadow: 0 11px 13px rgba(44,30,15,.42), inset 0 0 0 1px rgba(255,255,255,.16);
    }
    .record {
      position: absolute;
      inset: 3.5%;
      border-radius: 50%;
      background:
        repeating-radial-gradient(circle at center, transparent 0 2px, rgba(255,255,255,.05) 2.5px 3px, transparent 3.5px 6px),
        radial-gradient(circle at 33% 27%, rgba(255,255,255,.14), transparent 21%),
        conic-gradient(from 20deg, #090909, #222 13%, #080808 29%, #1d1d1d 47%, #050505 69%, #242424 82%, #090909);
      box-shadow: inset 0 0 0 1px #000, 0 3px 11px rgba(0,0,0,.45);
      animation: spin 5.6s linear infinite;
      animation-play-state: paused;
    }
    .desktop.playing .record { animation-play-state: running; }
    @keyframes spin { to { rotate: 360deg; } }
    .record::after {
      content: "";
      position: absolute;
      inset: 1.7%;
      border-radius: 50%;
      background: conic-gradient(from 100deg, transparent 0 18%, rgba(255,255,255,.07) 23%, transparent 29% 60%, rgba(255,255,255,.045) 66%, transparent 72%);
      mix-blend-mode: screen;
    }
    .record-label {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 2;
      width: 31%;
      aspect-ratio: 1;
      translate: -50% -50%;
      overflow: hidden;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.22);
      background: var(--theme-deep);
      box-shadow: 0 0 0 1px rgba(0,0,0,.5);
    }
    .record-label img { width: 100%; height: 100%; object-fit: cover; filter: saturate(.92) contrast(1.08); }
    .record-label::after { content:""; position:absolute; inset:0; background:color-mix(in srgb, var(--theme) 22%, transparent); mix-blend-mode:color; }
    .spindle {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 4;
      width: 9px;
      height: 9px;
      translate: -50% -50%;
      border: 1px solid #b7b2a7;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 25%, #fff, #888 55%, #292929);
      box-shadow: 0 1px 2px #000;
    }
    .tonearm-base {
      position: absolute;
      right: 7%;
      top: 11%;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: radial-gradient(circle, #222 0 18%, #bcb8ae 20% 29%, #2b2924 31% 45%, #d1cabd 47% 56%, #5a554c 58% 68%, #b7ad9c 70%);
      box-shadow: 0 4px 8px rgba(0,0,0,.34);
    }
    .tonearm {
      position: absolute;
      right: calc(7% + 25px);
      top: calc(11% + 25px);
      z-index: 6;
      width: 39%;
      height: 13px;
      transform-origin: calc(100% - 7px) 50%;
      transform: rotate(121deg);
      transition: transform .85s cubic-bezier(.25,.75,.2,1);
    }
    .desktop.playing .tonearm { transform: rotate(135deg); }
    .tonearm::before {
      content: "";
      position: absolute;
      left: 11%;
      right: 0;
      top: 4px;
      height: 5px;
      border-radius: 999px;
      background: linear-gradient(180deg, #f0ede7, #77736b 55%, #d7d1c7);
      box-shadow: 0 2px 4px rgba(0,0,0,.34);
    }
    .tonearm::after {
      content: "";
      position: absolute;
      left: 0;
      top: -5px;
      width: 44px;
      height: 22px;
      border-radius: 3px;
      background: linear-gradient(155deg, #d7d2c9, #4b4a47 70%);
      box-shadow: 0 2px 4px rgba(0,0,0,.34);
      transform: rotate(-9deg);
    }
    .control-knob {
      position: absolute;
      right: 6.5%;
      bottom: 11%;
      width: 60px;
      height: 60px;
      border: 1px solid rgba(50,37,25,.38);
      border-radius: 50%;
      background: radial-gradient(circle at 38% 29%, #aa9370, #755a3e 64%, #3c2c1c);
      box-shadow: 0 6px 10px rgba(44,28,12,.35), inset 0 2px 2px rgba(255,255,255,.3);
    }
    .control-knob::before { content:""; position:absolute; left:50%; top:7px; width:2px; height:11px; border-radius:2px; background:#e3d9c8; transform-origin:50% 23px; rotate:var(--volume-rotate,-18deg); transition:rotate .25s ease; }
    .turntable-brand { position:absolute; left:7%; bottom:4%; padding:6px 9px; border:1px solid rgba(57,45,31,.25); color:#5b5142; background:rgba(255,255,255,.22); font:800 7px/1 monospace; letter-spacing:.12em; }

    .player-window {
      position: absolute;
      z-index: 20;
      left: 6.4%;
      top: 7.5%;
      width: min(720px, 57vw);
      height: min(570px, 73vh);
      min-height: 500px;
      display: grid;
      grid-template-rows: 48px minmax(0, 1fr) 64px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.085);
      border-radius: 17px;
      background: var(--window);
      box-shadow: 0 35px 70px rgba(27,8,0,.55), 0 4px 14px rgba(0,0,0,.46);
      transform-origin: 9% 92%;
      transition: opacity .34s ease, transform .42s cubic-bezier(.2,.8,.2,1), filter .3s ease;
    }
    .player-window.minimized { opacity: 0; transform: translate(-35%, 37%) scale(.18); filter: blur(5px); pointer-events: none; }
    .window-head { display:flex; align-items:center; gap:13px; padding:0 13px; border-bottom:1px solid rgba(255,255,255,.055); background:#0b0e0e; }
    .traffic { display:flex; gap:6px; }
    .traffic i { width:10px; height:10px; border-radius:50%; background:#ff5f57; }
    .traffic i:nth-child(2) { background:#febc2e; }
    .traffic i:nth-child(3) { background:#28c840; }
    .nav-arrows { display:flex; gap:5px; }
    .head-button { width:29px; height:29px; display:grid; place-items:center; border:0; border-radius:8px; color:#697077; background:#111515; font-size:12px; }
    .head-button:hover { color:#fff; background:#1b2020; }
    .search-wrap { position:relative; flex:1; }
    .search-wrap::before { content:"⌕"; position:absolute; left:11px; top:50%; translate:0 -53%; color:#666d72; font-size:18px; }
    .search-wrap input { width:100%; height:31px; padding:0 33px; border:1px solid rgba(255,255,255,.065); border-radius:8px; outline:0; color:#d9dddf; background:#141818; font-size:10px; }
    .search-wrap input:focus { border-color:color-mix(in srgb,var(--theme) 48%,transparent); box-shadow:0 0 0 2px color-mix(in srgb,var(--theme) 10%,transparent); }
    .profile-mini { width:29px; height:29px; overflow:hidden; border-radius:50%; border:1px solid rgba(255,255,255,.15); }
    .profile-mini img { width:100%; height:100%; object-fit:cover; }

    .window-body { min-height:0; display:grid; grid-template-columns:56px minmax(0,1fr) 205px; }
    .people-rail { min-height:0; display:flex; flex-direction:column; align-items:center; gap:9px; padding:13px 8px; border-right:1px solid rgba(255,255,255,.05); background:#0b0e0e; }
    .rail-logo { margin:1px 0 5px; color:#7e868c; font-family:Georgia,serif; font-size:19px; }
    .person-tab { position:relative; width:38px; height:38px; overflow:hidden; padding:0; border:1px solid rgba(255,255,255,.08); border-radius:8px; background:#151919; opacity:.56; transition:.2s ease; }
    .person-tab img { width:100%; height:100%; object-fit:cover; }
    .person-tab::after { content:""; position:absolute; inset:0; border:2px solid transparent; border-radius:inherit; }
    .person-tab.active { opacity:1; transform:scale(1.05); box-shadow:0 0 20px color-mix(in srgb,var(--tab-color) 27%,transparent); }
    .person-tab.active::after { border-color:var(--tab-color); }
    .rail-add { margin-top:auto; width:35px; height:35px; border:1px dashed rgba(255,255,255,.13); border-radius:9px; color:#555e64; background:transparent; }

    .library { min-width:0; min-height:0; overflow:auto; scrollbar-width:thin; scrollbar-color:#303636 transparent; }
    .person-hero { position:relative; height:190px; overflow:hidden; padding:70px 18px 16px; background:#262828; }
    .person-hero img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:.65; filter:saturate(.72) contrast(1.08); }
    .person-hero::after { content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(6,8,8,.06),rgba(8,10,10,.2) 35%,#101313 100%),linear-gradient(90deg,color-mix(in srgb,var(--theme) 24%,transparent),transparent); }
    .hero-copy { position:relative; z-index:2; }
    .hero-copy small { display:block; margin-bottom:3px; color:rgba(255,255,255,.74); font-size:8px; font-weight:900; letter-spacing:.12em; text-transform:uppercase; }
    .hero-copy h1 { margin:0; color:#fff; font-size:clamp(25px,3vw,42px); line-height:.94; letter-spacing:-.07em; text-shadow:0 2px 14px rgba(0,0,0,.35); }
    .hero-copy p { margin:7px 0 0; color:rgba(255,255,255,.63); font-size:8px; }
    .hero-actions { position:absolute; left:18px; bottom:13px; z-index:3; display:flex; gap:8px; translate:0 37px; }
    .hero-action { height:28px; padding:0 12px; border:1px solid rgba(255,255,255,.13); border-radius:999px; color:#cbd0d2; background:rgba(12,14,14,.45); font-size:8px; font-weight:800; backdrop-filter:blur(8px); }
    .hero-action.primary { width:29px; padding:0; border-color:var(--theme); color:#111; background:var(--theme); font-size:12px; }
    .memory-list { padding:13px 13px 20px; }
    .list-title { margin:0 0 7px; color:#d8dcde; font-size:12px; }
    .memory-row { width:100%; height:47px; display:grid; grid-template-columns:20px 34px minmax(0,1fr) 32px; align-items:center; gap:8px; padding:4px 7px; border:0; border-radius:6px; color:#778087; background:transparent; text-align:left; transition:.16s ease; }
    .memory-row:hover, .memory-row.active { color:#dfe2e4; background:rgba(255,255,255,.055); }
    .memory-row.active { box-shadow:inset 2px 0 var(--theme); }
    .row-index { color:#4e565b; font:700 8px monospace; text-align:center; }
    .row-thumb { width:34px; height:34px; overflow:hidden; border-radius:3px; background:#252929; }
    .row-thumb img { width:100%; height:100%; object-fit:cover; }
    .row-copy { min-width:0; }
    .row-copy strong { display:block; overflow:hidden; color:inherit; font-size:9px; white-space:nowrap; text-overflow:ellipsis; }
    .row-copy span { display:block; margin-top:4px; color:#535b61; font-size:7px; }
    .row-play { color:#596168; font-size:9px; text-align:center; }

    .queue { min-width:0; min-height:0; padding:14px 13px; border-left:1px solid rgba(255,255,255,.05); background:#0d1010; overflow:auto; scrollbar-width:thin; }
    .queue-tabs { display:flex; align-items:center; gap:12px; padding-bottom:12px; }
    .queue-tabs button { padding:0 0 6px; border:0; border-bottom:2px solid transparent; color:#555d62; background:transparent; font-size:8px; font-weight:800; }
    .queue-tabs button.active { color:#d9dddf; border-color:var(--theme); }
    .queue h2 { margin:0 0 10px; color:#d5d9db; font-size:9px; }
    .queue-row { width:100%; display:grid; grid-template-columns:30px minmax(0,1fr); align-items:center; gap:8px; margin:0 0 9px; padding:0; border:0; color:#687177; background:transparent; text-align:left; }
    .queue-row:hover { color:#fff; }
    .queue-row img { width:30px; height:30px; border-radius:3px; object-fit:cover; }
    .queue-row strong { display:block; overflow:hidden; color:inherit; font-size:8px; white-space:nowrap; text-overflow:ellipsis; }
    .queue-row span { display:block; margin-top:3px; color:#485055; font-size:7px; }
    .queue-divider { height:1px; margin:14px 0; background:rgba(255,255,255,.05); }

    .nowbar { min-width:0; display:grid; grid-template-columns:minmax(150px,1fr) 220px minmax(150px,1fr); align-items:center; gap:10px; padding:0 14px; border-top:1px solid rgba(255,255,255,.06); background:#080a0a; }
    .now-track { min-width:0; display:flex; align-items:center; gap:9px; }
    .now-track img { width:39px; height:39px; border-radius:4px; object-fit:cover; }
    .now-track div { min-width:0; }
    .now-track strong { display:block; overflow:hidden; color:#d9dddf; font-size:9px; white-space:nowrap; text-overflow:ellipsis; }
    .now-track span { display:block; margin-top:4px; color:#565e64; font-size:7px; }
    .saved-dot { flex:none; width:10px; height:10px; display:grid; place-items:center; border-radius:50%; color:#0d1111; background:var(--theme); font-size:6px; }
    .transport { display:grid; grid-template-rows:34px 15px; align-items:center; }
    .transport-buttons { display:flex; justify-content:center; align-items:center; gap:13px; }
    .transport-button { width:23px; height:23px; padding:0; border:0; color:#858d92; background:transparent; font-size:11px; }
    .transport-button.main { width:28px; height:28px; display:grid; place-items:center; border-radius:50%; color:#0c1010; background:#fff; font-size:11px; }
    .progress-wrap { display:grid; grid-template-columns:24px 1fr 24px; align-items:center; gap:5px; color:#555c61; font:700 6px monospace; }
    .progress { position:relative; height:3px; overflow:hidden; border-radius:999px; background:#373c3f; }
    .progress i { position:absolute; inset:0 auto 0 0; width:0; border-radius:inherit; background:#e8ebec; }
    .now-actions { display:flex; justify-content:flex-end; align-items:center; gap:9px; }
    .watch-button { height:30px; padding:0 12px; border:1px solid color-mix(in srgb,var(--theme) 60%,transparent); border-radius:999px; color:#121515; background:var(--theme); font-size:8px; font-weight:900; }
    .volume { width:73px; height:3px; border-radius:999px; background:linear-gradient(90deg,#d8dcde 68%,#383e41 68%); }

    .restore-player {
      position:absolute;
      z-index:18;
      left:6.4%;
      bottom:72px;
      height:38px;
      display:flex;
      align-items:center;
      gap:9px;
      padding:0 14px;
      border:1px solid rgba(255,255,255,.15);
      border-radius:999px;
      color:#fff;
      background:rgba(10,12,12,.72);
      box-shadow:0 12px 28px rgba(0,0,0,.28);
      backdrop-filter:blur(13px);
      font-size:9px;
      font-weight:800;
      opacity:0;
      translate:0 12px;
      pointer-events:none;
      transition:.28s ease;
    }
    .restore-player.show { opacity:1; translate:0 0; pointer-events:auto; }
    .restore-player i { width:20px; height:20px; display:grid; place-items:center; border-radius:6px; color:#111; background:var(--theme); font-style:normal; }

    .dock {
      position:absolute;
      z-index:15;
      left:50%;
      bottom:9px;
      translate:-50% 0;
      height:51px;
      display:flex;
      align-items:center;
      gap:7px;
      padding:6px 10px;
      border:1px solid rgba(255,255,255,.2);
      border-radius:16px;
      background:rgba(238,226,206,.22);
      box-shadow:0 10px 26px rgba(42,16,3,.28),inset 0 1px 0 rgba(255,255,255,.3);
      backdrop-filter:blur(16px);
    }
    .dock button { width:37px; height:37px; display:grid; place-items:center; padding:0; border:0; border-radius:10px; color:#fff; background:linear-gradient(145deg,#3cabe8,#2469d7); box-shadow:0 3px 6px rgba(0,0,0,.22); font-size:17px; transition:.18s ease; }
    .dock button:hover { translate:0 -8px; scale:1.13; }
    .dock button:nth-child(2) { background:linear-gradient(145deg,#59dd85,#1da65d); }
    .dock button:nth-child(3) { background:linear-gradient(145deg,var(--theme-soft),var(--theme)); }
    .dock button:nth-child(4) { background:linear-gradient(145deg,#222,#060606); }
    .dock button:nth-child(5) { background:linear-gradient(145deg,#f9ca56,#e47a28); }

    .modal-backdrop { position:fixed; inset:0; z-index:70; opacity:0; pointer-events:none; background:rgba(6,4,2,.69); backdrop-filter:blur(8px); transition:opacity .22s ease; }
    .modal-backdrop.open { opacity:1; pointer-events:auto; }
    .video-modal { position:fixed; left:50%; top:50%; z-index:71; width:min(720px,84vw); padding:18px; border:1px solid rgba(255,255,255,.12); border-radius:16px; color:#fff; background:#0d1010; box-shadow:0 35px 100px rgba(0,0,0,.62); opacity:0; pointer-events:none; transform:translate(-50%,-46%) scale(.97); transition:.27s ease; }
    .video-modal.open { opacity:1; pointer-events:auto; transform:translate(-50%,-50%) scale(1); }
    .modal-close { position:absolute; right:13px; top:13px; z-index:4; width:31px; height:31px; border:1px solid rgba(255,255,255,.13); border-radius:50%; background:rgba(0,0,0,.44); }
    .modal-copy { padding:2px 42px 13px 2px; }
    .modal-copy small { color:var(--theme); font-size:8px; font-weight:900; letter-spacing:.13em; }
    .modal-copy h2 { margin:6px 0 0; font-size:21px; letter-spacing:-.045em; }
    .video-frame { position:relative; aspect-ratio:16/9; overflow:hidden; border-radius:10px; background:#050606; }
    .video-frame img,.video-frame iframe { display:block; width:100%; height:100%; border:0; object-fit:cover; }
    .video-frame::after { content:""; position:absolute; inset:0; pointer-events:none; background:linear-gradient(0deg,rgba(0,0,0,.48),transparent 46%); }
    .video-frame.playing::after { display:none; }
    .modal-play { position:absolute; left:50%; top:50%; z-index:3; translate:-50% -50%; width:62px; height:62px; padding-left:5px; border:1px solid rgba(255,255,255,.65); border-radius:50%; color:#111; background:rgba(255,255,255,.92); font-size:19px; box-shadow:0 13px 30px rgba(0,0,0,.35); }
    .frame-label { position:absolute; left:14px; bottom:12px; z-index:3; color:rgba(255,255,255,.8); font-size:8px; font-weight:900; letter-spacing:.1em; }

    .empty { padding:26px 10px; color:#555e63; font-size:9px; text-align:center; }
    @media (max-height: 760px) {
      .player-window { top:6.5%; height:74vh; min-height:490px; }
      .person-hero { height:166px; padding-top:59px; }
      .memory-row { height:43px; }
      .vinyl-scene { top:5%; height:86%; }
    }
    @media (prefers-reduced-motion: reduce) {
      *,*::before,*::after { animation-duration:.01ms!important; animation-iteration-count:1!important; transition-duration:.01ms!important; }
    }
  </style>
</head>
<body>
  <main class="desktop" id="desktop">
    <header class="menubar">
      <span class="menu-logo">●</span><span class="menu-app">LoveTree Vinyl</span><span>파일</span><span>기억</span><span>재생</span><span>보기</span><span>도움말</span>
      <span class="menu-spacer"></span><span class="menu-status"><b>♡</b><span>기억 동기화됨</span><span id="clock">오후 8:49</span></span>
    </header>

    <section class="vinyl-scene" aria-label="영상 기억 턴테이블">
      <article class="album-sleeve" id="albumSleeve">
        <img id="sleeveImage" alt="선택한 영상의 앨범 자켓" />
        <div class="sleeve-copy"><small id="sleevePerson">LOVE MOMENT</small><strong id="sleeveTitle"></strong><span id="sleeveEmotion"></span></div>
      </article>
      <div class="turntable">
        <div class="platter">
          <div class="record"><div class="record-label"><img id="labelImage" alt="회전하는 영상 라벨" /></div></div>
          <i class="spindle"></i>
        </div>
        <div class="tonearm-base"></div><div class="tonearm"></div>
        <button class="control-knob" id="volumeKnob" type="button" title="볼륨 분위기 바꾸기" aria-label="볼륨 분위기 바꾸기"></button>
        <span class="turntable-brand">LOVETREE · VIDEO VINYL</span>
      </div>
    </section>

    <section class="player-window" id="playerWindow" aria-label="LoveTree 영상 기억 플레이어">
      <header class="window-head">
        <span class="traffic"><i></i><i></i><i></i></span>
        <span class="nav-arrows"><button class="head-button" id="prevPerson" type="button" aria-label="이전 사람">‹</button><button class="head-button" id="nextPerson" type="button" aria-label="다음 사람">›</button></span>
        <div class="search-wrap"><input id="searchInput" type="search" placeholder="어떤 영상 기억을 찾고 있나요?" aria-label="영상 기억 검색" /></div>
        <button class="head-button" id="minimizePlayer" type="button" aria-label="플레이어 숨기기">−</button>
        <span class="profile-mini"><img id="profileMini" alt="현재 사람" /></span>
      </header>
      <div class="window-body">
        <aside class="people-rail" id="peopleRail"><span class="rail-logo">✿</span><button class="rail-add" type="button" title="새 사람 추가">＋</button></aside>
        <section class="library">
          <div class="person-hero" id="personHero"><img id="heroImage" alt="선택한 사람의 영상 장면" /><div class="hero-copy"><small>VIDEO MEMORY ALBUM</small><h1 id="heroName"></h1><p id="heroMeta"></p></div><div class="hero-actions"><button class="hero-action primary" id="playAll" type="button">▶</button><button class="hero-action" type="button">기억 앨범</button><button class="hero-action" type="button">•••</button></div></div>
          <div class="memory-list"><h2 class="list-title">담아둔 영상</h2><div id="memoryList"></div></div>
        </section>
        <aside class="queue"><div class="queue-tabs"><button class="active" type="button">다음 기억</button><button type="button">최근 재생</button></div><h2>지금 재생 중</h2><div id="queueNow"></div><div class="queue-divider"></div><h2>이어서 만날 장면</h2><div id="queueNext"></div></aside>
      </div>
      <footer class="nowbar">
        <div class="now-track"><img id="nowThumb" alt="현재 영상 썸네일" /><div><strong id="nowTitle"></strong><span id="nowPerson"></span></div><i class="saved-dot">♥</i></div>
        <div class="transport"><div class="transport-buttons"><button class="transport-button" id="shuffleButton" type="button" aria-label="섞기">⌘</button><button class="transport-button" id="prevTrack" type="button" aria-label="이전 영상">◀</button><button class="transport-button main" id="playButton" type="button" aria-label="재생">▶</button><button class="transport-button" id="nextTrack" type="button" aria-label="다음 영상">▶</button><button class="transport-button" id="repeatButton" type="button" aria-label="반복">↻</button></div><div class="progress-wrap"><span id="currentTime">0:00</span><span class="progress"><i id="progressBar"></i></span><span>3:00</span></div></div>
        <div class="now-actions"><button class="watch-button" id="watchVideo" type="button">영상 보기</button><span>▮</span><span class="volume"></span></div>
      </footer>
    </section>

    <button class="restore-player" id="restorePlayer" type="button"><i>✿</i><span>LoveTree 플레이어 열기</span></button>
    <nav class="dock" aria-label="바로가기"><button type="button">◒</button><button type="button">●</button><button id="dockPlayer" type="button">✿</button><button type="button">◉</button><button type="button">♡</button></nav>
  </main>

  <div class="modal-backdrop" id="modalBackdrop"></div>
  <article class="video-modal" id="videoModal" aria-hidden="true">
    <button class="modal-close" id="modalClose" type="button" aria-label="닫기">×</button>
    <div class="modal-copy"><small id="modalKicker">LOVE MOMENT</small><h2 id="modalTitle"></h2></div>
    <div class="video-frame" id="videoFrame"></div>
  </article>

  <script>
    const PEOPLE = {
      felix: { name:'필릭스', full:'스트레이키즈 필릭스', group:'STRAY KIDS', color:'#ff5a99', deep:'#7b234c', soft:'#ffc2db' },
      juyeon: { name:'이주연', full:'더보이즈 이주연', group:'THE BOYZ', color:'#2bd0b0', deep:'#125f57', soft:'#b6f4e7' },
      junhyuk: { name:'이준혁', full:'배우 이준혁', group:'ACTOR', color:'#ffac3e', deep:'#7a4418', soft:'#ffe0a8' }
    };
    const TRACKS = [
      { id:'felix-room',person:'felix',yt:'dF3T25im5Jg',title:'투키즈룸 Ep.07 · 필릭스',emotion:'마음이 편안해진 장면',kind:'TALK' },
      { id:'felix-menu',person:'felix',yt:'88gQkK_p_t0',title:'神메뉴 · 필릭스 4K 직캠',emotion:'눈을 뗄 수 없던 무대',kind:'FANCAM' },
      { id:'felix-easy',person:'felix',yt:'IaWoxBn4kDo',title:'Easy · 필릭스 FaceCam',emotion:'다시 보고 싶은 표정',kind:'FACECAM' },
      { id:'juyeon-switch',person:'juyeon',yt:'T0I22axxSOY',title:'주연의 서로 다른 두 가지 매력',emotion:'새로운 얼굴을 발견한 순간',kind:'MOMENT' },
      { id:'juyeon-salty',person:'juyeon',yt:'35j5aBM2Yck',title:"Ain't Salty · 주연 직캠",emotion:'움직임이 오래 남은 무대',kind:'FANCAM' },
      { id:'juyeon-blaze',person:'juyeon',yt:'C9VVlr_Zik8',title:'THE BLAZE · 주연의 무대',emotion:'처음처럼 마음이 뛴 장면',kind:'STAGE' },
      { id:'junhyuk-game',person:'junhyuk',yt:'a1gsq3jC0Tg',title:'게임할 때 진심인 이준혁',emotion:'편안한 모습을 발견한 순간',kind:'CHARACTER' },
      { id:'junhyuk-live',person:'junhyuk',yt:'17UP5Pfmduo',title:'이준혁의 이야기 · V LIVE',emotion:'목소리가 위로가 된 장면',kind:'VOICE' },
      { id:'junhyuk-villain',person:'junhyuk',yt:'rZMQbnkXhaQ',title:'범죄도시3 · 반전 빌런 이준혁',emotion:'새로운 얼굴이 강하게 남은 장면',kind:'SCENE' }
    ];
    const state = { person:'felix', trackIndex:0, playing:false, progress:0, repeat:false, shuffled:false, search:'', volumeStep:0, timer:null };
    const desktop = document.getElementById('desktop');
    const playerWindow = document.getElementById('playerWindow');
    const albumSleeve = document.getElementById('albumSleeve');
    const peopleOrder = Object.keys(PEOPLE);

    function thumb(id) { return `https://i.ytimg.com/vi/${id}/hqdefault.jpg`; }
    function currentTrack() { return TRACKS[state.trackIndex]; }
    function currentPersonTracks() { return TRACKS.filter(track => track.person === state.person); }
    function trackIndexById(id) { return TRACKS.findIndex(track => track.id === id); }

    function applyTheme(personKey) {
      const person = PEOPLE[personKey];
      document.documentElement.style.setProperty('--theme', person.color);
      document.documentElement.style.setProperty('--theme-deep', person.deep);
      document.documentElement.style.setProperty('--theme-soft', person.soft);
    }

    function buildPeopleRail() {
      const rail = document.getElementById('peopleRail');
      const add = rail.querySelector('.rail-add');
      peopleOrder.forEach(key => {
        const first = TRACKS.find(track => track.person === key);
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'person-tab';
        button.dataset.person = key;
        button.title = PEOPLE[key].full;
        button.style.setProperty('--tab-color', PEOPLE[key].color);
        button.innerHTML = `<img src="${thumb(first.yt)}" alt="${PEOPLE[key].name}">`;
        button.addEventListener('click', () => selectPerson(key));
        rail.insertBefore(button, add);
      });
    }

    function selectPerson(personKey, chooseFirst = true) {
      state.person = personKey;
      state.search = '';
      document.getElementById('searchInput').value = '';
      if (chooseFirst) state.trackIndex = trackIndexById(TRACKS.find(track => track.person === personKey).id);
      applyTheme(personKey);
      renderLibrary();
      selectTrack(state.trackIndex, state.playing, true);
    }

    function renderLibrary() {
      const person = PEOPLE[state.person];
      const personTracks = currentPersonTracks();
      const heroTrack = personTracks[0];
      document.getElementById('heroImage').src = thumb(heroTrack.yt);
      document.getElementById('heroName').textContent = person.full;
      document.getElementById('heroMeta').textContent = `${person.group} · 영상 기억 ${personTracks.length}개`;
      document.getElementById('profileMini').src = thumb(heroTrack.yt);
      document.querySelectorAll('.person-tab').forEach(tab => tab.classList.toggle('active', tab.dataset.person === state.person));

      const list = document.getElementById('memoryList');
      const query = state.search.trim().toLowerCase();
      const source = query ? TRACKS.filter(track => `${track.title} ${PEOPLE[track.person].full} ${track.emotion}`.toLowerCase().includes(query)) : personTracks;
      list.innerHTML = '';
      if (!source.length) { list.innerHTML = '<div class="empty">일치하는 영상 기억이 없어요.</div>'; return; }
      source.forEach((track, index) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'memory-row';
        button.dataset.track = track.id;
        button.innerHTML = `<span class="row-index">${String(index + 1).padStart(2,'0')}</span><span class="row-thumb"><img src="${thumb(track.yt)}" alt=""></span><span class="row-copy"><strong>${track.title}</strong><span>${PEOPLE[track.person].name} · ${track.emotion}</span></span><span class="row-play">▶</span>`;
        button.addEventListener('click', () => selectTrack(trackIndexById(track.id), true));
        list.appendChild(button);
      });
      updateActiveRows();
    }

    function renderQueue() {
      const track = currentTrack();
      const person = PEOPLE[track.person];
      document.getElementById('queueNow').innerHTML = `<button class="queue-row" type="button" data-current="${track.id}"><img src="${thumb(track.yt)}" alt=""><span><strong>${track.title}</strong><span>${person.name} · 지금 선택됨</span></span></button>`;
      const upcoming = [1,2,3].map(offset => TRACKS[(state.trackIndex + offset) % TRACKS.length]);
      const host = document.getElementById('queueNext');
      host.innerHTML = '';
      upcoming.forEach(next => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'queue-row';
        button.innerHTML = `<img src="${thumb(next.yt)}" alt=""><span><strong>${next.title}</strong><span>${PEOPLE[next.person].name} · ${next.kind}</span></span>`;
        button.addEventListener('click', () => selectTrack(trackIndexById(next.id), true));
        host.appendChild(button);
      });
    }

    function selectTrack(index, shouldPlay = true, skipTransition = false) {
      state.trackIndex = (index + TRACKS.length) % TRACKS.length;
      const track = currentTrack();
      if (state.person !== track.person) {
        state.person = track.person;
        state.search = '';
        document.getElementById('searchInput').value = '';
        applyTheme(track.person);
        renderLibrary();
      }
      state.progress = 0;
      if (!skipTransition) albumSleeve.classList.add('switching');
      window.setTimeout(() => {
        updateTrackVisuals();
        albumSleeve.classList.remove('switching');
      }, skipTransition ? 0 : 230);
      setPlaying(shouldPlay);
      renderQueue();
      updateActiveRows();
    }

    function updateTrackVisuals() {
      const track = currentTrack();
      const person = PEOPLE[track.person];
      const image = thumb(track.yt);
      document.getElementById('sleeveImage').src = image;
      document.getElementById('labelImage').src = image;
      document.getElementById('sleevePerson').textContent = `${person.group} · ${track.kind}`;
      document.getElementById('sleeveTitle').textContent = track.title;
      document.getElementById('sleeveEmotion').textContent = track.emotion;
      document.getElementById('nowThumb').src = image;
      document.getElementById('nowTitle').textContent = track.title;
      document.getElementById('nowPerson').textContent = `${person.full} · ${track.kind}`;
      applyTheme(track.person);
      updateProgress();
    }

    function updateActiveRows() {
      const id = currentTrack().id;
      document.querySelectorAll('.memory-row').forEach(row => row.classList.toggle('active', row.dataset.track === id));
    }

    function setPlaying(value) {
      state.playing = value;
      desktop.classList.toggle('playing', value);
      document.getElementById('playButton').textContent = value ? 'Ⅱ' : '▶';
      document.getElementById('playAll').textContent = value ? 'Ⅱ' : '▶';
    }

    function updateProgress() {
      document.getElementById('progressBar').style.width = `${state.progress}%`;
      const seconds = Math.floor(state.progress * 1.8);
      document.getElementById('currentTime').textContent = `${Math.floor(seconds/60)}:${String(seconds%60).padStart(2,'0')}`;
    }

    function nextTrack() {
      let next = state.trackIndex + 1;
      if (state.shuffled) next = (state.trackIndex + 2 + Math.floor(Math.random() * (TRACKS.length - 2))) % TRACKS.length;
      selectTrack(next, true);
    }
    function previousTrack() { selectTrack(state.trackIndex - 1, true); }
    function cyclePerson(direction) {
      const index = peopleOrder.indexOf(state.person);
      selectPerson(peopleOrder[(index + direction + peopleOrder.length) % peopleOrder.length]);
    }

    function openVideo() {
      const track = currentTrack();
      document.getElementById('modalKicker').textContent = `${PEOPLE[track.person].full} · ${track.kind}`;
      document.getElementById('modalTitle').textContent = track.title;
      const frame = document.getElementById('videoFrame');
      frame.className = 'video-frame';
      frame.innerHTML = `<img src="${thumb(track.yt)}" alt="${track.title} 썸네일"><button class="modal-play" type="button" aria-label="영상 재생">▶</button><span class="frame-label">CLICK TO PLAY · YOUTUBE</span>`;
      frame.querySelector('.modal-play').addEventListener('click', () => playActualVideo(track));
      document.getElementById('modalBackdrop').classList.add('open');
      document.getElementById('videoModal').classList.add('open');
      document.getElementById('videoModal').setAttribute('aria-hidden','false');
    }
    function playActualVideo(track) {
      const frame = document.getElementById('videoFrame');
      frame.classList.add('playing');
      frame.innerHTML = `<iframe title="${track.title}" src="https://www.youtube-nocookie.com/embed/${track.yt}?autoplay=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
      setPlaying(false);
    }
    function closeVideo() {
      document.getElementById('modalBackdrop').classList.remove('open');
      document.getElementById('videoModal').classList.remove('open');
      document.getElementById('videoModal').setAttribute('aria-hidden','true');
      document.getElementById('videoFrame').innerHTML = '';
    }

    function minimizePlayer() {
      playerWindow.classList.add('minimized');
      document.getElementById('restorePlayer').classList.add('show');
    }
    function restorePlayer() {
      playerWindow.classList.remove('minimized');
      document.getElementById('restorePlayer').classList.remove('show');
    }

    buildPeopleRail();
    applyTheme(state.person);
    renderLibrary();
    updateTrackVisuals();
    renderQueue();

    document.getElementById('playButton').addEventListener('click', () => setPlaying(!state.playing));
    document.getElementById('playAll').addEventListener('click', () => setPlaying(!state.playing));
    document.getElementById('nextTrack').addEventListener('click', nextTrack);
    document.getElementById('prevTrack').addEventListener('click', previousTrack);
    document.getElementById('nextPerson').addEventListener('click', () => cyclePerson(1));
    document.getElementById('prevPerson').addEventListener('click', () => cyclePerson(-1));
    document.getElementById('shuffleButton').addEventListener('click', event => { state.shuffled=!state.shuffled; event.currentTarget.style.color=state.shuffled?'var(--theme)':''; });
    document.getElementById('repeatButton').addEventListener('click', event => { state.repeat=!state.repeat; event.currentTarget.style.color=state.repeat?'var(--theme)':''; });
    document.getElementById('watchVideo').addEventListener('click', openVideo);
    document.getElementById('minimizePlayer').addEventListener('click', minimizePlayer);
    document.getElementById('restorePlayer').addEventListener('click', restorePlayer);
    document.getElementById('dockPlayer').addEventListener('click', () => playerWindow.classList.contains('minimized') ? restorePlayer() : minimizePlayer());
    document.getElementById('modalClose').addEventListener('click', closeVideo);
    document.getElementById('modalBackdrop').addEventListener('click', closeVideo);
    document.getElementById('searchInput').addEventListener('input', event => { state.search=event.target.value; renderLibrary(); });
    document.getElementById('volumeKnob').addEventListener('click', () => { state.volumeStep=(state.volumeStep+1)%4; document.getElementById('volumeKnob').style.setProperty('--volume-rotate',`${-35+state.volumeStep*24}deg`); });
    document.addEventListener('keydown', event => {
      if (event.key==='Escape') closeVideo();
      if (event.code==='Space' && !event.target.matches('input')) { event.preventDefault(); setPlaying(!state.playing); }
      if (event.key==='ArrowRight' && !event.target.matches('input')) nextTrack();
      if (event.key==='ArrowLeft' && !event.target.matches('input')) previousTrack();
    });
    state.timer = window.setInterval(() => {
      if (!state.playing) return;
      state.progress += .22;
      if (state.progress >= 100) {
        if (state.repeat) { state.progress=0; updateProgress(); }
        else nextTrack();
      } else updateProgress();
    }, 100);
    window.setInterval(() => {
      const now = new Date();
      const hour = now.getHours();
      document.getElementById('clock').textContent = `${hour<12?'오전':'오후'} ${hour%12||12}:${String(now.getMinutes()).padStart(2,'0')}`;
    }, 30000);
  </script>
</body>
</html>
