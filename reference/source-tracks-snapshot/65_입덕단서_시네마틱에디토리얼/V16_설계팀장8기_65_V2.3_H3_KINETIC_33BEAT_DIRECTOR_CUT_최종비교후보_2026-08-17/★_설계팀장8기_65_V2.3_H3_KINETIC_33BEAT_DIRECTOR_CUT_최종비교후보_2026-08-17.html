  else if(s.type==='rightclues'){const cs=[...el.querySelectorAll('.right-card')];cs.forEach((c,k)=>{const q=ease(clamp((u-k*.07)/.34));c.style.opacity=String(q);c.style.transform=`translate3d(${mix(k===0?-12:k===2?12:0,0,q)}vw,${mix(12,0,q)}vh,0) rotate(${[-4,2,-2][k]+Math.sin(u*Math.PI)*.8}deg) scale(${.9+q*.1})`});const r=el.querySelector('.reticle');r.style.left=`${mix(20,72,u)}%`;r.style.top=`${48+Math.sin(u*Math.PI*2)*12}%`;r.style.transform=`translate(-50%,-50%) scale(${.8+.3*Math.sin(u*Math.PI)})`}
  else if(s.type==='investigation'){el.querySelector('.inv-base').style.transform=`scale(${1.02+u*.06}) translateX(${mix(1,-2,u)}vw)`;el.querySelector('.inv-side').style.transform=`translate3d(${mix(18,0,ease(u/.34))}vw,${Math.sin(u*Math.PI)*-1.5}vh,0) rotate(${mix(4,-1,u)}deg)`;el.querySelector('.inv-portrait').style.transform=`translate3d(${mix(12,0,ease(u/.48))}vw,${mix(8,0,ease(u/.48))}vh,0) rotate(${mix(7,3,u)}deg) scale(${.9+u*.1})`;el.querySelector('.lightcone').style.transform=`translateX(${mix(-65,50,u)}%)`;el.querySelector('.invtype').style.transform=`translateY(${mix(8,0,ease(u/.4))}vh)`}
  else if(s.type==='platformdream'){el.querySelector('.platform-dream').style.transform=`scale(${1.02+u*.065}) translate3d(${mix(1,-1.7,u)}vw,${mix(.4,-.4,u)}vh,0)`;el.querySelector('.platform-beam').style.transform=`translateX(${mix(-50,320,u)}%) skewX(-18deg)`;el.querySelector('.platform-slice').style.transform=`translate3d(${mix(16,0,ease(u/.38))}vw,${Math.sin(u*Math.PI)*-1.2}vh,0) rotateY(${mix(-18,2,u)}deg) scale(${.92+u*.08})`}
  else if(s.type==='treeforms'){el.querySelector('.treeforms-main').style.transform=`scale(${1.025+u*.045}) translate3d(${mix(.4,-.8,u)}vw,0,0)`;[...el.querySelectorAll('.tf')].forEach((q,k)=>{const z=ease(clamp((u-k*.08)/.44));q.style.opacity=String(.25+.75*z);q.style.transform=`translate3d(${mix(16+4*k,0,z)}vw,${mix(5-k*2,0,z)}vh,0) rotateY(${mix(-18+6*k,0,z)}deg) scale(${.9+z*.1})`})}
  else if(s.type==='final'){el.querySelector('.tree').style.transform=`scale(${1.055-u*.045}) translate3d(${u*-.3}vw,${u*.15}vh,0)`;el.querySelector('.tree-glow').style.opacity=String(.35+.55*Math.sin(Math.min(1,u*1.1)*Math.PI/2));[...el.querySelectorAll('.petal')].forEach((p,k)=>{const seed=(k*37)%97/97;const x=(12+(k*41)%82);const y=(8+(k*53)%84);const drift=(u*32+seed*14);p.style.left=x+'%';p.style.top=y+'%';p.style.opacity=String(.15+.58*Math.sin((u+seed)*Math.PI));p.style.transform=`translate3d(${Math.sin(seed*19+u*4)*22}px,${drift}px,0) rotate(${u*180+k*13}deg)`})}
}
const burst=document.getElementById('burst'),burstImg=document.getElementById('burstImg'),microcut=document.getElementById('microcut'),shutter=document.getElementById('shutter');
const burstMap={
  4:[['조사1.png',.25,.34,'slash'],['조사3.png',.58,.68,'circle']],
  7:[['노래1.png',.24,.33,'wipe'],['노래4-티비.png',.63,.72,'slash']],
  9:[['테이프,티비.png',.47,.57,'circle']],
  12:[['뒷모습1.png',.43,.54,'wipe']],
  14:[['사진1.png',.27,.36,'slash'],['조사6.png',.62,.72,'circle']],
  15:[['테이프2-오프.png',.48,.58,'wipe']],
  16:[['연결2.png',.40,.50,'slash']],
  18:[['모으기1.png',.36,.47,'circle']]
};
function cutPulse(u,c,w=.025){return clamp(1-Math.abs(u-c)/w)}
function burstFX(i,u){
  burst.style.opacity='0';burst.style.clipPath='none';burstImg.style.transform='scale(1.04)';
  const list=burstMap[i];if(list){for(const [file,a,b,mode] of list){if(u>=a&&u<=b){const v=clamp((u-a)/(b-a));const src=A(file);if(burstImg.dataset.file!==file){burstImg.dataset.file=file;burstImg.dataset.ownerFallback='';burstImg.src=src;const original=src;burstImg.onerror=()=>{if(burstImg.dataset.ownerFallback)return;burstImg.dataset.ownerFallback='1';burstImg.src='../'+original};}burst.style.opacity=String(Math.min(1,Math.sin(v*Math.PI)*1.35));burstImg.style.transform=`scale(${1.08-v*.035}) translate3d(${mix(mode==='wipe'?3:-2,mode==='wipe'?-2:2,v)}vw,${mix(1,-1,v)}vh,0)`;if(mode==='slash')burst.style.clipPath=`polygon(${mix(22,0,v)}% 0,100% 0,${mix(82,100,v)}% 100%,0 100%)`;else if(mode==='circle')burst.style.clipPath=`circle(${mix(18,74,Math.sin(v*Math.PI))}% at ${mix(42,58,v)}% 50%)`;else burst.style.clipPath=`inset(0 ${mix(38,0,v)}% 0 ${mix(0,10,v)}%)`;break;}}}
  const p=Math.max(cutPulse(u,.33),cutPulse(u,.66));microcut.style.opacity=String(p*.16);shutter.style.opacity=String(Math.max(cutPulse(u,.335,.012),cutPulse(u,.665,.012))*.16);
}
function transitionFX(i,u){diag.style.opacity='0';cream.style.opacity='0';black.style.opacity='0';if(u>.78){const q=clamp((u-.78)/.22),type=scenes[i].type;if(type==='redclue'||type==='backstage'||type==='connections'||type==='platformdream'){diag.style.opacity=String(.92*q);diag.style.transform=`translateX(${mix(-130,130,q)}%)`}if(type==='signal'||type==='voice'||type==='rightclues'||type==='treeforms'){cream.style.opacity=String(.72*Math.sin(q*Math.PI))}if(type==='saw'||type==='recorder'||type==='crtworld'||type==='binocular'){black.style.opacity=String(.62*Math.sin(q*Math.PI))}}}
let last=-1;
function render(){const max=document.documentElement.scrollHeight-innerHeight;const p=max?scrollY/max:0;const t=p*TOTAL;const idx=idxAt(t);els.forEach(resetScene);const prev=idx>0?els[idx-1]:null;const cur=els[idx];if(prev){prev.style.visibility='visible';prev.style.opacity='1'}const a=ranges[idx][0],b=ranges[idx][1],u=clamp((t-a)/(b-a));entry(cur,idx,u);animateScene(cur,scenes[idx],u,idx);if(prev&&u>.12){prev.style.opacity=String(clamp(1-(u-.12)/.12))}burstFX(idx,u);transitionFX(idx,u);num.textContent=String(idx+1).padStart(2,'0')+' / '+String(scenes.length).padStart(2,'0');ttl.textContent=scenes[idx].title;bar.style.width=(p*100).toFixed(2)+'%';last=idx;requestAnimationFrame(render)}
requestAnimationFrame(render);
let playing=false,raf=0;const btn=document.getElementById('play');btn.textContent=`PLAY H3 KINETIC · ${TOTAL.toFixed(1)}s`;btn.addEventListener('click',()=>{if(playing){playing=false;cancelAnimationFrame(raf);btn.textContent=`PLAY H3 KINETIC · ${TOTAL.toFixed(1)}s`;return}playing=true;btn.textContent='STOP';const st=performance.now(),max=document.documentElement.scrollHeight-innerHeight;scrollTo(0,0);function tick(now){if(!playing)return;const q=Math.min(1,(now-st)/(TOTAL*1000));scrollTo(0,max*q);if(q<1)raf=requestAnimationFrame(tick);else{playing=false;btn.textContent=`REPLAY KINETIC · ${TOTAL.toFixed(1)}s`}}raf=requestAnimationFrame(tick)});addEventListener('wheel',()=>{if(playing){playing=false;cancelAnimationFrame(raf);btn.textContent=`PLAY H3 KINETIC · ${TOTAL.toFixed(1)}s`}},{passive:true});
</script>
