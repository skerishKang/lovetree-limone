<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LoveTree Moment Polish Lab</title>
<style>
:root{
  --black:#030303;--hero:#0b0b0c;--paper:#f3f1ea;--paper-2:#ebe9e2;
  --ink:#111113;--muted:#79766f;--blue:#2f73ff;--blue-2:#73a5ff;
  --line:#d8d5ce;--board-w:810px;--board-h:1048px;--scale:1;
  --sans:Inter,"Helvetica Neue",Arial,sans-serif;--serif:Georgia,"Times New Roman",serif;
  --mono:SFMono-Regular,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:var(--ink);font-family:var(--sans)}
button{font:inherit}
.stage{position:fixed;inset:0;display:grid;place-items:center;overflow:auto;background:radial-gradient(circle at 50% 46%,#111 0,#050505 38%,#000 73%)}
.board-shell{width:calc(var(--board-w)*var(--scale));height:calc(var(--board-h)*var(--scale));position:relative;flex:none}
.polish-lab{position:absolute;left:0;top:0;width:var(--board-w);height:var(--board-h);transform:scale(var(--scale));transform-origin:0 0;background:var(--paper);padding:22px;border-radius:4px;box-shadow:0 34px 110px rgba(0,0,0,.58);overflow:hidden}
.hero{height:264px;border-radius:20px;background:var(--hero);color:#fff;position:relative;overflow:hidden;padding:60px 28px 26px}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 0 61%,rgba(255,255,255,.025) 61% 62%,transparent 62%),radial-gradient(circle at 86% 20%,rgba(47,115,255,.09),transparent 34%);pointer-events:none}
.cue-strip{position:absolute;left:0;top:0;width:100%;height:49px;border-bottom:1px solid rgba(255,255,255,.12);padding:9px 15px 0;z-index:3}
.cue-row{display:flex;align-items:center;gap:12px;min-height:18px;font:700 10px/1 var(--mono);letter-spacing:.04em;text-transform:uppercase}
.cue-count{color:var(--blue-2)}
.cue-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cue-note{margin-left:auto;color:#8b8b90;font:500 8px/1 var(--mono);white-space:nowrap;max-width:42%;overflow:hidden;text-overflow:ellipsis}
.progress-rail{position:absolute;left:15px;right:15px;bottom:0;height:2px;background:rgba(255,255,255,.12)}
.progress-fill{width:8.333%;height:100%;background:linear-gradient(90deg,var(--blue),#8bb2ff);box-shadow:0 0 12px rgba(47,115,255,.55);transition:width .36s cubic-bezier(.22,.75,.22,1)}
.hero-copy{position:relative;z-index:2;width:71%}
.hero-eyebrow{display:inline-flex;align-items:center;border:1px solid rgba(115,165,255,.35);border-radius:999px;padding:7px 9px;color:#a8c4ff;font:700 8px/1 var(--mono);letter-spacing:.15em;text-transform:uppercase}
.hero h1{margin:14px 0 10px;font-size:42px;line-height:1.01;letter-spacing:-.052em;font-weight:760;max-width:520px;text-wrap:balance}
.hero h1 em{font-family:var(--serif);font-weight:400;color:#76a7ff}
.hero-description{margin:0;color:#9e9ea4;font-size:11px;line-height:1.55;max-width:480px}
.hero-index{position:absolute;right:22px;top:51px;font-size:124px;line-height:1;font-weight:800;letter-spacing:-.09em;color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.14);opacity:.9;font-variant-numeric:tabular-nums;z-index:1}
.apply-bar{height:54px;margin-top:12px;border:1px solid #d4d1ca;border-radius:15px;background:rgba(250,249,245,.86);display:flex;align-items:center;padding:0 8px 0 15px;gap:10px;transition:border-color .26s ease,box-shadow .26s ease,background-color .26s ease}
.apply-bar.final-active{border-color:rgba(47,115,255,.9);box-shadow:0 0 0 1px rgba(47,115,255,.2),0 12px 30px rgba(40,91,205,.15);background:#f9fbff}
.apply-mark{font:700 16px/1 var(--serif);color:var(--blue)}
.apply-copy{min-width:0;flex:1}
.apply-label{font:700 8px/1.1 var(--mono);letter-spacing:.12em;color:#88857e;text-transform:uppercase}
.apply-target{margin-top:5px;font:600 11px/1 var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.apply-button{min-width:90px;height:38px;border:0;border-radius:11px;background:#0d0d0f;color:#fff;font:700 10px/1 var(--mono);letter-spacing:.03em;cursor:pointer;transition:transform .16s ease,background-color .16s ease}
.apply-button:hover{background:#19191d}.apply-button:active{transform:scale(.96)}
.apply-button.pulse{animation:applyPulse .7s ease 1}
@keyframes applyPulse{50%{transform:scale(1.07);box-shadow:0 0 0 9px rgba(47,115,255,.12)}}
.playground-title{height:46px;display:flex;align-items:center;gap:13px;color:#2a2926}
.playground-title::before,.playground-title::after{content:"";height:1px;flex:1;background:#d4d1ca}
.playground-title span{font:800 9px/1 var(--mono);letter-spacing:.16em;white-space:nowrap}
.playground-title b{color:var(--blue);font:inherit}
.principle-grid{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,149px);gap:12px}
.principle-card{position:relative;border:1.5px solid transparent;border-radius:16px;background:rgba(232,230,223,.63);padding:10px 11px 9px;overflow:hidden;box-shadow:inset 0 1px rgba(255,255,255,.55);transition:border-color .2s ease,box-shadow .2s ease,background-color .2s ease;cursor:pointer;min-width:0}
.principle-card:hover{background:rgba(238,236,230,.94)}
.principle-card.active{border-color:#3978ff;box-shadow:0 0 0 1px rgba(57,120,255,.18),0 12px 30px rgba(40,91,205,.12);background:#f7f8fb}
.card-head{display:flex;align-items:center;gap:7px;height:18px;min-width:0}
.card-num{font:800 8px/1 var(--mono);color:#8d8981}.active .card-num{color:var(--blue)}
.card-title{font:800 9px/1 var(--sans);letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-control{margin-left:auto;display:flex;align-items:center;gap:3px;flex:none}
.mini-toggle{display:flex;background:#ddd9d1;border-radius:999px;padding:2px;gap:1px}
.mini-toggle button,.replay-btn{border:0;background:transparent;border-radius:999px;min-height:22px;padding:0 7px;color:#7b7770;font:700 7px/1 var(--mono);cursor:pointer;transition:background-color .16s ease,color .16s ease,transform .16s ease}
.mini-toggle button.on{background:#fff;color:#121214;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.replay-btn{color:#2f73ff;background:rgba(47,115,255,.07)}
.replay-btn:active{transform:scale(.95)}
.demo{height:77px;display:grid;place-items:center;position:relative;margin-top:4px}
.card-desc{position:absolute;left:11px;right:11px;bottom:8px;font:500 7px/1.35 var(--mono);color:#7f7b74;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 01 */
.radius-shell{width:150px;height:58px;border-radius:18px;background:#fff;padding:8px;box-shadow:0 3px 12px rgba(0,0,0,.12)}
.radius-inner{width:100%;height:100%;border-radius:12px;background:linear-gradient(135deg,#3079ff,#1e55d6);transition:border-radius .32s cubic-bezier(.2,.8,.2,1)}
.radius-inner.awkward{border-radius:8px}
/* 02 */
.focus-disc{width:50px;height:50px;border-radius:50%;background:#0f0f11;position:relative;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.focus-play{position:absolute;left:50%;top:50%;width:0;height:0;border-top:8px solid transparent;border-bottom:8px solid transparent;border-left:12px solid #fff;transform:translate(-45%,-50%);transition:transform .28s ease}
.focus-play.geom{transform:translate(-50%,-50%)}
/* 03 */
.depth-thumb{width:142px;height:62px;border-radius:8px;background:linear-gradient(145deg,#72b9ff 0,#2e78ef 52%,#163ca4 100%);box-shadow:0 4px 15px rgba(18,62,146,.18);transition:box-shadow .22s ease,outline-color .22s ease;outline:1px solid transparent;outline-offset:1px}
.depth-thumb.tinted{outline-color:rgba(50,111,217,.82)}.depth-thumb.pure{outline-color:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.07),0 4px 15px rgba(18,62,146,.18)}
/* 04 */
.note-card{width:146px;height:57px;border-radius:10px;background:#fff;padding:10px;transition:border-color .24s ease,box-shadow .24s ease;border:1px solid #c9c6c0;box-shadow:none}
.note-card.shadow{border-color:transparent;box-shadow:0 1px 2px rgba(20,20,20,.05),0 7px 20px rgba(20,20,20,.12)}
.note-card i{display:block;height:5px;border-radius:8px;background:#9ab6ee;width:42%;margin-bottom:8px}.note-card span{display:block;height:4px;border-radius:8px;background:#e6e5e2;width:86%;margin-top:5px}.note-card span:last-child{width:62%}
/* 05 */
.hit-row{display:flex;gap:13px;align-items:center}.hit-button{width:44px;height:44px;border:0;border-radius:10px;background:transparent;display:grid;place-items:center;position:relative;cursor:pointer}.hit-button::before{content:"";position:absolute;inset:0;border-radius:10px;background:rgba(47,115,255,.13);opacity:0;transition:opacity .18s ease}.hit-row.show .hit-button::before{opacity:1}.hit-icon{width:22px;height:22px;border-radius:7px;background:#111;color:#fff;display:grid;place-items:center;font-size:12px;position:relative;z-index:1}
/* 06 */
.time-demo{display:flex;align-items:center;justify-content:center;gap:8px;min-width:185px}.time-number{font-size:26px;font-weight:800;letter-spacing:-.04em;white-space:nowrap}.time-number.prop{font-family:Georgia,serif;font-variant-numeric:normal}.time-number.tab{font-variant-numeric:tabular-nums;width:108px;text-align:right}.time-anchor{width:6px;height:6px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 5px rgba(47,115,255,.08)}
/* 07 */
.interrupt-demo{width:175px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.motion-track{height:26px;border-radius:999px;background:#d8d6d0;position:relative;cursor:pointer}.motion-dot{position:absolute;top:4px;left:4px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transform:translateX(0)}.transition-track .motion-dot{transition:transform .42s cubic-bezier(.2,.8,.2,1)}.motion-track.target .motion-dot{transform:translateX(48px)}.track-label{text-align:center;margin-top:4px;font:600 6px/1 var(--mono);color:#817e77}
/* 08 */
.press-row{display:flex;gap:10px}.press-button{width:78px;height:43px;border:0;border-radius:10px;color:#fff;font:700 8px/1 var(--mono);cursor:pointer;transition:transform .08s ease}.press-button.good{background:#2566e8}.press-button.bad{background:#101012}.press-button.good:active{transform:scale(.96)}.press-button.bad:active{transform:scale(.90)}
/* 09 */
.heart-button{width:54px;height:54px;border:0;border-radius:13px;background:#fff;box-shadow:0 3px 13px rgba(0,0,0,.1);display:grid;place-items:center;cursor:pointer;transition:transform .16s ease,opacity .16s ease,box-shadow .16s ease}.heart-button.pressed{transform:scale(.9)}.heart-button.removed{opacity:.35;filter:blur(1px)}.heart-button svg{width:24px;height:24px;overflow:visible}.heart-shape{fill:transparent;stroke:#8f8f93;stroke-width:2;transition:fill .18s ease,stroke .18s ease}.heart-button.saved .heart-shape{fill:#2f73ff;stroke:#2f73ff}.state-label{position:absolute;bottom:2px;font:700 7px/1 var(--mono);color:#7c7972;text-transform:uppercase}
/* 10 */
.tags-demo{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;max-width:190px}.memory-tag{display:inline-flex;align-items:center;height:27px;padding:0 10px;border-radius:8px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.1);font:700 8px/1 var(--sans);opacity:1;filter:blur(0);transform:translateY(0)}
/* 11 */
.wrap-demo{font-size:14px;font-weight:780;line-height:1.08;letter-spacing:-.03em;width:174px;text-align:left}.wrap-demo.balance{text-wrap:balance;width:150px;text-align:center}
/* 12 */
.precise-demo{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:190px}.transition-case{height:49px;border-radius:10px;background:#fff;padding:8px;position:relative;overflow:hidden}.transition-case small{position:absolute;bottom:4px;left:0;right:0;text-align:center;font:600 6px/1 var(--mono);color:#777}.demo-bar{height:7px;border-radius:8px;background:#111;width:36px;transform:translateX(0);margin:7px auto 0}.all-case .demo-bar{transition:all .55s ease}.all-case.run{background:#e2ebff;transform:translateY(-3px);width:104%;box-shadow:0 9px 19px rgba(47,115,255,.18)}.all-case.run .demo-bar{width:68px;transform:translateX(8px);background:#2f73ff}.all-case{transition:all .55s ease}.specific-case .demo-bar{transition:transform .55s ease}.specific-case.run .demo-bar{transform:translateX(18px)}
.precise-note{position:absolute;bottom:1px;left:0;right:0;text-align:center;font:600 6px/1 var(--mono);color:#2f73ff;opacity:0;transition:opacity .2s ease}.precise-note.show{opacity:1}
.lab-footer{height:31px;display:flex;align-items:flex-end;justify-content:space-between;border-top:1px solid #222;margin-top:12px;padding-top:8px;font:600 8px/1 var(--mono);color:#716e68}.lab-footer b{color:#111}.footer-right{color:#9a9790}
.toast{position:fixed;left:50%;top:24px;transform:translate(-50%,-18px);opacity:0;z-index:50;background:#111;color:#fff;border:1px solid rgba(255,255,255,.15);border-radius:999px;padding:12px 18px;font:700 11px/1 var(--mono);box-shadow:0 18px 50px rgba(0,0,0,.36);transition:opacity .2s ease,transform .2s ease;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
.demo-paused .progress-fill{box-shadow:none;opacity:.52}
@media(max-width:700px){
 html,body{height:auto;min-height:100%;overflow-x:hidden;overflow-y:auto;background:var(--paper)}
 .stage{position:static;display:block;overflow:visible;background:var(--paper);min-height:2050px;height:auto;padding:0}
 .board-shell{width:100%;height:auto;min-height:2050px}
 .polish-lab{position:relative;width:100%;height:auto;min-height:100vh;transform:none;padding:10px;border-radius:0;box-shadow:none;overflow:visible}
 .hero{height:300px;border-radius:18px;padding:68px 18px 22px}
 .hero-copy{width:78%}.hero h1{font-size:34px;max-width:310px}.hero-description{font-size:11px;max-width:310px}.hero-index{right:12px;top:66px;font-size:100px}
 .cue-note{display:none}.apply-bar{margin-top:10px;height:58px}.apply-button{min-width:72px}
 .playground-title{height:50px}.playground-title span{font-size:8px;letter-spacing:.1em}
 .principle-grid{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:none;gap:9px}
 .principle-card{min-height:176px;padding:10px;scroll-margin-top:10px}.principle-card:nth-child(10),.principle-card:nth-child(11),.principle-card:nth-child(12){grid-column:span 2;min-height:182px}
 .card-head{height:46px;align-items:flex-start}.card-title{font-size:7.4px;white-space:normal;line-height:1.05;flex:1;padding-top:2px}.card-control{max-width:100px}.mini-toggle button,.replay-btn{min-height:44px}.press-button{height:44px}.demo{height:67px}.card-desc{font-size:6.8px}.radius-shell{width:128px}.depth-thumb{width:132px}.note-card{width:132px}.time-number{font-size:23px}.wrap-demo{font-size:17px;width:250px}.wrap-demo.balance{width:230px}.precise-demo{width:250px}.tags-demo{max-width:250px}
 .lab-footer{height:38px;margin-bottom:env(safe-area-inset-bottom)}
 .toast{top:12px;width:calc(100% - 24px);text-align:center}
}
@media(prefers-reduced-motion:reduce){.progress-fill,.principle-card,.mini-toggle button,.apply-button,.apply-bar,.heart-button,.focus-play,.radius-inner,.depth-thumb,.note-card,.toast{transition-duration:.001ms!important}}
</style>
</head>
<body>
<main class="stage" id="stage">
  <div class="board-shell" id="shell">
    <section class="polish-lab" id="lab" aria-label="LoveTree Moment Polish Lab">
      <section class="hero">
        <div class="cue-strip">
          <div class="cue-row"><span class="cue-count" id="cueCount"></span><span class="cue-title" id="cueTitle"></span><span class="cue-note" id="cueNote"></span></div>
          <div class="progress-rail"><div class="progress-fill" id="progressFill"></div></div>
        </div>
        <div class="hero-copy"><div class="hero-eyebrow" id="heroEyebrow"></div><h1 id="heroHeadline"></h1><p class="hero-description" id="heroDescription"></p></div>
        <div class="hero-index">12</div>
      </section>
      <section class="apply-bar" id="applyBar">
        <div class="apply-mark">›</div><div class="apply-copy"><div class="apply-label" id="applyLabel"></div><div class="apply-target" id="applyTarget"></div></div><button class="apply-button" id="applyButton"></button>
      </section>
      <header class="playground-title"><span id="playgroundTitle"></span></header>
      <section class="principle-grid" id="grid"></section>
      <footer class="lab-footer"><span id="footerLeft"></span><span class="footer-right" id="footerRight"></span></footer>
    </section>
  </div>
</main>
<div class="toast" id="toast" role="status"></div>
<script>
const COPY={
  hero:{eyebrow:'A LIVE LAB FOR MEMORY INTERACTIONS',headline:'Moments that <em>feel alive</em>,<br>by design —<br>not by accident.',description:'Twelve small decisions that make every save, revisit and connection feel intentional.'},
  apply:{label:'APPLY TO',target:'Felix · Season 03 · Shared Course',button:'Apply polish',toast:'Presentation polish applied.'},
  playground:'THE PLAYGROUND · <b>12 LIVE PRINCIPLES</b>',
  footer:{left:'<b>Save first.</b> Polish later.',right:'Every detail feels intentional.'},
  cards:[
    {id:'nestedRadius',title:'Nested Radius',description:'Every layer follows the same curve.',note:'outer = inner + padding'},
    {id:'emotionalFocus',title:'Emotional Focus',description:'Visual center beats geometric center.',note:'geometric center → visual center'},
    {id:'thumbnailDepth',title:'Thumbnail Depth',description:'A subtle edge keeps every memory visible.',note:'none · tinted · pure'},
    {id:'softDepth',title:'Soft Memory Depth',description:'Depth adapts better than a hard border.',note:'border vs layered shadow'},
    {id:'hitArea',title:'Easy to Revisit',description:'Small icon. Generous invisible target.',note:'22px glyph · 44px target'},
    {id:'stableTime',title:'Stable Time',description:'Dates and counts should never shift the layout.',note:'proportional vs tabular'},
    {id:'interruptible',title:'Interruptible Motion',description:'A new action should retarget, not restart.',note:'click rapidly'},
    {id:'tactileSave',title:'Tactile Save',description:'A gentle press feels responsive, not dramatic.',note:'.96 feels intentional'},
    {id:'saveStates',title:'Save States',description:'One icon. Clear emotional states.',note:'outline · pressed · saved · removed'},
    {id:'memoryTags',title:'Memory Tags',description:'Staggered entry. Soft, graceful exit.',note:'in 100ms · out -12px + blur'},
    {id:'balancedTitles',title:'Balanced Titles',description:'Balanced wrapping makes meaning easier to scan.',note:'default vs text-wrap: balance'},
    {id:'preciseTransitions',title:'Precise Transitions',description:'Animate only what the interaction intends.',note:'never transition: all'}
  ],
  cues:[
    ['01 / 12','NESTED RADIUS','outer and inner curves stay physically related'],
    ['02 / 12','EMOTIONAL FOCUS','optic correction moves the icon by only two pixels'],
    ['03 / 12','THUMBNAIL DEPTH','a one-pixel edge protects the image on any background'],
    ['04 / 12','SOFT MEMORY DEPTH','shadow adapts where a border feels rigid'],
    ['05 / 12','EASY TO REVISIT','small glyph, generous invisible target'],
    ['06 / 12','STABLE TIME','tabular figures keep the layout still'],
    ['07 / 12','INTERRUPTIBLE MOTION','new input retargets motion in flight'],
    ['08 / 12','TACTILE SAVE','gentle pressure, no dramatic bounce'],
    ['09 / 12','SAVE STATES','one heart carries four clear states'],
    ['10 / 12','MEMORY TAGS · STAGGER & SOFT EXIT','in: 100ms stagger · out: -12px, blur, 150ms'],
    ['11 / 12','BALANCED TITLES · TEXT WRAPPING','balance distributes lines without changing the card'],
    ['12 / 12','PRECISE TRANSITIONS · NEVER “ALL”','the left card animates what you never intended']
  ]
};
const state={active:9,playing:false,timer:null,demoMode:new URLSearchParams(location.search).get('demo')||'reference',settings:{nestedRadius:'12+12',emotionalFocus:'optic',thumbnailDepth:'tinted',softDepth:'shadow',hitArea:'show',stableTime:'tab',interruptible:'transition',tactileSave:'0.96',saveState:'outline',balancedTitle:true,preciseTransition:true}};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const grid=$('#grid'),lab=$('#lab'),shell=$('#shell'),stage=$('#stage');
function fitBoard(){if(innerWidth<=700){document.documentElement.style.setProperty('--scale',1);shell.style.height='auto';return}const scale=Math.min(1,(innerHeight-20)/1048,(innerWidth-30)/810);document.documentElement.style.setProperty('--scale',scale.toFixed(4));shell.style.width=(810*scale)+'px';shell.style.height=(1048*scale)+'px'}
addEventListener('resize',fitBoard);fitBoard();
function controls(id){
 const toggle=(opts,current)=>`<div class="mini-toggle">${opts.map(v=>`<button type="button" data-value="${v}" class="${v===current?'on':''}">${v}</button>`).join('')}</div>`;
 if(id==='nestedRadius')return toggle(['12+12','12+8'],state.settings.nestedRadius);
 if(id==='emotionalFocus')return toggle(['geom','optic'],state.settings.emotionalFocus);
 if(id==='thumbnailDepth')return toggle(['none','tinted','pure'],state.settings.thumbnailDepth);
 if(id==='softDepth')return toggle(['border','shadow'],state.settings.softDepth);
 if(id==='hitArea')return toggle(['hide','show'],state.settings.hitArea);
 if(id==='stableTime')return toggle(['prop','tab'],state.settings.stableTime);
 if(id==='interruptible')return `<span style="font:600 7px var(--mono);color:#777">click rapidly</span>`;
 if(id==='tactileSave')return `<span style="font:600 7px var(--mono);color:#777">press & hold</span>`;
 if(id==='saveStates')return `<span style="font:600 7px var(--mono);color:#777">click</span>`;
 if(id==='memoryTags')return `<button type="button" class="replay-btn" data-action="replay-tags">↻ replay</button>`;
 if(id==='balancedTitles')return toggle(['default','balance'],state.settings.balancedTitle?'balance':'default');
 if(id==='preciseTransitions')return `<span style="font:600 7px var(--mono);color:#777">hover</span>`;
 return '';
}
function demoMarkup(id){
 if(id==='nestedRadius')return `<div class="radius-shell"><div class="radius-inner"></div></div>`;
 if(id==='emotionalFocus')return `<div class="focus-disc"><i class="focus-play"></i></div>`;
 if(id==='thumbnailDepth')return `<div class="depth-thumb tinted"></div>`;
 if(id==='softDepth')return `<div class="note-card shadow"><i></i><span></span><span></span></div>`;
 if(id==='hitArea')return `<div class="hit-row show"><button class="hit-button" aria-label="Close"><span class="hit-icon">×</span></button><button class="hit-button" aria-label="Confirm"><span class="hit-icon">✓</span></button></div>`;
 if(id==='stableTime')return `<div class="time-demo"><span class="time-number tab">52,508</span><i class="time-anchor"></i></div>`;
 if(id==='interruptible')return `<div class="interrupt-demo"><div><div class="motion-track transition-track" data-motion="transition"><i class="motion-dot"></i></div><div class="track-label">transition</div></div><div><div class="motion-track keyframe-track" data-motion="keyframes"><i class="motion-dot"></i></div><div class="track-label">keyframes</div></div></div>`;
 if(id==='tactileSave')return `<div class="press-row"><button class="press-button good">0.96</button><button class="press-button bad">0.90</button></div>`;
 if(id==='saveStates')return `<button class="heart-button" aria-label="Cycle save state"><svg viewBox="0 0 24 24"><path class="heart-shape" d="M12 20.2 4.7 13C1.6 9.8 3.3 4.8 7.7 4.8c1.8 0 3.2.9 4.3 2.2 1.1-1.3 2.5-2.2 4.3-2.2 4.4 0 6.1 5 3 8.2L12 20.2Z"/></svg></button><div class="state-label">outline</div>`;
 if(id==='memoryTags')return `<div class="tags-demo"><span class="memory-tag">First spark</span><span class="memory-tag">Voice</span><span class="memory-tag">Next video</span></div>`;
 if(id==='balancedTitles')return `<div class="wrap-demo balance">The moment that made me look again.</div>`;
 if(id==='preciseTransitions')return `<div class="precise-demo"><div class="transition-case all-case"><div class="demo-bar"></div><small>transition: all</small></div><div class="transition-case specific-case"><div class="demo-bar"></div><small>specific only</small></div></div><div class="precise-note">Only the intended handle should move.</div>`;
 return '';
}
function render(){
 $('#heroEyebrow').textContent=COPY.hero.eyebrow;$('#heroHeadline').innerHTML=COPY.hero.headline;$('#heroDescription').textContent=COPY.hero.description;
 $('#applyLabel').textContent=COPY.apply.label;$('#applyTarget').textContent=COPY.apply.target;$('#applyButton').textContent=COPY.apply.button;
 $('#playgroundTitle').innerHTML=COPY.playground;$('#footerLeft').innerHTML=COPY.footer.left;$('#footerRight').textContent=COPY.footer.right;
 grid.innerHTML=COPY.cards.map((c,i)=>`<article class="principle-card ${i===state.active?'active':''}" data-index="${i}" data-id="${c.id}" tabindex="0"><div class="card-head"><span class="card-num">${String(i+1).padStart(2,'0')}</span><span class="card-title">${c.title}</span><div class="card-control">${controls(c.id)}</div></div><div class="demo">${demoMarkup(c.id)}</div><div class="card-desc">${c.note}</div></article>`).join('');
 bindCards();applySettings();setActive(state.active,false);
}
function bindCards(){
 $$('.principle-card').forEach(card=>{
  card.addEventListener('click',e=>{stopDemo();const button=e.target.closest('button');if(button){handleControl(card,button);e.stopPropagation();return}setActive(+card.dataset.index,true)});
  card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();stopDemo();setActive(+card.dataset.index,true)}});
 });
 $$('[data-motion]').forEach(track=>track.addEventListener('click',e=>{e.stopPropagation();stopDemo();runMotion(track)}));
 $('.heart-button').addEventListener('click',e=>{e.stopPropagation();stopDemo();cycleHeart()});
 const pcard=$('[data-id="preciseTransitions"]');pcard.addEventListener('mouseenter',()=>runPrecise());pcard.addEventListener('mouseleave',()=>resetPrecise());
}
function handleControl(card,button){const id=card.dataset.id,v=button.dataset.value,action=button.dataset.action;setActive(+card.dataset.index,false);if(action==='replay-tags'){runTags();return}if(!v)return;
 if(id==='balancedTitles')state.settings.balancedTitle=v==='balance';else state.settings[id]=v;updateToggle(card,v);applySettings();runPrinciple(+card.dataset.index);
}
function updateToggle(card,v){card.querySelectorAll('.mini-toggle button').forEach(b=>b.classList.toggle('on',b.dataset.value===v))}
function applySettings(){
 const r=$('.radius-inner');if(r)r.classList.toggle('awkward',state.settings.nestedRadius==='12+8');
 const f=$('.focus-play');if(f)f.classList.toggle('geom',state.settings.emotionalFocus==='geom');
 const d=$('.depth-thumb');if(d)d.className='depth-thumb '+state.settings.thumbnailDepth;
 const n=$('.note-card');if(n)n.classList.toggle('shadow',state.settings.softDepth==='shadow');
 const h=$('.hit-row');if(h)h.classList.toggle('show',state.settings.hitArea==='show');
 const t=$('.time-number');if(t)t.className='time-number '+state.settings.stableTime;
 const w=$('.wrap-demo');if(w)w.classList.toggle('balance',state.settings.balancedTitle);
}
function setCue(index,custom){const cue=custom||COPY.cues[index];$('#cueCount').textContent=cue[0];$('#cueTitle').textContent=cue[1];$('#cueNote').textContent=cue[2];$('#progressFill').style.width=custom?'100%':(((index+1)/12)*100)+'%'}
function setActive(index,scroll=true){state.active=Math.max(0,Math.min(11,index));$$('.principle-card').forEach((c,i)=>c.classList.toggle('active',i===state.active));setCue(state.active);if(scroll&&innerWidth<=700){setTimeout(()=>$$('.principle-card')[state.active].scrollIntoView({behavior:'smooth',block:'start'}),30)}runPrinciple(state.active)}
function runPrinciple(i){
 if(i===0){const r=$('.radius-inner');r.animate([{transform:'scale(.96)'},{transform:'scale(1)'}],{duration:420,easing:'cubic-bezier(.2,.8,.2,1)'})}
 if(i===1){const p=$('.focus-play');p.animate([{opacity:.45},{opacity:1}],{duration:340})}
 if(i===2){const d=$('.depth-thumb');d.animate([{filter:'brightness(.9)'},{filter:'brightness(1.05)'},{filter:'brightness(1)'}],{duration:560})}
 if(i===3){const n=$('.note-card');n.animate([{transform:'translateY(4px)'},{transform:'translateY(0)'}],{duration:460,easing:'ease-out'})}
 if(i===4){const h=$('.hit-row');h.animate([{transform:'scale(.94)'},{transform:'scale(1)'}],{duration:420})}
 if(i===5){pulseTime()}
 if(i===6){runMotion($('.transition-track'));setTimeout(()=>runMotion($('.keyframe-track')),170)}
 if(i===7){$('.press-button.good').animate([{transform:'scale(1)'},{transform:'scale(.96)'},{transform:'scale(1)'}],{duration:480})}
 if(i===8){cycleHeart()}
 if(i===9)runTags();
 if(i===10)runWrap();
 if(i===11)runPrecise();
}
let timeInterval=setInterval(()=>{const el=$('.time-number');if(!el)return;const vals=['52,508','52,600','52,577','52,646','52,421'];el.textContent=vals[Math.floor(Date.now()/900)%vals.length]},900);
function pulseTime(){const el=$('.time-number');if(el)el.animate([{opacity:.35},{opacity:1}],{duration:420})}
function runMotion(track){if(!track)return;const dot=track.querySelector('.motion-dot');if(track.dataset.motion==='transition'){track.classList.toggle('target')}else{const to=track.classList.toggle('target')?48:0;dot.animate([{transform:'translateX(0)'},{transform:`translateX(${to}px)`}],{duration:420,easing:'ease',fill:'forwards'})}}
function cycleHeart(){const btn=$('.heart-button'),label=$('.state-label');if(!btn)return;const states=['outline','pressed','saved','removed'];let idx=(states.indexOf(state.settings.saveState)+1)%states.length;state.settings.saveState=states[idx];btn.className='heart-button '+states[idx];label.textContent=states[idx];if(states[idx]==='pressed')setTimeout(()=>{if(state.settings.saveState==='pressed'){state.settings.saveState='saved';btn.className='heart-button saved';label.textContent='saved'}},260)}
function runTags(){const tags=$$('.memory-tag');tags.forEach((tag,i)=>{tag.getAnimations().forEach(a=>a.cancel());tag.animate([{opacity:0,transform:'translateY(8px)',filter:'blur(3px)'},{opacity:1,transform:'translateY(0)',filter:'blur(0)'}],{duration:340,delay:i*100,easing:'cubic-bezier(.2,.8,.2,1)',fill:'both'});setTimeout(()=>tag.animate([{opacity:1,transform:'translateY(0)',filter:'blur(0)'},{opacity:0,transform:'translateY(-12px)',filter:'blur(5px)'}],{duration:180,delay:i*75,easing:'ease-in',fill:'both'}),900)})}
function runWrap(){const w=$('.wrap-demo');if(!w)return;const next=!w.classList.contains('balance');setTimeout(()=>{w.classList.toggle('balance',next);state.settings.balancedTitle=next;const c=$('[data-id="balancedTitles"]');updateToggle(c,next?'balance':'default')},320)}
function runPrecise(){const all=$('.all-case'),specific=$('.specific-case'),note=$('.precise-note');if(!all)return;resetPrecise();setTimeout(()=>all.classList.add('run'),100);setTimeout(()=>specific.classList.add('run'),780);setTimeout(()=>note.classList.add('show'),1050)}
function resetPrecise(){const all=$('.all-case'),specific=$('.specific-case'),note=$('.precise-note');if(all)all.classList.remove('run');if(specific)specific.classList.remove('run');if(note)note.classList.remove('show')}
function stopDemo(){if(!state.playing)return;state.playing=false;clearTimeout(state.timer);lab.classList.add('demo-paused')}
function wait(ms){return new Promise(resolve=>state.timer=setTimeout(resolve,ms))}
async function playReference(){state.playing=true;lab.classList.remove('demo-paused');$('#applyBar').classList.remove('final-active');
 setActive(9,false);await wait(2100);if(!state.playing)return;
 setActive(10,false);await wait(1900);if(!state.playing)return;
 setActive(11,false);await wait(2300);if(!state.playing)return;
 setCue(11,['12 / 12','APPLY THE POLISH','presentation changes; the memory itself stays untouched']);$('#applyBar').classList.add('final-active');$('#applyButton').classList.add('pulse');await wait(1300);$('#applyButton').classList.remove('pulse');state.playing=false;
}
async function playFull(){state.playing=true;lab.classList.remove('demo-paused');$('#applyBar').classList.remove('final-active');for(let i=0;i<12;i++){if(!state.playing)return;setActive(i,false);await wait(i>=9?2000:1650)}if(!state.playing)return;setCue(11,['12 / 12','APPLY THE POLISH','presentation changes; the memory itself stays untouched']);$('#applyBar').classList.add('final-active');$('#applyButton').classList.add('pulse');await wait(1300);$('#applyButton').classList.remove('pulse');state.playing=false}
function restartDemo(){clearTimeout(state.timer);state.playing=false;state.demoMode==='full'?playFull():playReference()}
function showToast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600)}
$('#applyButton').addEventListener('click',()=>{stopDemo();const payload={targetType:'course',targetId:'season-03',enabledPrinciples:COPY.cards.map(c=>c.id),settings:state.settings,appliedAt:new Date().toISOString()};localStorage.setItem('lovetree-moment-polish-lab-v1',JSON.stringify(payload));$('#applyBar').classList.add('final-active');$('#applyButton').classList.add('pulse');setTimeout(()=>$('#applyButton').classList.remove('pulse'),720);showToast(COPY.apply.toast)});
addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key===' '){e.preventDefault();state.playing?stopDemo():restartDemo()}if(e.key.toLowerCase()==='r')restartDemo();if(e.key==='ArrowRight'){stopDemo();setActive((state.active+1)%12,true)}if(e.key==='ArrowLeft'){stopDemo();setActive((state.active+11)%12,true)}if(/^[1-9]$/.test(e.key)){stopDemo();setActive(+e.key-1,true)}if(e.key==='0'){stopDemo();setActive(9,true)}});
['pointerdown','wheel','touchstart'].forEach(type=>stage.addEventListener(type,e=>{if(e.target.closest('.apply-button'))return;if(state.playing&&e.isTrusted)stopDemo()},{passive:true}));
render();setTimeout(()=>restartDemo(),500);
</script>
</body>
</html>
