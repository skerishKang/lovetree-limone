/* V1.9 — Memory Glass / organic archive palette / scalable working-path view */
:root{
  --bg:#eee9e1;--paper:rgba(255,252,247,.68);--ink:#302a27;--muted:#746c65;
  --line:rgba(94,78,68,.15);--rose:#a65f6b;--rose2:#ead7d9;--violet:#756775;
  --cyan:#6f7c69;--cyan2:#dfe6db;--gold:#b2864f;
  --glass:rgba(255,252,247,.58);--glass-strong:rgba(255,253,249,.78);
  --glass-border:rgba(255,255,255,.72);--shadow:0 24px 60px rgba(79,61,50,.10),0 2px 10px rgba(79,61,50,.05);
}
html,body{background:#eee9e1}
body{position:relative;background:
  radial-gradient(circle at 13% 4%,rgba(197,145,137,.23),transparent 33%),
  radial-gradient(circle at 88% 18%,rgba(137,151,126,.20),transparent 31%),
  radial-gradient(circle at 72% 86%,rgba(201,173,129,.18),transparent 34%),
  linear-gradient(180deg,#f4f0e9 0%,#ece7df 48%,#e9e3db 100%);background-attachment:fixed}

  repeating-linear-gradient(0deg,rgba(78,62,52,.018) 0,rgba(78,62,52,.018) 1px,transparent 1px,transparent 4px),
  repeating-linear-gradient(90deg,rgba(255,255,255,.12) 0,rgba(255,255,255,.12) 1px,transparent 1px,transparent 7px)}
header{background:rgba(247,243,236,.86);border-bottom-color:rgba(92,76,66,.12);box-shadow:0 8px 24px rgba(75,58,48,.035)}
.mark{background:radial-gradient(circle at 34% 28%,#fff8f2 0 12%,#cf9a94 13% 34%,#a65f6b 35% 64%,#654c4d 65%);box-shadow:0 0 0 6px rgba(166,95,107,.08)}
.hero,.path-card,.stage{background:linear-gradient(145deg,rgba(255,253,249,.72),rgba(250,246,239,.50));border:1px solid var(--glass-border);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.78);backdrop-filter:blur(18px) saturate(105%);-webkit-backdrop-filter:blur(18px) saturate(105%)}

.path-card{position:relative;overflow:hidden;padding:20px 22px 22px}
.path-card::before{content:"";position:absolute;width:240px;height:240px;border-radius:50%;right:-80px;top:-125px;background:radial-gradient(circle,rgba(174,127,116,.12),transparent 68%);pointer-events:none}
.path-head-v19{position:relative;z-index:1;align-items:flex-start}.path-kicker{font-size:11px;letter-spacing:.14em;color:#8a7466;font-weight:800;margin-bottom:4px}.path-head-v19 h3{font-size:23px}.path-summary{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}.path-summary strong,.path-summary span{display:inline-flex;align-items:center;min-height:34px;padding:6px 10px;border-radius:999px;font-size:13px;font-weight:800;background:rgba(255,253,249,.56);border:1px solid rgba(107,87,73,.12);color:#60534b}.path-summary strong{color:#7b4650;background:rgba(234,215,217,.45)}
.path-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px}.path-tool{min-height:40px;padding:7px 11px;border-radius:12px;border:1px solid rgba(106,87,74,.16);background:rgba(255,253,249,.58);color:#62554c;font-size:13px;font-weight:800}.path-tool:hover{background:rgba(255,253,249,.86)}.path-tool.path-full{margin-left:auto;color:#7b4650;border-color:rgba(166,95,107,.20);background:rgba(244,229,228,.52)}
.path-scale-note{margin-top:11px;padding:10px 12px;border-radius:13px;background:rgba(223,230,219,.46);border:1px solid rgba(111,124,105,.12);color:#596153;font-size:13px;line-height:1.45;font-weight:700}
.path-lines{margin-top:13px;gap:8px;overflow:hidden;padding:1px 0 2px}
.path-line{min-width:0;width:100%;display:flex;align-items:center;gap:7px;padding:8px 10px;border-radius:16px;background:rgba(255,253,249,.32);border:1px solid rgba(255,255,255,.56);overflow:hidden;position:relative}
.path-line.is-active{background:rgba(246,231,230,.39);border-color:rgba(166,95,107,.12)}
.path-line .node{min-width:0;flex:0 0 auto}.path-line .node img{box-shadow:0 5px 14px rgba(66,51,43,.08)}
.node img{border-color:rgba(166,95,107,.19)}.node.current img{border-color:#a65f6b;box-shadow:0 0 0 4px rgba(166,95,107,.10),0 5px 14px rgba(66,51,43,.10)}.node.branch-node img{border-color:#788872}
.arrow{color:#a68d7f}.branch-prefix{margin-left:0;color:#788872;font-size:20px}.branch-label{display:inline-flex;align-items:center;gap:5px;min-width:max-content;font-size:12px;font-weight:800;color:#66705f;padding:4px 7px;border-radius:999px;background:rgba(223,230,219,.64);border:1px solid rgba(111,124,105,.12)}
.cluster-node{display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:6px 11px;border-radius:14px;background:linear-gradient(145deg,rgba(237,227,214,.72),rgba(246,240,232,.54));border:1px dashed rgba(132,106,88,.25);color:#6a5b51;font-size:12px;font-weight:800;white-space:nowrap}.cluster-dots{letter-spacing:2px;color:#a17e69}.cluster-node b{font-size:13px;color:#5e4d43}.branch-more-row{justify-content:center;color:#65705f;font-size:13px;font-weight:800;background:rgba(223,230,219,.38);border-style:dashed;min-height:50px}.branch-more-row button{border:0;background:transparent;color:inherit;font:inherit;min-height:44px;cursor:pointer}

function resolveLocalTarget(relativePath){

  const target=new URL(relativePath,location.href);
  if(target.protocol!=='file:')throw new Error('TARGET_NOT_LOCAL_FILE');
  return target;
}
