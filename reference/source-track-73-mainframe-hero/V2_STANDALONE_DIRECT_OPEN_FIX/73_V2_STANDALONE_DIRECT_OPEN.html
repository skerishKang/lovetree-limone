<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <title>LoveTree — Mainframe-style Hero V2 Standalone</title>
  <link rel="preconnect" href="https://db.onlinewebfonts.com" />
  <link rel="stylesheet" href="https://db.onlinewebfonts.com/c/5ac3fe7c6abd2f62067f266d89671492?family=HelveticaNowDisplay-Medium" />
  <link rel="stylesheet" href="https://db.onlinewebfonts.com/c/1aa3377e489837a26d019bba501e779d?family=HelveticaNowDisplayW01-Rg" />
  <style>
    :root {
      --font-heading: 'HelveticaNowDisplay-Medium','Helvetica Neue',Arial,sans-serif;
      --font-body: 'HelveticaNowDisplayW01-Rg','Helvetica Neue',Arial,sans-serif;
      --ink: #060606;
      --paper: #f7f0e8;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    html { background: var(--paper); }
    body {
      font-family: var(--font-body);
      overflow: hidden;
      background: var(--paper);
      color: var(--ink);
      text-rendering: geometricPrecision;
      -webkit-font-smoothing: antialiased;
    }
    button, a { font: inherit; color: inherit; }
    a { text-decoration: none; }
    button { border: 0; }
    button:focus-visible, a:focus-visible {
      outline: 2px solid currentColor;
      outline-offset: 4px;
    }

    .app {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(circle at 70% 35%, rgba(249,207,199,.82), transparent 32%),
        radial-gradient(circle at 32% 70%, rgba(255,255,255,.72), transparent 36%),
        linear-gradient(115deg,#f6e7df 0%,#eadbd2 47%,#ccb7aa 100%);
    }

    .hero-video {
      position: fixed;
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 70% center;
      background: transparent;
    }

    .video-fallback {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      background:
        radial-gradient(circle at 72% 40%, rgba(248,205,199,.95), transparent 26%),
        radial-gradient(circle at 54% 55%, rgba(226,183,173,.78), transparent 24%),
        linear-gradient(105deg,#f4e4dd 0 46%,#e2cec4 58%,#c6aa9d 100%);
    }
    .video-fallback::before,
    .video-fallback::after {
      content: "";
      position: absolute;
      border-radius: 999px;
      filter: blur(28px);
      opacity: .62;
      transform: rotate(-18deg);
    }
    .video-fallback::before {
      width: 30vw; height: 76vh;
      right: 10vw; top: 12vh;
      background: rgba(103,83,76,.34);
    }
    .video-fallback::after {
      width: 14vw; height: 52vh;
      right: 27vw; top: 28vh;
      background: rgba(255,235,229,.72);
    }

    .wash {
      pointer-events: none;
      position: fixed;
      inset: 0;
      z-index: 1;
      background: rgba(255,255,255,.025);
    }

    .header {
      position: fixed;
      inset: 0 0 auto;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 30px;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-family: var(--font-heading);
      font-size: clamp(22px,2vw,28px);
      letter-spacing: -.035em;
    }
    .brand-mark {
      font-family: Arial,sans-serif;
      font-size: 30px;
      line-height: 1;
      transform: translateY(-1px);
    }
    .desktop-nav {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%,-50%);
      display: flex;
      align-items: center;
      white-space: nowrap;
      font-size: clamp(18px,1.55vw,24px);
      letter-spacing: -.02em;
    }
    .desktop-nav a,
    .header-cta { transition: opacity .2s ease; }
    .desktop-nav a:hover,
    .header-cta:hover { opacity: .56; }
    .header-cta {
      font-size: clamp(18px,1.55vw,24px);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .mobile-toggle {
      position: relative;
      z-index: 31;
      display: none;
      width: 34px;
      height: 32px;
      padding: 5px;
      background: transparent;
      cursor: pointer;
    }
    .mobile-toggle span {
      position: absolute;
      left: 5px;
      width: 24px;
      height: 2px;
      background: var(--ink);
      transition: transform .28s ease, opacity .28s ease, top .28s ease;
    }
    .mobile-toggle span:nth-child(1) { top: 8px; }
    .mobile-toggle span:nth-child(2) { top: 15px; }
    .mobile-toggle span:nth-child(3) { top: 22px; }
    .mobile-toggle.is-open span:nth-child(1) { top: 15px; transform: rotate(45deg); }
    .mobile-toggle.is-open span:nth-child(2) { opacity: 0; }
    .mobile-toggle.is-open span:nth-child(3) { top: 15px; transform: rotate(-45deg); }

    .mobile-menu {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: none;
      flex-direction: column;
      justify-content: center;
      gap: 28px;
      padding: 34px;
      background: rgba(255,255,255,.95);
      backdrop-filter: blur(14px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .28s ease;
    }
    .mobile-menu.is-open { opacity: 1; pointer-events: auto; }
    .mobile-menu a {
      font-family: var(--font-heading);
      font-size: clamp(30px,9vw,46px);
      letter-spacing: -.035em;
    }
    .mobile-menu .underlined { text-decoration: underline; text-underline-offset: 5px; }

    .hero {
      position: relative;
      z-index: 5;
      display: flex;
      align-items: center;
      width: 100%;
      height: 100%;
      padding: 8vh 42px 5vh;
    }
    .copy-wrap {
      width: min(620px,47vw);
      transform: translateY(4vh);
    }
    .ghost-copy {
      margin: 0 0 21px;
      white-space: pre-line;
      font-size: clamp(18px,1.75vw,27px);
      line-height: 1.27;
      filter: blur(4px);
      user-select: none;
      pointer-events: none;
    }
    .typed-copy {
      min-height: 94px;
      margin: 0 0 22px;
      font-size: clamp(18px,1.75vw,27px);
      line-height: 1.34;
      letter-spacing: -.015em;
    }
    .caret {
      display: inline-block;
      width: 2px;
      height: 1.05em;
      margin-left: 3px;
      vertical-align: -0.13em;
      background: var(--ink);
      animation: blink 1s steps(1,end) infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 7px 7px;
      opacity: 0;
      transform: translateY(9px);
      transition: opacity .4s ease, transform .4s ease;
    }
    .actions.is-visible { opacity: 1; transform: none; }
    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
      padding: 7px 18px 7px;
      border: 1px solid rgba(0,0,0,.12);
      border-radius: 999px;
      background: rgba(255,255,255,.94);
      color: #050505;
      font-size: 14px;
      cursor: pointer;
      transition: background .18s ease,color .18s ease,transform .18s ease;
    }
    .pill:hover { background: #050505; color: #fff; transform: translateY(-1px); }
    .journey-pill {
      gap: 9px;
      border-color: rgba(255,255,255,.9);
      background: rgba(0,0,0,.08);
      color: #fff;
      text-shadow: 0 1px 12px rgba(0,0,0,.22);
      backdrop-filter: blur(7px);
    }
    .journey-pill:hover { background: #fff; color: #050505; text-shadow: none; }
    .journey-pill svg { width: 12px; height: 12px; }

    .scrub-hint {
      position: fixed;
      right: 28px;
      bottom: 22px;
      z-index: 8;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 11px;
      letter-spacing: .08em;
      text-transform: uppercase;
      opacity: .56;
      user-select: none;
      pointer-events: none;
    }
    .scrub-line {
      width: 48px;
      height: 1px;
      background: currentColor;
      position: relative;
      overflow: hidden;
    }
    .scrub-line::after {
      content: "";
      position: absolute;
      top: -1px;
      left: 0;
      width: 12px;
      height: 3px;
      background: currentColor;
      animation: travel 1.8s ease-in-out infinite alternate;
    }
    @keyframes travel { from{transform:translateX(0)} to{transform:translateX(36px)} }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      z-index: 45;
      transform: translate(-50%,15px);
      padding: 9px 14px;
      border-radius: 999px;
      background: rgba(0,0,0,.86);
      color: #fff;
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .22s ease,transform .22s ease;
    }
    .toast.show { opacity: 1; transform: translate(-50%,0); }

    @media (max-width: 900px) {
      .desktop-nav,.header-cta { display:none; }
      .mobile-toggle,.mobile-menu { display:flex; }
      .header { padding: 17px 20px; }
      .hero { align-items: flex-end; padding: 90px 20px 48px; }
      .copy-wrap { width: min(690px,100%); transform:none; }
      .ghost-copy { margin-bottom: 15px; font-size: clamp(18px,4.7vw,25px); }
      .typed-copy { min-height: 108px; margin-bottom: 17px; font-size: clamp(18px,4.7vw,25px); }
      .pill { min-height: 34px; padding: 7px 14px; font-size: 13px; }
      .scrub-hint { display:none; }
      .hero-video { object-position: 64% center; }
    }

    @media (max-width: 520px) {
      .brand { font-size: 22px; }
      .brand-mark { font-size: 25px; }
      .hero { padding-bottom: 34px; }
      .actions { gap: 6px; }
      .pill { font-size: 12px; padding-inline: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *,*::before,*::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .001ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="app" id="top">
    <div class="video-fallback" aria-hidden="true"></div>
    <video
      id="heroVideo"
      class="hero-video"
      src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260530_042513_df96a13b-6155-4f6e-8b93-c9dee66fba08.mp4"
      muted
      playsinline
      preload="auto"
      aria-hidden="true"
    ></video>
    <div class="wash" aria-hidden="true"></div>

    <header class="header">
      <a href="#top" class="brand" aria-label="LoveTree 홈">
        <span>LoveTree®</span><span class="brand-mark">✳︎</span>
      </a>

      <nav class="desktop-nav" aria-label="주요 메뉴">
        <a href="#" data-action="둘러보기">둘러보기</a><span>,&nbsp;</span>
        <a href="#" data-action="내 러브트리">내 러브트리</a><span>,&nbsp;</span>
        <a href="#" data-action="이야기">이야기</a><span>,&nbsp;</span>
        <a href="#" data-action="가이드">가이드</a>
      </nav>

      <a href="#start" class="header-cta">첫 순간 심기</a>

      <button id="menuToggle" class="mobile-toggle" type="button" aria-label="메뉴 열기" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </header>

    <div id="mobileMenu" class="mobile-menu" aria-hidden="true">
      <a href="#" data-action="둘러보기">둘러보기</a>
      <a href="#" data-action="내 러브트리">내 러브트리</a>
      <a href="#" data-action="이야기">이야기</a>
      <a href="#" data-action="가이드">가이드</a>
      <a href="#start" class="underlined" data-close-menu>첫 순간 심기</a>
    </div>

    <main class="hero">
      <section class="copy-wrap" aria-label="LoveTree 소개">
        <p class="ghost-copy">여기, 마음이 움직인 순간을 심어요.\nLoveTree는 그 다음 마음까지 이어지는 감정의 경로입니다.</p>
        <p class="typed-copy"><span id="typedText"></span><span id="caret" class="caret" aria-hidden="true"></span></p>

        <div id="start" class="actions">
          <button class="pill" type="button" data-action="첫 순간 심기">첫 순간 심기</button>
          <button class="pill" type="button" data-action="러브트리 둘러보기">러브트리 둘러보기</button>
          <button class="pill" type="button" data-action="내 러브트리 보기">내 러브트리 보기</button>
          <button class="pill" type="button" data-action="처음부터 다시 걷기">처음부터 다시 걷기</button>
          <button id="copyJourney" class="pill journey-pill" type="button" aria-label="LoveTree 핵심 여정 문구 복사">
            <span id="copyLabel">발견 → 마음 → 연결 → 다시 걷기</span>
            <svg aria-hidden="true" viewBox="0 0 12 12" fill="none">
              <rect x="1.25" y="1.25" width="6.5" height="6.5" rx="1" stroke="currentColor" stroke-width="1"/>
              <rect x="4.25" y="4.25" width="6.5" height="6.5" rx="1" stroke="currentColor" stroke-width="1"/>
            </svg>
          </button>
        </div>
      </section>
    </main>

    <div class="scrub-hint"><span>move cursor to scrub memory</span><span class="scrub-line"></span></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>

  <script>
    (function () {
      'use strict';

      var TYPEWRITER_TEXT = '처음 마음이 멈춘 순간을 심어보세요. 그때의 감정과, 왜 다음 순간으로 이어졌는지까지. 사랑이 자라온 길을 한 그루의 나무로 남깁니다.';
      var typedEl = document.getElementById('typedText');
      var caret = document.getElementById('caret');
      var actions = document.getElementById('start');
      var toast = document.getElementById('toast');
      var video = document.getElementById('heroVideo');
      var menuToggle = document.getElementById('menuToggle');
      var mobileMenu = document.getElementById('mobileMenu');
      var copyJourney = document.getElementById('copyJourney');
      var copyLabel = document.getElementById('copyLabel');
      var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var toastTimer = null;

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 1400);
      }

      // Typewriter: no framework/module dependency.
      if (reduceMotion) {
        typedEl.textContent = TYPEWRITER_TEXT;
        caret.style.display = 'none';
      } else {
        setTimeout(function () {
          var index = 0;
          var timer = setInterval(function () {
            index += 1;
            typedEl.textContent = TYPEWRITER_TEXT.slice(0,index);
            if (index >= TYPEWRITER_TEXT.length) {
              clearInterval(timer);
              caret.style.display = 'none';
            }
          },38);
        },600);
      }

      setTimeout(function () { actions.classList.add('is-visible'); },400);

      // Background video scrub. If the remote video fails, the CSS fallback remains visible,
      // so the page never collapses to a white screen.
      var prevX = null;
      var targetTime = 0;
      var seeking = false;
      var SENSITIVITY = 0.8;

      function clamp(n,min,max) { return Math.max(min,Math.min(max,n)); }
      function seekTowardTarget() {
        if (!video.duration || Number.isNaN(video.duration) || seeking) return;
        var desired = clamp(targetTime,0,video.duration);
        if (Math.abs(video.currentTime-desired) < .01) return;
        seeking = true;
        try { video.currentTime = desired; }
        catch (err) { seeking = false; }
      }
      video.addEventListener('loadedmetadata',function () { targetTime = video.currentTime || 0; });
      video.addEventListener('seeked',function () {
        seeking = false;
        if (Math.abs(video.currentTime-targetTime) > .01) seekTowardTarget();
      });
      video.addEventListener('error',function () {
        video.style.opacity = '0';
      });
      video.addEventListener('canplay',function () {
        video.style.opacity = '1';
      });

      if (!reduceMotion) {
        window.addEventListener('mousemove',function (event) {
          if (!video.duration || Number.isNaN(video.duration)) return;
          if (prevX === null) { prevX = event.clientX; return; }
          var delta = event.clientX-prevX;
          prevX = event.clientX;
          var offset = (delta/window.innerWidth)*SENSITIVITY*video.duration;
          targetTime = clamp(targetTime+offset,0,video.duration);
          seekTowardTarget();
        },{passive:true});
        document.documentElement.addEventListener('mouseleave',function () { prevX = null; });
      }

      function setMenu(open) {
        menuToggle.classList.toggle('is-open',open);
        mobileMenu.classList.toggle('is-open',open);
        menuToggle.setAttribute('aria-expanded',String(open));
        menuToggle.setAttribute('aria-label',open?'메뉴 닫기':'메뉴 열기');
        mobileMenu.setAttribute('aria-hidden',String(!open));
      }
      menuToggle.addEventListener('click',function () {
        setMenu(!mobileMenu.classList.contains('is-open'));
      });
      document.querySelectorAll('[data-close-menu]').forEach(function (el) {
        el.addEventListener('click',function () { setMenu(false); });
      });
      document.addEventListener('keydown',function (event) {
        if (event.key === 'Escape') setMenu(false);
      });

      document.querySelectorAll('[data-action]').forEach(function (el) {
        el.addEventListener('click',function (event) {
          event.preventDefault();
          setMenu(false);
          showToast(el.getAttribute('data-action')+' · 제품 연결 전 디자인 후보');
        });
      });

      function legacyCopy(text) {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        var ok = false;
        try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
        document.body.removeChild(ta);
        return ok;
      }
      copyJourney.addEventListener('click',function () {
        var text = '발견 → 마음 → 연결 → 다시 걷기';
        function done(ok) {
          if (ok) {
            copyLabel.textContent = '복사했어요';
            setTimeout(function () { copyLabel.textContent = text; },1500);
          } else {
            showToast(text);
          }
        }
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(text).then(function(){done(true);}).catch(function(){done(legacyCopy(text));});
        } else {
          done(legacyCopy(text));
        }
      });
    })();
  </script>
</body>
</html>
