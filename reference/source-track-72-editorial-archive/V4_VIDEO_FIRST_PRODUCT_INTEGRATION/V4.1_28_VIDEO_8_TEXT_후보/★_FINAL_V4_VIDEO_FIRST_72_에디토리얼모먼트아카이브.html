function rememberVideoTimes(){document.querySelectorAll('video[data-video-id]').forEach(v=>{videoTimes[v.dataset.videoId]=v.currentTime;v.pause()})}
let io=new IntersectionObserver(entries=>{entries.forEach(e=>{const v=e.target;if(e.intersectionRatio>=.30){if(videoTimes[v.dataset.videoId]!=null&&Math.abs(v.currentTime-videoTimes[v.dataset.videoId])>.25)v.currentTime=videoTimes[v.dataset.videoId];v.play().catch(()=>{})}else if(e.intersectionRatio<=.08){videoTimes[v.dataset.videoId]=v.currentTime;v.pause()}})},{threshold:[0,.08,.30,.6,1]});
function wireVideos(){document.querySelectorAll('video[data-video-id]').forEach(v=>{if(videoTimes[v.dataset.videoId]!=null)v.currentTime=videoTimes[v.dataset.videoId];io.observe(v)})}
function wireCards(){document.querySelectorAll('.card').forEach(c=>{c.addEventListener('click',()=>openViewer(c.dataset.id));c.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openViewer(c.dataset.id)}})})}
function setFilter(next){if(next===active)return;savedScroll=scrollY;rememberVideoTimes();active=next;document.querySelectorAll('.filter[data-filter]').forEach(b=>b.classList.toggle('on',b.dataset.filter===active));render();scrollTo(0,Math.min(savedScroll,document.documentElement.scrollHeight-innerHeight));}
document.querySelectorAll('.filter[data-filter]').forEach(b=>b.addEventListener('click',()=>setFilter(b.dataset.filter)));
function detailHTML(it){if(it.type==='connection'){const edge=(it.text||[]).find(t=>String(t).includes('→'))||'호감 → 확신';const [before,after]=edge.split('→').map(x=>x.trim());return `<div class="detailCard"><div class="detailMeta">CONNECTION · ${it.id.toUpperCase()}</div><h2>${esc(it.title)}</h2><div class="relation"><div>이전 감정<br><strong>${esc(before||'호감')}</strong></div><div class="arrow">→</div><div>이후 감정<br><strong>${esc(after||'확신')}</strong></div></div><p>${esc((it.text||[]).filter(t=>!String(t).includes('→')).join(' '))}</p><p>Previous Moment → Next Moment</p></div>`} return `<div class="detailCard"><div class="detailMeta">${esc(it.type.toUpperCase())} · ${it.id.toUpperCase()}</div><h2>${esc(it.title)}</h2><p>${esc((it.text||[]).join(' '))}</p><p>Source: ${esc(it.source||'LoveTree')}</p></div>`}
function openViewer(id){const it=byId[id];lastFocus=document.activeElement;savedScroll=scrollY;viewerTitle.textContent=it.title;viewerType.textContent=it.type.toUpperCase();document.body.style.overflow='hidden';viewer.classList.add('open');viewer.setAttribute('aria-hidden','false');if(it.type==='video'&&it.video){const inline=document.querySelector(`video[data-video-id="${id}"]`);const t=inline?inline.currentTime:(videoTimes[id]||0);if(inline)inline.pause();viewerBody.innerHTML=`<video id="viewerVideo" src="${it.video}" poster="${it.poster}" muted controls autoplay playsinline></video>`;const vv=document.getElementById('viewerVideo');vv.addEventListener('loadedmetadata',()=>{vv.currentTime=Math.min(t,Math.max(0,vv.duration-.05));vv.play().catch(()=>{})},{once:true})} else if((it.type==='photo'||it.type==='object')&&it.qualityStatus!=='DO_NOT_USE'&&it.src){viewerBody.innerHTML=`<img src="${it.src}" alt="${esc(it.title)}">`} else viewerBody.innerHTML=detailHTML(it);document.getElementById('viewerClose').focus()}
function closeViewer(){const vv=document.getElementById('viewerVideo');if(vv){const id=[...document.querySelectorAll('.card')].find(c=>c.getAttribute('aria-label')===viewerTitle.textContent)?.dataset.id;if(id)videoTimes[id]=vv.currentTime;vv.pause()}viewer.classList.remove('open');viewer.setAttribute('aria-hidden','true');viewerBody.innerHTML='';document.body.style.overflow='';scrollTo(0,savedScroll);if(lastFocus?.focus)lastFocus.focus();wireVideos()}
document.getElementById('viewerClose').addEventListener('click',closeViewer);viewer.addEventListener('click',e=>{if(e.target===viewer)closeViewer()});addEventListener('keydown',e=>{if(e.key==='Escape'&&viewer.classList.contains('open'))closeViewer();if(e.key==='Tab'&&viewer.classList.contains('open')){const f=[...viewer.querySelectorAll('button,[controls],[tabindex]:not([tabindex="-1"])')].filter(x=>!x.disabled);if(!f.length)return;const a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}});

// === GATE C1 viewer extension: B1 modal preserved, content layer upgraded ===
let c1ViewerMomentId=null;
let c1ReplayMode=false;
let c1TransitionTimer=null;
function c1PathStep(id){return C1_PATH_BY_ID[id]||null}
function c1NoteFor(it){if(it.text?.length)return it.text.filter(t=>!String(t).includes('→')&&!String(t).includes('CONNECTION LANDMARK')).join(' ');return ''}
function c1DateFor(it){const p=c1PathStep(it.id);if(p?.date)return p.date;const m=String(it.title||'').match(/20\d\d\.\d\d\.\d\d/);return m?m[0]:'날짜 미기록'}
function c1EmotionFor(it){return c1PathStep(it.id)?.emotion || (it.type==='connection'?((it.text||[]).find(t=>String(t).includes('→'))||'연결').split('→').pop().trim():'미기록')}
function c1ArchiveNeighbor(id,delta){const i=ITEMS.findIndex(x=>x.id===id);const n=ITEMS[i+delta];return n?n.id:null}
function c1PauseViewerVideo(){const vv=document.getElementById('viewerVideo');if(!vv)return;const id=c1ViewerMomentId;if(id)videoTimes[id]=vv.currentTime;vv.pause()}
function c1MediaHTML(it){
  if(it.type==='video'&&it.video)return `<video id="viewerVideo" src="${it.video}" poster="${it.poster}" muted controls autoplay playsinline></video>`;
  if((it.type==='photo'||it.type==='object')&&it.qualityStatus!=='DO_NOT_USE'&&it.src)return `<img src="${it.src}" alt="${esc(it.title)}">`;
  if(it.qualityStatus==='DO_NOT_USE')return `<div class="c1NoMedia"><small>MOMENT MEDIA · DO_NOT_USE</small><h3>${esc(it.title)}</h3><p>원본 Moment는 유지하지만 B1 Fit Audit에서 문제 media만 제외되었습니다. 이 Detail은 metadata와 감정 경로를 계속 보존합니다.</p></div>`;
  if(it.type==='memo')return `<div class="c1NoMedia"><small>MEMO</small><h3>${esc(it.title)}</h3><p>${esc(c1NoteFor(it))}</p></div>`;
  if(it.type==='connection')return `<div class="c1NoMedia"><small>CONNECTION SURFACE</small><h3>${esc(it.title)}</h3><p>${esc((it.text||[]).join(' '))}</p></div>`;
  return `<div class="c1NoMedia"><small>MOMENT</small><h3>${esc(it.title)}</h3><p>${esc(c1NoteFor(it)||'저장된 Moment metadata')}</p></div>`;
}
function c1ConnectionHTML(it){const step=c1PathStep(it.id);if(!step)return `<div class="c1PathHint">이 Moment는 C1 대표 감정 경로에 포함되지 않습니다. Archive 순서와 Connection은 별개입니다.</div>`; const next=step.connectedTo?byId[step.connectedTo]:null; const prev=step.connectedFrom?byId[step.connectedFrom]:null; const nextEmotion=next?c1EmotionFor(next):null; const transition=next?`${esc(step.emotion)} → ${esc(nextEmotion)}`:`${esc(step.emotion)} · PATH END`; return `<section class="c1Connection" id="c1Connection" aria-label="감정 Connection"><div class="c1Emotion">${transition}</div>${step.connectionReason?`<p class="c1Reason" id="c1Reason">${esc(step.connectionReason)}</p>`:`<p class="c1Reason">대표 감정 경로의 마지막 Moment입니다.</p>`}${next?`<button type="button" class="c1ConnectedBtn" data-connected-to="${next.id}">연결된 순간으로 → <span>${esc(next.title)}</span></button>`:''}${prev?`<button type="button" class="c1PrevConnected" data-connected-prev="${prev.id}">← 이전 Connected Moment</button>`:''}</section>`}
function c1ReplayHTML(it){const step=c1PathStep(it.id);if(!step)return ''; const label=step.pathOrder===1?'처음부터 다시 걷기':'이 경로 처음부터 보기';return `<button type="button" class="c1ReplayBtn" id="c1ReplayStart">${label}</button>${c1ReplayMode?`<button type="button" class="c1ExitBtn" id="c1ReplayExit">Replay 종료 · Archive로 돌아가기</button>`:''}`}
function c1ViewerHTML(it){const step=c1PathStep(it.id);const prevA=c1ArchiveNeighbor(it.id,-1),nextA=c1ArchiveNeighbor(it.id,1);const replayBadge=c1ReplayMode&&step?`<div class="c1ReplayBadge">REPLAY <span class="c1ReplayStep">${String(step.pathOrder).padStart(2,'0')} / ${String(C1_PATH_TOTAL).padStart(2,'0')}</span></div>`:''; return `<div class="c1Shell" id="c1Shell"><section class="c1Media">${c1MediaHTML(it)}</section><aside class="c1Info"><div class="c1Eyebrow">MOMENT DETAIL · ${esc(it.id.toUpperCase())}</div>${replayBadge}<h2 class="c1Title">${esc(it.title)}</h2><div class="c1Identity"><div class="c1MetaBox"><small>DATE</small><strong>${esc(c1DateFor(it))}</strong></div><div class="c1MetaBox"><small>EMOTION</small><strong>${esc(c1EmotionFor(it))}</strong></div><div class="c1MetaBox"><small>TYPE</small><strong>${esc(it.type.toUpperCase())}</strong></div><div class="c1MetaBox"><small>SOURCE</small><strong>${esc(it.source||'LoveTree')}</strong></div></div>${c1NoteFor(it)?`<p class="c1Note">${esc(c1NoteFor(it))}</p>`:''}<div class="c1Eyebrow">CONNECTION · 감정의 다음 이유</div>${c1ConnectionHTML(it)}${c1ReplayHTML(it)}<section class="c1Secondary"><div class="c1SecondaryLabel">ARCHIVE ORDER · 단순 목록 위치</div><div class="c1ArchiveNav"><button type="button" data-archive-id="${prevA||''}" ${prevA?'':'disabled'}>← Archive 이전</button><button type="button" data-archive-id="${nextA||''}" ${nextA?'':'disabled'}>Archive 다음 →</button></div><div class="c1PathHint">Archive order는 기록 목록 순서이며, 위의 Connected Moment와 같은 개념이 아닙니다.</div></section></aside></div>`}
function c1WireViewerControls(){
  viewerBody.querySelectorAll('[data-connected-to]').forEach(btn=>btn.addEventListener('click',()=>c1GoConnected(btn.dataset.connectedTo)));
  viewerBody.querySelectorAll('[data-connected-prev]').forEach(btn=>btn.addEventListener('click',()=>c1GoConnected(btn.dataset.connectedPrev,true)));
  viewerBody.querySelectorAll('[data-archive-id]').forEach(btn=>btn.addEventListener('click',()=>{if(btn.dataset.archiveId){c1ReplayMode=false;c1ShowMoment(btn.dataset.archiveId,{archiveNav:true})}}));
  document.getElementById('c1ReplayStart')?.addEventListener('click',c1StartReplay);
  document.getElementById('c1ReplayExit')?.addEventListener('click',closeViewer);
}
function c1PrepareViewerVideo(it){if(it.type!=='video'||!it.video)return;const inline=document.querySelector(`video[data-video-id="${it.id}"]`);const t=inline?inline.currentTime:(videoTimes[it.id]||0);if(inline)inline.pause();const vv=document.getElementById('viewerVideo');if(vv)vv.addEventListener('loadedmetadata',()=>{vv.currentTime=Math.min(t,Math.max(0,vv.duration-.05));vv.play().catch(()=>{})},{once:true})}
function c1UpdateHead(it){viewerTitle.textContent=it.title;viewerType.textContent=it.type.toUpperCase();const step=c1PathStep(it.id);const hs=document.getElementById('replayHeadStatus');hs.textContent=c1ReplayMode&&step?`REPLAY ${String(step.pathOrder).padStart(2,'0')} / ${String(C1_PATH_TOTAL).padStart(2,'0')} · ${step.emotion}`:'';document.getElementById('replayExitHead').hidden=!c1ReplayMode}
function c1ShowMoment(id,opts={}){const it=byId[id];if(!it)return;c1PauseViewerVideo();c1ViewerMomentId=id;c1UpdateHead(it);viewerBody.innerHTML=c1ViewerHTML(it);c1WireViewerControls();c1PrepareViewerVideo(it);if(opts.announce!==false){const a=document.getElementById('c1Announce');const step=c1PathStep(id);a.textContent=step?`${step.pathOrder}번째 경로, ${step.emotion}, ${it.title}`:`${it.title} Moment Detail`} }
function openViewer(id){const it=byId[id];if(!it)return;lastFocus=document.activeElement;savedScroll=scrollY;c1ReplayMode=false;c1ViewerMomentId=id;document.body.style.overflow='hidden';viewer.classList.add('open');viewer.setAttribute('aria-hidden','false');c1ShowMoment(id,{announce:false});document.getElementById('viewerClose').focus()}
function c1GoConnected(targetId,isBack=false){if(!targetId||!byId[targetId])return;const current=c1PathStep(c1ViewerMomentId);const box=document.getElementById('c1Connection');box?.classList.add('isReasoning');const ann=document.getElementById('c1Announce');if(current?.connectionReason&&!isBack)ann.textContent=`Connection 이유: ${current.connectionReason}`;clearTimeout(c1TransitionTimer);c1TransitionTimer=setTimeout(()=>{const shell=document.getElementById('c1Shell');shell?.classList.add('isLeaving');setTimeout(()=>c1ShowMoment(targetId),180)},620)}
function c1StartReplay(){const root=C1_PATH[0];c1ReplayMode=true;const a=document.getElementById('c1Announce');a.textContent=`Replay 시작. 총 ${C1_PATH_TOTAL}개 Moment를 처음부터 다시 걷습니다.`;c1ShowMoment(root.id);}
function closeViewer(){clearTimeout(c1TransitionTimer);c1PauseViewerVideo();c1ReplayMode=false;c1ViewerMomentId=null;viewer.classList.remove('open');viewer.setAttribute('aria-hidden','true');viewerBody.innerHTML='';document.getElementById('replayHeadStatus').textContent='';document.getElementById('replayExitHead').hidden=true;document.body.style.overflow='';scrollTo(0,savedScroll);if(lastFocus?.focus)lastFocus.focus();wireVideos()}
document.getElementById('replayExitHead').addEventListener('click',closeViewer);
addEventListener('keydown',e=>{if(!viewer.classList.contains('open'))return;if(e.key!=='ArrowRight'&&e.key!=='ArrowLeft')return;const el=document.activeElement;if(el&&(['INPUT','TEXTAREA','SELECT','BUTTON','VIDEO'].includes(el.tagName)||el.isContentEditable))return;const step=c1PathStep(c1ViewerMomentId);if(!step)return;const target=e.key==='ArrowRight'?step.connectedTo:step.connectedFrom;if(target){e.preventDefault();c1GoConnected(target,e.key==='ArrowLeft')}});

let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(render,100)});render();window.__LT72_B1__={ITEMS,getActive:()=>active,setFilter,videoTimes};window.__LT72_C1__={PATH:C1_PATH,getViewerMoment:()=>c1ViewerMomentId,isReplay:()=>c1ReplayMode,startReplay:c1StartReplay,openViewer,c1GoConnected};
</script></body></html>
