<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LoveTree · Human Emotional Path Motion Archive</title>
<style>
:root{--bg:#0b0b0b;--text:#f2f2f2;--title:#b8b8b8;--muted:#777;--line:#414141;--cyan:#bff8ff}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh;display:flex;align-items:center;justify-content:center}
.wrap{width:min(1120px,94vw);padding:54px 28px 70px}
.eyebrow{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#696969;margin-bottom:18px}
h1{margin:0;color:var(--title);font-size:clamp(54px,7.4vw,102px);font-weight:700;line-height:.96;letter-spacing:-.065em;max-width:980px}
h1 span{display:block}
.version{margin-top:18px;font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:#555}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:56px}
a.card{min-height:220px;border:1px solid var(--line);padding:34px 28px 30px;color:inherit;text-decoration:none;display:flex;flex-direction:column;justify-content:space-between;background:#0d0d0d;transition:.22s ease}
a.card:hover{border-color:#8c8c8c;background:#111;transform:translateY(-2px)}
.label{font-size:11px;letter-spacing:.19em;text-transform:uppercase;color:#fff}
.name{font-size:clamp(34px,4vw,52px);line-height:.98;font-weight:800;letter-spacing:-.055em;color:#fff}
.desc{font-size:13px;color:var(--muted);letter-spacing:.01em}
.arrow{float:right;color:#9a9a9a;font-size:24px;font-weight:400}
@media(max-width:720px){.wrap{padding:36px 18px 44px}.choices{grid-template-columns:1fr;margin-top:38px}a.card{min-height:170px}}
</style>
</head>
<body>
<main class="wrap">
  <div class="eyebrow">TRACK 68 · MODEL ARCHIVE</div>
  <h1>
    <span>LoveTree</span>
    <span>Human Emotional Path</span>
    <span>Motion Archive</span>
  </h1>
  <div class="version">V3.3.2 · CODEX PORTALS / C14 ASSET FIX</div>

  <section class="choices" aria-label="Choose model version">
    <a class="card" href="68_V3.3.1A_신비혼혈형_CODEX_PORTALS_C14FIX.html">
      <div class="label">VERSION A <span class="arrow">↗</span></div>
      <div class="name">MYSTIC / MIXED</div>
      <div class="desc">V1 layout · card portals · Codex works</div>
    </a>
    <a class="card" href="68_V3.3.1B_동양인형_CODEX_PORTALS_C14FIX.html">
      <div class="label">VERSION B <span class="arrow">↗</span></div>
      <div class="name">EAST ASIAN</div>
      <div class="desc">V1 layout · card portals · Codex works</div>
    </a>
  </section>
</main>
</body>
</html>
